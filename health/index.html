 ${w?`<div class="card"><h3>Báo cáo tuần <span>${esc(w.end.slice(8)+'/'+w.end.slice(5,7))} · ${w.score}/100</span></h3><b>${esc(w.title)}</b><ul style="margin:6px 0;padding-left:18px;font-size:13.5px">${w.lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul><p style="margin:0;font-size:13.5px">🎯 ${esc(w.goal)}</p></div>`:''}

/* ===== chi tiết ===== */
function sheet(id){const r=recoveryOf(0),d=day(0),Z=zones();let h='';const b2=(l,v,c)=>`<div class="bar2"><span>${l}</span><i><u style="width:${v||0}%;background:${c}"></u></i><b>${v??'–'}</b></div>`;
 if(id==='rec')h=`<h2>Hồi phục ${r?r.v+'%':''}</h2><p class="note">Cho biết cơ thể đã sẵn sàng tới đâu cho căng thẳng thể chất & tinh thần hôm nay.</p>${r?b2('Giấc ngủ',r.ss,'#a78bfa')+b2('HRV',r.pH,'#3ddc84')+b2('Nhịp nghỉ',r.pR,'#ff6b81')+b2('Tải hôm qua',r.pL,'#ff9f0a'):''}<p class="note">≥75 tốt: tập chất lượng được · 55–74 vừa: tập đều · &lt;55 thấp: tập nhẹ, ngủ sớm. Nhiệt độ da tăng ≥0,5°C sẽ trừ điểm.</p>`;
 else if(id==='str'){const z=d.hz||{};h=`<h2>Gắng sức ${strainOf(d)??'–'}%</h2><p class="note">Tổng tải tim mạch trong ngày từ phút ở các vùng nhịp tim và số bước (thang 0–100, càng lên cao càng khó tăng).</p><div class="list"><div><span>Đốt mỡ</span><b>${z.l||0}′</b></div><div><span>Tim mạch (×2)</span><b>${z.m||0}′</b></div><div><span>Đỉnh (×3)</span><b>${z.p||0}′</b></div><div><span>Bước</span><b>${(d.steps||0).toLocaleString('vi-VN')}</b></div></div><p class="note">Mục tiêu theo hồi phục: ${r?(r.v>=75?'60–80% (ngày tập chất lượng)':r.v>=55?'40–60% (tập vừa)':'dưới 35% (hồi phục)'):'–'}.</p>`}
 else if(id==='slp'){const ss=sleepScore(d);h=`<h2>Giấc ngủ ${hm(d.sleepMin)}</h2><p class="note">Điểm ${ss??'–'}/100 = thời lượng (50) + ngủ sâu & REM (25) + hiệu quả và thời gian vào giấc (25).</p><div class="list"><div><span>Lên giường → dậy</span><b>${esc((d.bed||'–')+' → '+(d.wake||'–'))}</b></div><div><span>Ngủ sâu</span><b>${d.deep??'–'}′</b></div><div><span>REM</span><b>${d.rem??'–'}′</b></div><div><span>Thức giấc</span><b>${d.awake??'–'}′</b></div><div><span>Mục tiêu</span><b>${hm(goalSleep())}</b></div></div><p class="note">Người trưởng thành cần 7–9 giờ. Ngủ sâu ~13–23%, REM ~20–25%. Giữ giờ lên giường lệch dưới ±30′ để nhịp sinh học ổn định.</p>`}
 else if(id==='energy')h=`<h2>Năng lượng ${energyNow()??'–'}%</h2><p class="note">Bắt đầu ngày từ mức hồi phục, giảm dần theo gắng sức và các giờ căng thẳng, hồi lại một chút khi bạn thư giãn. Dưới 30%: nên nghỉ, tránh quyết định quan trọng và tập nặng.</p>`;
 else if(id==='stress'){const s=stressOf(d);h=`<h2>Stress hôm nay ${s&&s.avg!=null?s.avg:'–'}</h2><p class="note">Ước tính từng giờ: nhịp tim lúc bạn ngồi yên cao hơn nhịp nghỉ bao nhiêu. Giờ có vận động (≥600 bước) được tô sọc cam và không tính là stress.</p>${s?`<div class="list">${s.pts.map(p=>`<div><span>${p.h}h · ♥${p.hr}</span><b style="color:${p.act?'#ff9f0a':stressCol(p.v)}">${p.act?'vận động':p.v+' · '+stressLbl(p.v)}</b></div>`).join('')}</div>`:''}<p class="note">Giảm nhanh: thở 4-6 (hít 4s, thở ra 6s) trong 5 phút, đi bộ 10 phút, uống nước, tránh cà phê sau 14h.</p>`}
 else if(id.startsWith('v-')){const k=id.slice(2),names={hrv:'HRV',rhr:'Nhịp tim nghỉ',spo2:'SpO₂',br:'Nhịp thở',tempD:'Nhiệt độ da'},info={hrv:'Độ biến thiên nhịp tim khi ngủ. Cao hơn mức nền = hệ thần kinh thư giãn, hồi phục tốt; thấp kéo dài = thiếu ngủ, căng thẳng, tập quá sức hoặc sắp ốm.',rhr:'Nhịp tim lúc nghỉ. Tăng ≥5 bpm so với nền thường do thiếu ngủ, rượu bia, mất nước, căng thẳng hoặc sắp ốm. Giảm dần theo tháng = tim khoẻ hơn.',spo2:'Độ bão hoà oxy trung bình khi ngủ. Bình thường 95–100%. Thấp kéo dài (<92%) nên đi khám.',br:'Số lần thở/phút khi ngủ, thường 12–20. Tăng so với nền có thể là dấu hiệu nhiễm trùng hô hấp.',tempD:'Chênh lệch nhiệt độ da ban đêm so với nền của bạn. Tăng ≥0,5°C vài đêm liền: có thể sắp ốm.'};
  h=`<h2>${names[k]}</h2><p class="note">${info[k]}</p>${lineChart(k,'#3ddc84',v=>k==='tempD'?(v>0?'+':'')+v.toFixed(2):k==='spo2'||k==='br'?v.toFixed(1):Math.round(v),30)}`}
 $('#sheetIn').innerHTML='<div class="grab"></div>'+h;$('#sheet').classList.add('on')}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')e.currentTarget.classList.remove('on')});
/* ===== bác sĩ AI ===== */
let busy=false;
async function ask(text){text=(text||'').trim();if(!text||busy)return;if(!user){toast('Cần đăng nhập Google trước');return}
 const a=docLoad();a.push({role:'user',text});docSaveL(a);const c=$('#chat');c.insertAdjacentHTML('beforeend',`<div class="msg me">${esc(text)}</div><div class="msg ai typing" id="ty"><i></i><i></i><i></i></div>`);scrollTo(0,document.body.scrollHeight);
 $('#docIn').value='';busy=true;let rep;
 try{const tok=await user.getIdToken();const r=await fetch(DOC_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({idToken:tok,action:'chat',messages:a.slice(-12)})});const j=await r.json();rep=j.reply?{role:'model',text:j.reply}:{role:'model',text:j.msg||'Có lỗi, thử lại nhé.',err:1}}
 catch(e){rep={role:'model',text:'Không kết nối được Bác sĩ AI. Kiểm tra mạng rồi thử lại.',err:1}}
 busy=false;if(!rep.err){const b=docLoad();b.push(rep);docSaveL(b)}const t=$('#ty');if(t)t.remove();const c2=$('#chat');if(c2){c2.insertAdjacentHTML('beforeend',`<div class="msg ai${rep.err?' err':''}">${md(rep.text)}</div>`);scrollTo(0,document.body.scrollHeight)}}
$('#docSend').onclick=()=>ask($('#docIn').value);

document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-range],[data-sheet],[data-q],#pushOn,#signout,#docClear');if(!t)return;
 if(t.dataset.tab){tab=t.dataset.tab;history.replaceState(null,'','?tab='+tab);render();scrollTo(0,0)}else if(t.dataset.range){range=+t.dataset.range;render()}else if(t.dataset.sheet)sheet(t.dataset.sheet);else if(t.dataset.q)ask(t.dataset.q);
 else if(t.id==='pushOn')pushEnable();else if(t.id==='signout'&&fb){fb.auth.signOut(fb.A);localStorage.removeItem(LS)}else if(t.id==='docClear'){if(!t.dataset.sure){t.dataset.sure=1;t.textContent='Bấm lần nữa để xoá';return}localStorage.removeItem(LSDOC);render()}});
/* ===== thông báo đẩy ===== */
let swReg=null;if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(r=>swReg=r).catch(()=>{});
async function pushEnable(){try{if(!user){toast('Cần đăng nhập trước');return}if(!window.Notification||!('PushManager' in window)){toast('Trình duyệt này chưa hỗ trợ thông báo đẩy');return}

 const m=await import('https://www.gstatic.com/firebasejs/13.3.0/firebase-messaging.js');if(m.isSupported&&!(await m.isSupported())){toast('Thiết bị chưa hỗ trợ');return}
 const tk=await m.getToken(m.getMessaging(fb.app),{vapidKey:VAPID,serviceWorkerRegistration:reg});if(!tk)throw 'notoken';
 const ua=/iPhone/.test(navigator.userAgent)?'iPhone':/iPad/.test(navigator.userAgent)||navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform)?'iPad':/Android/.test(navigator.userAgent)?'Android':/Win/.test(navigator.platform)?'Windows':/Mac/.test(navigator.platform)?'Mac':'Web';
 await fb.fs.runTransaction(fb.D,async tx=>{const sn=await tx.get(ref);const dd=sn.exists()?sn.data():{};let st=dd.s?JSON.parse(dd.s):null;if(!st)st={v:1,cards:{},days:{},newLog:{},updated:0};if(st.v!==1)throw new Error('state');
  const acad=st.acad&&st.acad.v===1?st.acad:{v:1};acad.push=acad.push||{tokens:[]};acad.push.tokens=(acad.push.tokens||[]).filter(x=>x.t!==tk);acad.push.tokens.push({t:tk,at:Date.now(),ua:ua+' · Sức khoẻ',app:'health'});acad.push.tokens=acad.push.tokens.slice(-8);
  acad.updatedAt=Math.max(Date.now(),(acad.updatedAt||0)+1);st.acad=acad;st.updated=Math.max(Date.now(),(st.updated||0)+1);tx.set(ref,{s:JSON.stringify(st),v:1,updated:fb.fs.serverTimestamp()},{merge:true})});
 localStorage.setItem('health-push-tok',tk);reg.showNotification('Sức khoẻ · đã bật thông báo',{body:'Bắp sẽ báo lúc 8:30 · 9h · 17h · 21h 🐱',icon:'icon-192.png',tag:'h-test'});toast('Đã bật thông báo trên '+ua);render()}
 catch(e){toast('Bật thông báo lỗi: '+String(e&&e.message||e).slice(0,80))}}
/* ===== Firebase ===== */
function adopt(st){const a=st&&st.acad;if(!a||a.v!==1)return;A=a;H=a.health||{days:{}};H.days=H.days||{};try{localStorage.setItem(LS,JSON.stringify({acad:{health:H,push:a.push},at:Date.now()}))}catch(e){}render()}
if(H.days&&Object.keys(H.days).length){$('#gate').hidden=true;render()}
(async()=>{try{const b='https://www.gstatic.com/firebasejs/13.3.0/';const [app,auth,fs]=await Promise.all([import(b+'firebase-app.js'),import(b+'firebase-auth.js'),import(b+'firebase-firestore.js')]);
 const a=app.initializeApp(FBCFG);fb={auth,fs,app:a,A:auth.getAuth(a),D:fs.getFirestore(a)};let unsub=null;
 auth.onAuthStateChanged(fb.A,u=>{user=u;if(unsub){unsub();unsub=null}if(u){ref=fs.doc(fb.D,'users',u.uid);$('#gate').hidden=true;unsub=fs.onSnapshot(ref,sn=>{const dd=sn.data()||{};try{adopt(dd.s?JSON.parse(dd.s):null)}catch(e){}},()=>{});render()}else{ref=null;if(!(H.days&&Object.keys(H.days).length))$('#gate').hidden=false;render()}});
 $('#signin').onclick=()=>auth.signInWithPopup(fb.A,new auth.GoogleAuthProvider()).catch(e=>{if(/popup/.test(e.code||''))auth.signInWithRedirect(fb.A,new auth.GoogleAuthProvider());else $('#gateMsg').textContent='Đăng nhập lỗi: '+(e.code||e)})}
 catch(e){$('#gateMsg').textContent='Không tải được Firebase, kiểm tra mạng.'}})();
setInterval(()=>{if(!document.hidden&&tab==='today')render()},5*60e3);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
render();
