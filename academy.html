<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Học viện của Tuấn</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: playful toy-island campus, calm and focused as a study tool
   IDEA: a voxel island where every building is a class you walk into
   PICTURE: full-screen isometric 3D world lit by the real clock
   COLOUR and TYPE: grass green world, ninja-red accent, ink-blue support; Be Vietnam Pro
   LAYOUT: world fills the screen; HUD cards in corners; room drawer right, bottom sheet on phones */
:root{color-scheme:light dark;--panel:light-dark(rgba(255,252,246,.95),rgba(22,26,36,.95));--solid:light-dark(#fffcf6,#161a24);--ink:light-dark(#1d1b18,#f2efe8);--mute:light-dark(#6b665d,#a8a397);--line:light-dark(#e8e0d2,#2d3344);--chip:light-dark(#f3ece0,#232a39);--acc:#e8553a;--acc2:#2f5fd0;--ok:#1f9e6a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#0b1633;color:var(--ink);font:15px/1.5 'Be Vietnam Pro',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
#sky{position:fixed;inset:0}
#stars{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.5s}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 10px 6px;font-size:12.5px;font-weight:700;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.16);pointer-events:auto;cursor:pointer;will-change:transform}
.tag small{display:block;font-weight:500;color:var(--mute);font-size:11px;line-height:1.3}
.tag .bar{height:4px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}.tag .bar i{display:block;height:100%;background:var(--c)}
.tag.me{background:var(--acc);color:#fff;border:0;padding:2px 8px;font-size:11px;cursor:default}
.tag.arch{background:#1d2a4d;color:#fff;border:0;cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(10,20,40,.2);backdrop-filter:blur(10px)}
#hud-tl{position:fixed;left:14px;top:14px;padding:12px 14px;width:min(310px,calc(100vw - 86px))}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--acc);position:relative;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.logo:before{content:"";position:absolute;left:6px;right:6px;top:10px;height:12px;border-radius:5px;background:#f7d3bd}
.logo:after{content:"";position:absolute;left:12px;top:14px;width:3px;height:4px;background:#222;box-shadow:7px 0 #222}
.brand h1{font-size:16px;line-height:1.15;margin:0;font-weight:800}
.brand p{margin:0;font-size:11.5px;color:var(--mute)}
.clock{display:flex;align-items:baseline;gap:8px;margin-top:10px}
.clock b{font-size:30px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1}
.clock span{font-size:12.5px;color:var(--mute)}
#nowchip{display:block;width:100%;text-align:left;margin-top:10px;background:var(--chip);border:0;border-radius:12px;padding:8px 10px;cursor:pointer;font-size:13px;line-height:1.35}
#nowchip em{font-style:normal;font-size:11px;font-weight:700;color:var(--acc);display:block}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.stats div{background:var(--chip);border-radius:10px;padding:6px 7px}
.stats span{display:block;font-size:10.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats b{font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
#hud-tr{position:fixed;right:14px;top:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;transition:right .3s}
body.popen #hud-tr{right:min(450px,calc(100vw - 60px))}
body.popen #dock,body.popen #help{display:none}
#help{transition:opacity 1s}#help.off{opacity:0}
.ib{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(10,20,40,.18);font-weight:800;font-size:13px}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:focus-visible,.btn:focus-visible,button:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
#savebadge{font-size:11px;color:#fff;background:rgba(0,0,0,.35);padding:2px 8px;border-radius:20px;white-space:nowrap}
#lightpop{position:fixed;right:68px;top:66px;padding:14px;width:250px;display:none}
#lightpop.on{display:block}
#lightpop label{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600}
#lightpop input[type=range]{width:100%;margin-top:10px;accent-color:var(--acc)}
#lightpop p{margin:6px 0 0;font-size:12px;color:var(--mute)}
#pomo{position:fixed;left:14px;bottom:14px;padding:10px 12px;display:flex;gap:12px;align-items:center;width:min(330px,calc(100vw - 28px))}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .trk{stroke:var(--line)}.ring .prg{stroke:var(--acc);stroke-linecap:round;stroke-dasharray:175.9;transition:stroke-dashoffset .3s}
#pomo.brk .ring .prg{stroke:var(--ok)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.pc{flex:1}
.pm{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pm b{color:var(--ink)}
.pm select{border:1px solid var(--line);background:var(--solid);border-radius:8px;padding:3px 6px;font-size:13px;max-width:150px}
.pbtns{display:flex;gap:6px;margin-top:6px}
.btn{min-height:38px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--solid);cursor:pointer;font-weight:700;font-size:13.5px;white-space:nowrap}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{min-height:32px;padding:0 10px;font-size:12.5px;border-radius:9px}
#dock{position:fixed;right:14px;bottom:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:min(560px,calc(100vw - 370px))}
#dock button{border:1px solid var(--line);background:var(--panel);border-radius:12px;min-height:40px;padding:0 12px;font-weight:700;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:7px;box-shadow:0 6px 16px rgba(10,20,40,.15);white-space:nowrap}
#dock i{width:10px;height:10px;border-radius:3px;background:var(--c)}
#prompt{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);padding:10px 10px 10px 16px;display:none;align-items:center;gap:12px;max-width:calc(100vw - 28px)}
#prompt.on{display:flex}
#prompt span{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
kbd{font:700 11px 'Be Vietnam Pro';border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:1px 6px;color:var(--mute)}
#help{position:fixed;left:50%;top:18px;transform:translateX(-50%);font-size:12px;color:#fff;background:rgba(0,0,0,.35);padding:5px 12px;border-radius:20px;white-space:nowrap;pointer-events:none;max-width:calc(100vw - 760px);overflow:hidden;text-overflow:ellipsis}
@media (max-width:1150px){#help{display:none}}
#panel{position:fixed;right:14px;top:14px;bottom:14px;width:min(420px,calc(100vw - 28px));overflow-y:auto;transform:translateX(calc(100% + 30px));transition:transform .35s cubic-bezier(.2,.8,.2,1);padding:0 0 18px;overscroll-behavior:contain}
#panel.open{transform:none}
.ph{position:sticky;top:0;z-index:2;background:var(--solid);display:flex;gap:12px;align-items:center;padding:16px 16px 12px;border-bottom:1px solid var(--line);border-radius:16px 16px 0 0}
.pk{width:46px;height:46px;border-radius:13px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15)}
.ph h2{margin:0;font-size:18px;line-height:1.2}
.ph p{margin:2px 0 0;font-size:12.5px;color:var(--mute)}
.ph .x{margin-left:auto;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:transparent;font-size:22px;cursor:pointer;flex:none}
.st{font-weight:700;padding:1px 7px;border-radius:20px;font-size:11px;background:var(--chip)}
.st-now{background:#e8553a22;color:var(--acc)}.st-done{background:#1f9e6a22;color:var(--ok)}.st-past{background:#e3a21a26;color:#b07a0a}
.pb{padding:14px 16px 0}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats3 div{background:var(--chip);border-radius:12px;padding:8px 10px}
.stats3 span{display:block;font-size:11px;color:var(--mute)}
.stats3 b{font-size:18px;font-variant-numeric:tabular-nums}
.pbar{height:8px;border-radius:5px;background:var(--line);margin:10px 0 2px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--c);border-radius:5px}
.tabs{display:flex;gap:4px;margin:14px 0 10px;background:var(--chip);padding:4px;border-radius:12px;overflow-x:auto}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;min-height:36px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;padding:0 8px;color:var(--mute)}
.tabs button.on{background:var(--solid);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.list li{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:var(--solid)}
.list li.done .lt{text-decoration:line-through;color:var(--mute)}
.list input[type=checkbox]{width:20px;height:20px;margin:1px 0 0;accent-color:var(--c,var(--acc));flex:none}
.lt{flex:1;font-size:14px;line-height:1.4}
.lt a{color:var(--acc2);font-weight:600;text-decoration:none}
.lt a:hover{text-decoration:underline}
.lt small{display:block;color:var(--mute);font-size:12px}
.del{border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:18px;line-height:1;width:28px;height:28px;border-radius:8px;flex:none}
.del:hover{background:var(--chip);color:var(--acc)}
.add{display:grid;gap:6px;margin-top:10px;padding:10px;border:1px dashed var(--line);border-radius:12px}
.add input,.add select,textarea,.inp{width:100%;border:1px solid var(--line);background:var(--solid);border-radius:10px;padding:9px 10px;font-size:16px}
.add .row{display:flex;gap:6px}
textarea{min-height:180px;resize:vertical;line-height:1.5;font-size:15px}
.sec{margin-top:16px}
.sec h3{font-size:13px;margin:0 0 8px;color:var(--mute);font-weight:700}
.box{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--solid);font-size:13.5px}
.box p{margin:2px 0}
.gate{display:flex;gap:10px;align-items:flex-start}
.gate input{width:22px;height:22px;accent-color:var(--ok);flex:none}
.logrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:14px}
.logrow span{font-size:12.5px;color:var(--mute);margin-right:2px}
.empty{color:var(--mute);font-size:13px;padding:10px;border:1px dashed var(--line);border-radius:12px}
.note{font-size:11.5px;color:var(--mute);margin-top:10px}
.week{display:grid;gap:6px}
.wd{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;align-items:start;padding:8px 10px;border-radius:12px;background:var(--solid);border:1px solid var(--line)}
.wd.today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.wd>b{font-size:13px}
.blk{display:flex;gap:8px;font-size:13px;padding:2px 0;align-items:baseline}
.blk time{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;min-width:92px}
.blk i{width:8px;height:8px;border-radius:2px;background:var(--c);flex:none;align-self:center}
.blk.cur{color:var(--acc);font-weight:700}
.rm{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--solid)}
.rm .pk{width:36px;height:36px;font-size:13px;border-radius:10px}
.rm>div{flex:1}
.rm .pbar{margin:5px 0 0;height:6px}
.bars{display:grid;gap:7px}
.bars div{display:grid;grid-template-columns:110px minmax(0,1fr) 64px;gap:8px;align-items:center;font-size:12.5px}
.bars s{display:block;height:10px;border-radius:5px;background:var(--c);text-decoration:none;min-width:2px}
.bars em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.big{font-size:44px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid3 label{font-size:12px;color:var(--mute);display:grid;gap:4px}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-140%);background:#1d2a4d;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;transition:transform .35s;z-index:20;max-width:calc(100vw - 28px);text-align:center}
#toast.on{transform:translate(-50%,0)}
#fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font-weight:700;background:#0b1633;transition:opacity .6s;z-index:30}
#loading.off{opacity:0;pointer-events:none}
@media (max-width:900px){#help{display:none}#dock{max-width:calc(100vw - 28px);bottom:96px;right:14px;left:14px;justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}#prompt{bottom:150px}}
@media (max-width:700px){
 #hud-tl{padding:10px 12px}.clock b{font-size:24px}.stats b{font-size:12.5px}
 #panel{top:auto;left:0;right:0;bottom:0;width:100%;height:80vh;border-radius:20px 20px 0 0;transform:translateY(105%)}
 #panel.open{transform:none}
 body.popen #hud-tr{right:14px}
 #lightpop{right:68px;top:14px}
 .bars div{grid-template-columns:84px minmax(0,1fr) 56px}
}
@media (prefers-reduced-motion:reduce){#panel,#toast,#hud-tr{transition:none}}
</style>

<body>
<div id="sky"></div><div id="stars"></div>
<canvas id="c" tabindex="0" aria-label="Bản đồ học viện 3D"></canvas>
<div id="labels"></div>
<div id="fade"></div>

<section id="hud-tl" class="card" aria-live="polite">
 <div class="brand"><div class="logo"></div><div><h1 data-i="brand">Học viện của Tuấn</h1><p data-i="sub">Marketing Engineering · Tiếng Trung · Phòng làm việc</p></div></div>
 <div class="clock"><b id="clk">--:--</b><span id="dte"></span></div>
 <button id="nowchip"></button>
 <div class="stats"><div><span data-i="today">Hôm nay</span><b id="s-t">0</b></div><div><span data-i="week">Tuần này</span><b id="s-w">0</b></div><div><span data-i="streak">Chuỗi</span><b id="s-s">0</b></div><div><span data-i="total">Tổng</span><b id="s-a">0</b></div></div>

<nav id="hud-tr" aria-label="Công cụ">
 <span id="savebadge">…</span>

 <div id="lightpop" class="card">

 <input type="range" id="simh" min="0" max="24" step="0.25" value="12" aria-label="Giờ mô phỏng">

</div>
 <button class="ib" id="b-sched" data-t="schedule" title="Lịch tuần"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
 <button class="ib" id="b-certs" data-t="certs" title="Tủ chứng chỉ"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="M8.5 14 7 22l5-3 5 3-1.5-8"/></svg></button>
 <button class="ib" id="b-acct" data-t="acct" title="Tài khoản Google"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
 <button class="ib" id="b-set" data-t="settings" title="Cài đặt"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
</nav>


<section id="pomo" class="card">
 <div class="ring"><svg viewBox="0 0 64 64"><circle class="trk" cx="32" cy="32" r="28"/><circle class="prg" id="pprg" cx="32" cy="32" r="28"/></svg><b id="ptime">25:00</b></div>
 <div class="pc">
  <div class="pm"><b id="pmode">Tập trung</b><span>·</span><select id="pcls" aria-label="Lớp"></select></div>
  <div class="pbtns"><button class="btn pri" id="pstart">Bắt đầu</button><button class="btn" id="preset">Đặt lại</button><button class="btn" id="pskip" title="Bỏ qua">»</button></div>
 </div>

<div id="toast" role="status"></div>

const HSK_BOOKS=[{k:'HSK 1',re:/^h1-/,n:148},{k:'HSK 2',re:/^\d+-/,n:326},{k:'HSK 3',re:/^h3-/,n:361},{k:'HSK 4 上',re:/^h4-([1-9]|10)-/,n:397},{k:'HSK 4 下',re:/^h4-(1[1-9]|20)-/,n:413}];
const hDay=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function hskStats(){
 if(!HSK||!HSK.cards)return null;const now=Date.now(),ids=Object.keys(HSK.cards);
 const books=HSK_BOOKS.map(b=>{const mine=ids.filter(i=>b.re.test(i));return{k:b.k,n:b.n,l:mine.length,known:mine.filter(i=>(HSK.cards[i][2]||0)>=168).length}});
 let st=0,tt=now;const days=HSK.days||{};if(!days[hDay(tt)])tt-=864e5;while(days[hDay(tt)]){st++;tt-=864e5}
 return{learned:ids.length,known:ids.filter(i=>(HSK.cards[i][2]||0)>=168).length,due:ids.filter(i=>(HSK.cards[i][3]||0)<=now+3*36e5).length,xp:HSK.xp||0,streak:st,today:days[hDay()]||0,books};
}

function logMin(id,m,src){if(!m)return;S.totals[id]=(S.totals[id]||0)+m;S.sessions.push({d:dkey(new Date()),r:id,m,s:src});if(S.sessions.length>900)S.sessions=S.sessions.slice(-900);save();updateStats();updateTags()}
const fmtMin=m=>{m=Math.round(m||0);return m<60?m+' '+t('min'):Math.floor(m/60)+'h'+(m%60?' '+pad(m%60):'')};
function stats(){
 const by={};for(const s of S.sessions)by[s.d]=(by[s.d]||0)+s.m;
 const now=new Date(),dow=(now.getDay()+6)%7;let wk=0;
 for(let i=0;i<=dow;i++){const d=new Date(now);d.setDate(now.getDate()-i);wk+=by[dkey(d)]||0}
 let st=0;const d=new Date(now);if(!by[dkey(d)])d.setDate(d.getDate()-1);while(by[dkey(d)]){st++;d.setDate(d.getDate()-1)}
 return{t:by[dkey(now)]||0,wk,st,all:Object.values(S.totals).reduce((a,b)=>a+(+b||0),0)};
}

const UP=new THREE.Vector3(-1,0,-1).normalize(),RT=new THREE.Vector3(1,0,-1).normalize();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 let mx=0,mz=0;
 if(keys.has('w')||keys.has('arrowup')){mx+=UP.x;mz+=UP.z}
 if(keys.has('s')||keys.has('arrowdown')){mx-=UP.x;mz-=UP.z}
 if(keys.has('d')||keys.has('arrowright')){mx+=RT.x;mz+=RT.z}

 if(!mx&&!mz&&walk){const dx=walk.x-P.x,dz=walk.z-P.z,d=Math.hypot(dx,dz);
  if(d<.18){const id=walk.room;walk=null;if(id)openRoom(id)}else{mx=dx/d;mz=dz/d}}
 const ml=Math.hypot(mx,mz);let moving=false;
 if(ml>0){mx/=ml;mz/=ml;const sp=4.4*dt,ox=P.x,oz=P.z;
  if(walkable(P.x+mx*sp,P.z))P.x+=mx*sp;if(walkable(P.x,P.z+mz*sp))P.z+=mz*sp;
  const moved=Math.hypot(P.x-ox,P.z-oz);moving=moved>.001;
  P.rot=Math.atan2(mx,mz);
  if(walk){if(moved<sp*.25){walk.stuck+=dt;if(walk.stuck>.45){const id=walk.room;walk=null;if(id)goRoom(id)}}else walk.stuck=0}}
 player.position.set(P.x,0,P.z);
 let dr=P.rot-player.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));player.rotation.y+=dr*Math.min(1,dt*14);
 if(moving){walkT+=dt*11;legs[0].rotation.x=Math.sin(walkT)*.7;legs[1].rotation.x=-Math.sin(walkT)*.7;body.position.y=.72+(reduce?0:Math.abs(Math.sin(walkT))*.05)}
 else{legs[0].rotation.x*=.8;legs[1].rotation.x*=.8;body.position.y=.72+(reduce?0:Math.sin(now/600)*.012)}
 const off=(panelState&&innerWidth>700)?(cam.right-cam.left)/innerWidth*215:0;tgt.lerp(v3.set(P.x+RT.x*off,0,P.z+RT.z*off),Math.min(1,dt*5));cam.position.copy(tgt).add(CAM_OFF);cam.lookAt(tgt);

 if(ring.material.opacity>0)ring.material.opacity=Math.max(0,ring.material.opacity-dt*.6);
 if(!reduce){const p=riverGeo.attributes.position,a=p.array;for(let i=0;i<a.length;i+=3)a[i+2]=Math.sin(rBase[i+1]*.9+now/700)*.04+Math.cos(rBase[i]*2+now/900)*.02;p.needsUpdate=true}
 // proximity
 let nb=null,nd=1.7;for(const r of ROOMS){const d=Math.hypot(P.x-r.door[0],P.z-r.door[1]);if(d<nd){nd=d;nb=r}}

$('#pcls').addEventListener('change',e=>{PM.cls=e.target.value;savePM()});

/* ---------------- panel ---------------- */
const panel=$('#panel');let panelState=null;
function openRoom(id){const r=RM[id];if(r.kind==='board')openPanel({kind:'board'});else if(r.kind==='pomo')openPanel({kind:'pomo'});else openPanel({kind:r.kind,id,tab:'syllabus'})}
function openPanel(st){panelState=st;renderPanel();panel.classList.add('open');document.body.classList.add('popen');$('#prompt').classList.remove('on');walk=null}
function closePanel(){if(!panelState)return;panelState=null;panel.classList.remove('open');document.body.classList.remove('popen');near=null;canvas.focus({preventScroll:true})}
const head=(hex,k,title,sub)=>`<header class="ph" style="--c:${hex}"><div class="pk">${esc(k)}</div><div><h2>${esc(title)}</h2><p>${sub}</p></div><button class="x" data-act="close" aria-label="${t('close')}">×</button></header>`;
const linkOrText=(x,u)=>u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(tr(x))}</a>`:esc(tr(x));
function lessonsHTML(c){
 return `<ul class="list">${c.lessons.map(l=>`<li class="${l.done?'done':''}"><input type="checkbox" data-act="tl" data-id="${l.id}" ${l.done?'checked':''} aria-label="${esc(tr(l.t))}"><div class="lt">${linkOrText(l.t,safeUrl(l.url))}</div><button class="del" data-act="delL" data-id="${l.id}" aria-label="${t('del')}">×</button></li>`).join('')}</ul>
 <div class="add"><input name="t" placeholder="${t('lesson')}"><div class="row"><input name="u" placeholder="${t('link')}" inputmode="url"><button class="btn sm pri" data-act="addL">${t('add')}</button></div></div>`;
}
function docsHTML(c){
 return (c.docs.length?`<ul class="list">${c.docs.map(d=>`<li><div class="lt">${linkOrText(d.t,safeUrl(d.url))}${d.note?`<small>${esc(d.note)}</small>`:''}</div><button class="del" data-act="delD" data-id="${d.id}" aria-label="${t('del')}">×</button></li>`).join('')}</ul>`:`<div class="empty">${t('emptyDocs')}</div>`)+
 `<div class="add"><input name="t" placeholder="${t('title')}"><input name="u" placeholder="${t('link')}" inputmode="url"><div class="row"><input name="n" placeholder="${t('noteS')}"><button class="btn sm pri" data-act="addD">${t('add')}</button></div></div>`;
}
function certsHTML(c){
 return (c.certs.length?`<ul class="list">${c.certs.map(d=>`<li><div class="lt">${linkOrText(d.t,safeUrl(d.url))}<small>${esc(d.date||'')}</small></div><button class="del" data-act="delC" data-id="${d.id}" aria-label="${t('del')}">×</button></li>`).join('')}</ul>`:`<div class="empty">${t('emptyCerts')}</div>`)+
 `<div class="add"><input name="t" placeholder="${t('cname')}"><input name="u" placeholder="${t('link')}" inputmode="url"><div class="row"><input name="d" type="date" aria-label="${t('cdate')}"><button class="btn sm pri" data-act="addC">${t('add')}</button></div></div>`;
}
function nextZh(){const n=new Date();for(let k=0;k<8;k++){const d=new Date(n);d.setDate(n.getDate()+k);if([2,4,6].includes(d.getDay())){d.setHours(20,15,0,0);if(d>n||(k===0&&n<new Date(d.getTime()+90*60000)))return d}}return null}
function classPanel(){
 const st=panelState,r=RM[st.id],c=S.classes[st.id],p=lessonPct(st.id),s=status(st.id);
 let h=head(r.hex,r.short,tr(r.title),`${esc(tr(r.dates))} · <span class="st st-${s}">${t('status_'+s)}</span>`);
 h+=`<div class="pb" style="--c:${r.hex}"><div class="stats3"><div><span>${t('learned')}</span><b>${fmtMin(S.totals[r.id])}</b></div><div><span>${t('progress')}</span><b>${p}%</b></div><div><span>${t('certCount')}</span><b>${c.certs.length}</b></div></div><div class="pbar"><i style="width:${p}%"></i></div>`;
 if(r.kind==='zh'){
  const u=safeUrl(S.settings.zhUrl),nz=nextZh();
  const hs=hskStats();
  h+=`<div class="sec"><h3>${t('hskTitle')}</h3>`+(hs?`<div class="stats3"><div><span>${t('hskLearned')}</span><b>${hs.learned}</b></div><div><span>${t('hskKnown')}</span><b>${hs.known}</b></div><div><span>${t('hskDue')}</span><b>${hs.due}</b></div><div><span>${t('hskStreak')}</span><b>${hs.streak}</b></div><div><span>${t('hskXP')}</span><b>${hs.xp}</b></div><div><span>${t('hskToday')}</span><b>${hs.today}</b></div></div>
  <div class="bars" style="margin-top:10px">${hs.books.map(b=>`<div style="--c:${r.hex}"><span>${b.k}</span><s style="width:${Math.min(100,b.l/b.n*100).toFixed(1)}%"></s><em>${b.l}/${b.n}</em></div>`).join('')}</div>
  <div class="logrow" style="margin-top:8px"><span>${t('hskSynced',{t:new Date(hskAt).toLocaleTimeString(L==='vi'?'vi-VN':'en-GB',{hour:'2-digit',minute:'2-digit'})})}</span><button class="btn sm" data-act="hskRefresh">${t('refresh')}</button></div>`
  :ON_PAGES?(fb&&fb.user?`<div class="empty">${t('hskNone')}</div>`:`<div class="box"><p>${t('hskLogin')}</p><p style="margin-top:8px"><button class="btn pri" data-act="signIn">${t('signIn')}</button></p></div>`)
  :`<div class="box"><p>${t('acctArtifact')}</p><p style="margin-top:8px"><a class="btn pri" style="display:inline-flex;align-items:center;text-decoration:none" href="${PAGES_URL}" target="_blank" rel="noopener">${t('openPages')} ↗</a></p></div>`)+`</div>`;
  h+=`<div class="sec"><div class="box"><p><b>${t('classTime')}</b></p><p>${t('review')}</p>${nz?`<p>${t('nextClass')}: <b>${t(DAYS[nz.getDay()])} ${pad(nz.getDate())}/${pad(nz.getMonth()+1)}, 20:15</b></p>`:''}</div></div>
  <div class="sec"><h3>${t('appLink')}</h3>${u?`<p style="margin:0 0 8px"><a class="btn pri" style="display:inline-flex;align-items:center;text-decoration:none" href="${esc(u)}" target="_blank" rel="noopener">${t('openApp')} ↗</a></p>`:`<p class="note" style="margin:0 0 6px">${t('noApp')}</p>`}<input class="inp" data-act="zhurl" value="${esc(S.settings.zhUrl)}" placeholder="https://….github.io/…" inputmode="url"></div>`;
 }
 h+=`<nav class="tabs">${['syllabus','docs','certsTab','notes'].map(k=>`<button data-act="tab" data-tab="${k}" class="${st.tab===k?'on':''}">${t(k)}</button>`).join('')}</nav>`;
 if(st.tab==='syllabus'){h+=lessonsHTML(c);if(r.kind==='class')h+=`<div class="sec"><h3>${t('gate')}</h3><div class="box"><label class="gate"><input type="checkbox" data-act="gate" ${c.gate?'checked':''}><span><b>${esc(tr(r.gate))}</b><br><span style="color:var(--mute)">${t('output')}: ${esc(tr(r.out))}</span></span></label></div></div>`;h+=`<p class="note">${t('sample')}</p>`}
 else if(st.tab==='docs')h+=docsHTML(c);
 else if(st.tab==='certsTab')h+=certsHTML(c);
 else h+=`<textarea data-act="notes" placeholder="${t('notesPh')}">${esc(c.notes)}</textarea>`;
 h+=`<div class="logrow"><span>${t('logTime')}:</span>${[15,30,60].map(m=>`<button class="btn sm" data-act="log" data-m="${m}">+${m}′</button>`).join('')}<button class="btn sm pri" data-act="pomoHere">${t('pomoHere')}</button></div></div>`;
 return h;
}
function workPanel(){
 const r=RM.work,w=S.work,today=dkey(new Date()),ck=w.checks[today]||{},done=SLOTS.filter(s=>ck[s.id]).length;
 let h=head(r.hex,r.short,tr(r.title),`${t('workHours')} · ${t('checked',{a:done,b:SLOTS.length})}`);
 h+=`<div class="pb" style="--c:${r.hex}"><div class="pbar"><i style="width:${done/SLOTS.length*100}%"></i></div>
 <div class="sec"><h3>${t('workChecks')}</h3><ul class="list">${SLOTS.map(s=>`<li class="${ck[s.id]?'done':''}"><input type="checkbox" data-act="wc" data-id="${s.id}" ${ck[s.id]?'checked':''} aria-label="${esc(tr(s.t))}"><div class="lt"><b>${s.time}</b> · ${esc(tr(s.t))}</div></li>`).join('')}</ul></div>
 <div class="sec"><h3>${t('tasks')}</h3><ul class="list">${w.tasks.map(k=>`<li class="${k.done?'done':''}"><input type="checkbox" data-act="td" data-id="${k.id}" ${k.done?'checked':''} aria-label="${esc(tr(k.t))}"><div class="lt">${esc(tr(k.t))}</div><button class="del" data-act="delT" data-id="${k.id}" aria-label="${t('del')}">×</button></li>`).join('')}</ul>
 <div class="add"><div class="row"><input name="t" placeholder="${t('addTask')}"><button class="btn sm pri" data-act="addT">${t('add')}</button></div></div></div>
 <div class="sec"><h3>${t('quick')}</h3><ul class="list">${w.links.map(k=>`<li><div class="lt">${linkOrText(k.t,safeUrl(k.url))}</div><button class="del" data-act="delK" data-id="${k.id}" aria-label="${t('del')}">×</button></li>`).join('')}</ul>
 <div class="add"><input name="t" placeholder="${t('title')}"><div class="row"><input name="u" placeholder="${t('link')}" inputmode="url"><button class="btn sm pri" data-act="addK">${t('add')}</button></div></div></div>
 <div class="sec"><h3>${t('notes')}</h3><textarea data-act="wnotes" placeholder="${t('notesPh')}">${esc(w.notes)}</textarea></div>
 <div class="logrow"><button class="btn sm pri" data-act="pomoHere" data-id="work">${t('pomoHere')}</button></div></div>`;
 return h;
}
function boardPanel(){
 const r=RM.board,n=new Date(),day=n.getDay(),mins=n.getHours()*60+n.getMinutes();
 let h=head(r.hex,'7',tr(r.title),esc(tr(r.dates)));
 h+=`<div class="pb"><div class="week">${[1,2,3,4,5,6,0].map(d=>`<div class="wd ${d===day?'today':''}"><b>${t(DAYS[d])}</b><div>${SCHED.filter(b=>b.d.includes(d)).sort((a,b)=>toM(a.s)-toM(b.s)).map(b=>{const room=RM[roomFor(b)],cur=d===day&&mins>=toM(b.s)&&mins<toM(b.e);return `<div class="blk ${cur?'cur':''}" style="--c:${room.hex}"><i></i><time>${b.s}–${b.e}</time><span>${esc(tr(b.t))}</span></div>`}).join('')}</div></div>`).join('')}</div>
 <div class="sec"><h3>${t('roadmap')}</h3><div class="week">${['me1','me2','me3','me4'].map(id=>{const x=RM[id],p=lessonPct(id),s=status(id);return `<div class="rm" style="--c:${x.hex}"><div class="pk">${x.short}</div><div><b>${esc(tr(x.title))}</b> <span class="st st-${s}">${t('status_'+s)}</span><br><small style="color:var(--mute)">${esc(tr(x.dates))} · ${fmtMin(S.totals[id])} · ${p}%</small><div class="pbar"><i style="width:${p}%"></i></div></div><button class="btn sm" data-act="goto" data-id="${id}">${t('goto')}</button></div>`}).join('')}</div></div></div>`;
 return h;
}
function pomoPanel(){
 const r=RM.tower,s=stats(),max=Math.max(1,...DATA_ROOMS.map(id=>S.totals[id]||0)),rm=premain();
 let h=head(r.hex,'25',t('pomoTower'),t('pomoSub'));
 h+=`<div class="pb"><div class="big">${pad(Math.floor(rm/60))}:${pad(Math.floor(rm%60))}</div><p class="note" style="text-align:center;margin-top:0">${t(PM.mode)} · ${esc(tr(RM[PM.cls].title))}</p>
 <div class="stats3"><div><span>${t('today')}</span><b>${fmtMin(s.t)}</b></div><div><span>${t('week')}</span><b>${fmtMin(s.wk)}</b></div><div><span>${t('streak')}</span><b>${s.st}</b></div></div>
 <div class="sec"><h3>${t('pomoLen')}</h3><div class="grid3">${['focus','brk','lbrk'].map(k=>`<label>${t(k)}<input class="inp" type="number" min="1" max="180" data-act="plen" data-k="${k}" value="${S.settings[k]}"></label>`).join('')}</div></div>
 <div class="sec"><h3>${t('perRoom')}</h3><div class="bars">${DATA_ROOMS.map(id=>`<div style="--c:${RM[id].hex}"><span>${esc(tr(RM[id].title).split('·')[0].trim())}</span><s style="width:${((S.totals[id]||0)/max*100).toFixed(1)}%"></s><em>${fmtMin(S.totals[id])}</em></div>`).join('')}</div></div></div>`;
 return h;
}
function certsPanel(){
 const all=[];for(const id of ['me1','me2','me3','me4','zh'])for(const c of S.classes[id].certs)all.push([id,c]);
 let h=head('#e3a21a','★',t('certs'),`${all.length} ${t('certCount').toLowerCase()}`);
 h+=`<div class="pb">${all.length?`<ul class="list">${all.map(([id,c])=>`<li style="--c:${RM[id].hex}"><div class="lt">${linkOrText(c.t,safeUrl(c.url))}<small>${esc(tr(RM[id].title))}${c.date?' · '+esc(c.date):''}</small></div><button class="del" data-act="delCA" data-room="${id}" data-id="${c.id}" aria-label="${t('del')}">×</button></li>`).join('')}</ul>`:`<div class="empty">${t('noCerts')}</div>`}
 <div class="add"><select name="r" aria-label="${t('room')}">${['me1','me2','me3','me4','zh'].map(id=>`<option value="${id}">${esc(tr(RM[id].title))}</option>`).join('')}</select><input name="t" placeholder="${t('cname')}"><input name="u" placeholder="${t('link')}" inputmode="url"><div class="row"><input name="d" type="date" aria-label="${t('cdate')}"><button class="btn sm pri" data-act="addCA">${t('add')}</button></div></div></div>`;
 return h;
}
function settingsPanel(){
 let h=head('#1d2a4d','≡',t('settings'),t('dataNote'));
 h+=`<div class="pb"><div class="sec"><h3>${t('pomoLen')}</h3><div class="grid3">${['focus','brk','lbrk'].map(k=>`<label>${t(k)}<input class="inp" type="number" min="1" max="180" data-act="plen" data-k="${k}" value="${S.settings[k]}"></label>`).join('')}</div></div>
 <div class="sec"><h3>${t('appLink')}</h3><input class="inp" data-act="zhurl" value="${esc(S.settings.zhUrl)}" placeholder="https://….github.io/…" inputmode="url"></div>
 <div class="sec"><h3>${t('export')}</h3><p class="note" style="margin:0 0 6px">${t('exportHint')}</p><textarea id="exp" style="min-height:120px;font-size:12px;font-family:ui-monospace,monospace">${esc(JSON.stringify(S))}</textarea><div class="logrow"><button class="btn sm" data-act="copy">${t('copy')}</button><button class="btn sm" data-act="import">${t('import')}</button><button class="btn sm" data-act="resetAll" style="margin-left:auto;color:var(--acc)">${t('resetAll')}</button></div></div></div>`;
 return h;
}
function acctPanel(){
 let h=head('#2f5fd0','G',t('acct'),ON_PAGES?(fb&&fb.user?esc(fb.user.email||''):t('saveLocal')):t('saveCloud'));
 h+=`<div class="pb">`;
 if(ON_PAGES){
  if(fb&&fb.user)h+=`<div class="box"><p>${t('signedAs')} <b>${esc(fb.user.email||fb.user.displayName||'')}</b></p><p style="margin-top:8px;color:var(--mute)">${t('acctWhy')}</p></div><div class="logrow"><button class="btn sm" data-act="hskRefresh">${t('refresh')}</button><button class="btn sm" data-act="signOut">${t('signOut')}</button></div>`;
  else h+=`<div class="box"><p>${t('acctWhy')}</p><p style="margin-top:10px"><button class="btn pri" data-act="signIn">${t('signIn')}</button></p></div>`;
 }else h+=`<div class="box"><p>${t('acctArtifact')}</p><p style="margin-top:10px"><a class="btn pri" style="display:inline-flex;align-items:center;text-decoration:none" href="${PAGES_URL}" target="_blank" rel="noopener">${t('openPages')} ↗</a></p></div>`;
 if(acctMsg)h+=`<p class="note" style="color:var(--acc)">${esc(acctMsg)}</p>`;
 return h+`</div>`;
}
function renderPanel(){
 if(!panelState)return;const k=panelState.kind;const y=panel.scrollTop;
 panel.innerHTML=k==='class'||k==='zh'?classPanel():k==='work'?workPanel():k==='board'?boardPanel():k==='pomo'?pomoPanel():k==='certs'?certsPanel():k==='acct'?acctPanel():settingsPanel();
 panel.scrollTop=y;
}
const fval=(b,n)=>{const f=b.closest('.add');const el=f&&f.querySelector(`[name=${n}]`);return el?el.value.trim():''};
panel.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT'||b.tagName==='TEXTAREA')return;
 const a=b.dataset.act,st=panelState,c=st&&st.id&&S.classes[st.id],id=b.dataset.id;
 const done=()=>{save();renderPanel();updateTags()};
 switch(a){
  case 'close':closePanel();break;
  case 'tab':st.tab=b.dataset.tab;panel.scrollTop=0;renderPanel();break;
  case 'addL':{const ti=fval(b,'t');if(!ti)return;c.lessons.push({id:uid(),t:ti,url:safeUrl(fval(b,'u')),done:false});done();break}
  case 'delL':c.lessons=c.lessons.filter(x=>x.id!==id);done();break;
  case 'addD':{const ti=fval(b,'t'),u=safeUrl(fval(b,'u'));if(!ti&&!u)return;c.docs.push({id:uid(),t:ti||u,url:u,note:fval(b,'n')});done();break}
  case 'delD':c.docs=c.docs.filter(x=>x.id!==id);done();break;
  case 'addC':{const ti=fval(b,'t');if(!ti)return;c.certs.push({id:uid(),t:ti,url:safeUrl(fval(b,'u')),date:fval(b,'d')});done();break}
  case 'delC':c.certs=c.certs.filter(x=>x.id!==id);done();break;
  case 'addCA':{const ti=fval(b,'t'),rid=fval(b,'r');if(!ti||!S.classes[rid])return;S.classes[rid].certs.push({id:uid(),t:ti,url:safeUrl(fval(b,'u')),date:fval(b,'d')});done();break}
  case 'delCA':{const cc=S.classes[b.dataset.room];if(cc){cc.certs=cc.certs.filter(x=>x.id!==id);done()}break}
  case 'log':{const m=+b.dataset.m;logMin(st.id,m,'manual');toast(t('logged',{m,c:tr(RM[st.id].title)}));renderPanel();break}
  case 'pomoHere':{PM.cls=id||st.id;if(!PM.running){PM.mode='focus';PM.remain=null}savePM();renderPomoSelect();renderPomo();toast(tr(RM[PM.cls].title)+' · Pomodoro');break}
  case 'goto':closePanel();goRoom(id);break;
  case 'signIn':fbSignIn();break;
  case 'signOut':fbSignOut();break;
  case 'hskRefresh':fbPull(false);break;
  case 'addT':{const ti=fval(b,'t');if(!ti)return;S.work.tasks.push({id:uid(),t:ti,done:false});done();break}
  case 'delT':S.work.tasks=S.work.tasks.filter(x=>x.id!==id);done();break;
  case 'addK':{const ti=fval(b,'t'),u=safeUrl(fval(b,'u'));if(!u)return;S.work.links.push({id:uid(),t:ti||u,url:u});done();break}
  case 'delK':S.work.links=S.work.links.filter(x=>x.id!==id);done();break;
  case 'copy':{const tx=$('#exp');const ok=()=>toast(t('copied'));try{navigator.clipboard.writeText(tx.value).then(ok,()=>{tx.select()})}catch(err){tx.select()}break}
  case 'import':{try{const j=JSON.parse($('#exp').value);if(!j||j.v!==1)throw 0;S=merge(j);L=S.lang==='en'?'en':'vi';save();refreshAll();toast(t('imported'))}catch(err){toast(t('importBad'))}break}
  case 'resetAll':if(b.dataset.armed){S=defaults();L='vi';save();refreshAll();}else{b.dataset.armed=1;b.textContent=t('confirmAgain')}break;
 }
});
panel.addEventListener('change',e=>{
 const el=e.target,a=el.dataset.act,st=panelState,c=st&&st.id&&S.classes[st.id],id=el.dataset.id;if(!a)return;
 if(a==='tl'){const l=c.lessons.find(x=>x.id===id);if(l)l.done=el.checked}
 else if(a==='gate')c.gate=el.checked;
 else if(a==='wc'){const k=dkey(new Date());S.work.checks[k]=S.work.checks[k]||{};S.work.checks[k][id]=el.checked;const ks=Object.keys(S.work.checks).sort();while(ks.length>60)delete S.work.checks[ks.shift()]}
 else if(a==='td'){const x=S.work.tasks.find(k=>k.id===id);if(x)x.done=el.checked}
 else if(a==='plen'){S.settings[el.dataset.k]=clamp(Math.round(+el.value||1),1,180);if(!PM.running){PM.remain=null}}
 else if(a==='zhurl'){S.settings.zhUrl=el.value.trim()}
 else return;
 save();renderPanel();updateTags();renderPomo();
});
panel.addEventListener('input',e=>{const el=e.target;if(el.dataset.act==='notes'){S.classes[panelState.id].notes=el.value;save()}else if(el.dataset.act==='wnotes'){S.work.notes=el.value;save()}});
panel.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.closest('.add')){const b=e.target.closest('.add').querySelector('[data-act]');if(b){e.preventDefault();b.click()}}});

/* misc */
let toastT;function toast(s){const el=$('#toast');el.textContent=s;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2600)}
function refreshAll(){
 document.documentElement.lang=L;
 document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));
 document.querySelectorAll('[data-t]').forEach(el=>el.title=t(el.dataset.t));
 $('#b-lang').textContent=L==='vi'?'EN':'VI';$('#pgo').textContent=t('enter');$('#help').textContent=t('help');
 renderDock();renderPomoSelect();renderPomo();updateTags();updateStats();syncLight();nowB=null;updateClock();drawBoard();drawClock();applyLight(hourNow());renderPanel();
 badge($('#savebadge').dataset.k||'local');
}
refreshAll();
setInterval(()=>{updateClock();pomoTick();if(panelState&&panelState.kind==='pomo'){const el=panel.querySelector('.big');if(el){const r=premain();el.textContent=pad(Math.floor(r/60))+':'+pad(Math.floor(r%60))}}},1000);
setInterval(()=>{drawClock();updateStats()},15000);
setInterval(drawBoard,60000);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{drawBoard()});
requestAnimationFrame(frame);
setTimeout(()=>$('#loading').classList.add('off'),300);
setTimeout(()=>$('#help').classList.add('off'),14000);
}
