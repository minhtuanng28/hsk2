y to interest rates","The sensitivity analysis tests rates up to 14%.","Phân tích độ nhạy thử lãi suất đến 14%."],["covenant","n","điều khoản cam kết (khoản vay)","契约条款","qìyuē tiáokuǎn","loan covenants · breach a covenant","Breaching a covenant lets the bank demand early repayment.","Vi phạm điều khoản cam kết cho phép ngân hàng đòi trả nợ sớm."],["exit strategy","n","chiến lược thoái vốn","退出策略","tuìchū cèlüè","a clear exit strategy · exit strategy options","Every deal needs an exit strategy from day one.","Mọi thương vụ cần chiến lược thoái vốn ngay từ đầu."],["refinancing","n","tái cấp vốn","再融资","zài róngzī","refinancing risk · seek refinancing","Refinancing gets harder when rates rise.","Tái cấp vốn khó hơn khi lãi suất tăng."]],"sents":[["At a 10% discount rate, the net present value is still positive.","Với tỷ lệ chiết khấu 10%, NPV vẫn dương.","按百分之十的折现率计算，净现值仍然为正。","Àn bǎi fēn zhī shí de zhéxiàn lǜ jìsuàn, jìng xiànzhí réngrán wéi zhèng.","Bảo vệ phương án"],["Cap rates have compressed as more capital chases prime assets.","Tỷ suất vốn hóa thu hẹp khi ngày càng nhiều vốn săn tài sản hạng A.","随着更多资金追逐优质资产，资本化率不断收窄。","Suízhe gèng duō zījīn zhuīzhú yōuzhì zīchǎn, zīběnhuà lǜ búduàn shōuzhǎi.","Nhận định thị trường"],["We hedge our currency exposure on dollar-denominated loans.","Chúng tôi phòng ngừa rủi ro tỷ giá cho các khoản vay bằng đô la.","我们对美元贷款的汇率风险进行对冲。","Wǒmen duì měiyuán dàikuǎn de huìlǜ fēngxiǎn jìnxíng duìchōng.","Quản trị rủi ro"],["The sensitivity analysis shows the deal holds up even if rates rise by two points.","Phân tích độ nhạy cho thấy thương vụ vẫn ổn ngay cả khi lãi suất tăng hai điểm.","敏感性分析显示，即使利率上升两个百分点，这笔交易依然可行。","Mǐngǎn xìng fēnxī xiǎnshì, jíshǐ lìlǜ shàngshēng liǎng gè bǎifēndiǎn, zhè bǐ jiāoyì yīrán kěxíng.","Thuyết phục hội đồng"],["What is our exit strategy if the market softens before completion?","Chiến lược thoái vốn của chúng ta là gì nếu thị trường yếu đi trước khi hoàn thành?","如果竣工前市场走弱，我们的退出策略是什么？","Rúguǒ jùngōng qián shìchǎng zǒu ruò, wǒmen de tuìchū cèlüè shì shénme?","Họp đầu tư"],["The loan covenants require us to keep debt service coverage above 1.3 times.","Điều khoản khoản vay yêu cầu hệ số khả năng trả nợ luôn trên 1,3 lần.","贷款条款要求我们的偿债覆盖率保持在一点三倍以上。","Dàikuǎn tiáokuǎn yāoqiú wǒmen de chángzhài fùgài lǜ bǎochí zài yī diǎn sān bèi yǐshàng.","Tuân thủ khoản vay"]]},{"id":"fi6","tier":3,"dom":"fi","title":"Capital markets & bonds","vi":"Thị trường vốn và trái phiếu","words":[["corporate bond","n","trái phiếu doanh nghiệp","公司债券","gōngsī zhàiquàn","issue corporate bonds · the corporate bond market","Developers rely heavily on corporate bonds for funding.","Chủ đầu tư phụ thuộc nhiều vào trái phiếu doanh nghiệp để huy động vốn."],["coupon","n","lãi suất danh nghĩa trái phiếu","票面利率","piàomiàn lìlǜ","an 11% coupon · coupon payments","The bonds carry a coupon of 11% a year.","Trái phiếu có lãi suất danh nghĩa 11%/năm."],["maturity","n","đáo hạn","到期","dàoqī","bond maturity · at maturity","A large volume of bonds reaches maturity next year.","Một lượng lớn trái phiếu đáo hạn trong năm tới."],["issuance","n","phát hành","发行","fāxíng","bond issuance · new issuance","Bond issuance recovered in the second half.","Phát hành trái phiếu hồi phục trong nửa cuối năm."],["credit rating","n","xếp hạng tín nhiệm","信用评级","xìnyòng píngjí","a credit rating agency · downgrade a credit rating","A credit rating is required for public bond issues.","Phát hành trái phiếu ra công chúng cần có xếp hạng tín nhiệm."],["REIT","n","quỹ tín thác bất động sản","房地产投资信托基金","fángdìchǎn tóuzī xìntuō jījīn","list a REIT · REIT units","A REIT would let small investors own office buildings.","REIT cho phép nhà đầu tư nhỏ sở hữu tòa văn phòng."],["listed company","n","công ty niêm yết","上市公司","shàngshì gōngsī","a listed developer · listed company disclosure","Listed companies must disclose bond payments.","Công ty niêm yết phải công bố việc trả nợ trái phiếu."],["private placement","n","phát hành riêng lẻ","私募发行","sīmù fāxíng","a private placement of bonds · sold via private placement","Most bonds were sold via private placement.","Phần lớn trái phiếu bán qua kênh phát hành riêng lẻ."],["debt restructuring","n","tái cơ cấu nợ","债务重组","zhàiwù chóngzǔ","negotiate a debt restructuring · a debt restructuring plan","Bondholders agreed to a debt restructuring plan.","Trái chủ đồng ý phương án tái cơ cấu nợ."],["bondholder","n","trái chủ","债券持有人","zhàiquàn chíyǒu rén","a bondholders' meeting · protect bondholders","Bondholders voted to extend the maturity by two years.","Trái chủ bỏ phiếu gia hạn đáo hạn thêm hai năm."],["market capitalisation","n","vốn hóa thị trường","市值","shìzhí","a market capitalisation of US$5 billion · rank by market capitalisation","The group's market capitalisation exceeds US$10 billion.","Vốn hóa của tập đoàn vượt 10 tỷ USD."],["credit spread","n","chênh lệch lợi suất tín dụng","信用利差","xìnyòng lìchā","credit spreads widen · a narrow credit spread","Credit spreads widened after the default.","Chênh lệch lợi suất nới rộng sau vụ vỡ nợ."]],"sents":[["With large bond maturities coming due, refinancing risk is the key issue for developers.","Khi lượng lớn trái phiếu sắp đáo hạn, rủi ro tái cấp vốn là vấn đề then chốt của chủ đầu tư.","随着大量债券即将到期，再融资风险是开发商面临的关键问题。","Suízhe dàliàng zhàiquàn jíjiāng dàoqī, zài róngzī fēngxiǎn shì kāifā shāng miànlín de guānjiàn wèntí.","Phân tích ngành"],["An 11% coupon looks attractive, but what collateral stands behind it?","Lãi 11% nghe hấp dẫn, nhưng tài sản bảo đảm phía sau là gì?","百分之十一的票面利率看起来不错，但背后的抵押物是什么？","Bǎi fēn zhī shíyī de piàomiàn lìlǜ kàn qǐlái búcuò, dàn bèihòu de dǐyā wù shì shénme?","Thẩm định trái phiếu"],["Bondholders agreed to extend the maturity in exchange for additional collateral.","Trái chủ đồng ý gia hạn đáo hạn để đổi lấy thêm tài sản bảo đảm.","债券持有人同意延期，以换取额外的抵押物。","Zhàiquàn chíyǒu rén tóngyì yánqī, yǐ huànqǔ éwài de dǐyā wù.","Tái cơ cấu"],["A REIT market would give office owners a clear exit route.","Thị trường REIT sẽ cho chủ tòa văn phòng một lối thoái vốn rõ ràng.","REIT市场能为写字楼业主提供明确的退出渠道。","REIT shìchǎng néng wèi xiězìlóu yèzhǔ tígōng míngquè de tuìchū qúdào.","Bàn về chính sách"],["Credit spreads have narrowed as investor confidence returns.","Chênh lệch lợi suất thu hẹp khi niềm tin nhà đầu tư quay lại.","随着投资者信心恢复，信用利差已经收窄。","Suízhe tóuzī zhě xìnxīn huīfù, xìnyòng lìchā yǐjīng shōuzhǎi.","Nhận định thị trường"],["As a listed company, we must disclose this payment within 24 hours.","Là công ty niêm yết, chúng ta phải công bố khoản thanh toán này trong 24 giờ.","作为上市公司，我们必须在二十四小时内披露这笔付款。","Zuòwéi shàngshì gōngsī, wǒmen bìxū zài èrshísì xiǎoshí nèi pīlù zhè bǐ fùkuǎn.","Tuân thủ"]]},{"id":"ec3","tier":3,"dom":"ec","title":"Advanced macro & micro","vi":"Vĩ mô và vi mô nâng cao","words":[["quantitative easing","n","nới lỏng định lượng","量化宽松","liànghuà kuānsōng","a round of quantitative easing · unwind quantitative easing","Quantitative easing pushed asset prices higher.","Nới lỏng định lượng đẩy giá tài sản lên cao."],["yield curve","n","đường cong lợi suất","收益率曲线","shōuyì lǜ qūxiàn","an inverted yield curve · a steep yield curve","Investors watch the yield curve for warning signs.","Nhà đầu tư theo dõi đường cong lợi suất để tìm tín hiệu cảnh báo."],["stagflation","n","đình lạm (lạm phát đi kèm trì trệ)","滞胀","zhìzhàng","the risk of stagflation · a period of stagflation","Stagflation leaves policymakers with few good options.","Đình lạm khiến nhà hoạch định chính sách có rất ít lựa chọn tốt."],["moral hazard","n","rủi ro đạo đức","道德风险","dàodé fēngxiǎn","create moral hazard · a moral hazard problem","Guarantees can create moral hazard among lenders.","Bảo lãnh có thể tạo rủi ro đạo đức ở bên cho vay."],["externality","n","ngoại ứng","外部性","wàibù xìng","a negative externality · internalise an externality","Traffic congestion is a negative externality of new development.","Tắc đường là ngoại ứng tiêu cực của dự án mới."],["price ceiling","n","giá trần","价格上限","jiàgé shàngxiàn","impose a price ceiling · a binding price ceiling","A price ceiling on rents can reduce supply.","Áp giá trần tiền thuê có thể làm giảm nguồn cung."],["marginal cost","n","chi phí biên","边际成本","biānjì chéngběn","marginal cost of production · equal to marginal cost","The marginal cost of adding one more floor is low.","Chi phí biên để xây thêm một tầng là thấp."],["soft landing","n","hạ cánh mềm","软着陆","ruǎn zhuólù","achieve a soft landing · hopes of a soft landing","Markets are pricing in a soft landing.","Thị trường đang phản ánh kỳ vọng hạ cánh mềm."],["crowding out","n","hiệu ứng lấn át","挤出效应","jǐchū xiàoyìng","the crowding out effect · crowding out private investment","Heavy state borrowing can cause crowding out.","Nhà nước vay nhiều có thể gây hiệu ứng lấn át."],["deadweight loss","n","tổn thất vô ích (phúc lợi)","无谓损失","wúwèi sǔnshī","create a deadweight loss · tax deadweight loss","Rent controls can create a deadweight loss.","Kiểm soát giá thuê có thể tạo tổn thất vô ích."],["asymmetric information","n","thông tin bất cân xứng","信息不对称","xìnxī bú duìchèn","a problem of asymmetric information · reduce asymmetric information","Asymmetric information makes buyers wary of small developers.","Thông tin bất cân xứng khiến người mua dè chừng chủ đầu tư nhỏ."],["liquidity trap","n","bẫy thanh khoản","流动性陷阱","liúdòng xìng xiànjǐng","fall into a liquidity trap · escape a liquidity trap","In a liquidity trap, rate cuts barely help.","Trong bẫy thanh khoản, hạ lãi suất gần như không có tác dụng."]],"sents":[["An inverted yield curve has often preceded a recession.","Đường cong lợi suất đảo ngược thường xuất hiện trước suy thoái.","收益率曲线倒挂往往出现在经济衰退之前。","Shōuyì lǜ qūxiàn dàoguà wǎngwǎng chūxiàn zài jīngjì shuāituì zhīqián.","Phân tích chuyên sâu"],["Policymakers are trying to engineer a soft landing.","Các nhà hoạch định chính sách đang cố tạo một cú hạ cánh mềm.","决策者正努力实现经济软着陆。","Juécè zhě zhèng nǔlì shíxiàn jīngjì ruǎn zhuólù.","Bình luận vĩ mô"],["Pollution is a classic negative externality that the market fails to price.","Ô nhiễm là ngoại ứng tiêu cực điển hình mà thị trường không định giá được.","污染是典型的负外部性，市场无法为其定价。","Wūrǎn shì diǎnxíng de fù wàibù xìng, shìchǎng wúfǎ wèi qí dìngjià.","Thảo luận tác động môi trường"],["Bailouts can create moral hazard by rewarding excessive risk-taking.","Giải cứu có thể tạo rủi ro đạo đức vì thưởng cho hành vi mạo hiểm quá mức.","救助可能奖励过度冒险的行为，从而产生道德风险。","Jiùzhù kěnéng jiǎnglì guòdù màoxiǎn de xíngwéi, cóng'ér chǎnshēng dàodé fēngxiǎn.","Tranh luận chính sách"],["Asymmetric information explains why buyers rely so heavily on trusted brokers.","Thông tin bất cân xứng giải thích vì sao người mua dựa nhiều vào môi giới đáng tin.","信息不对称解释了为什么买家如此依赖可信的经纪人。","Xìnxī bú duìchèn jiěshì le wèishénme mǎijiā rúcǐ yīlài kěxìn de jīngjì rén.","Phân tích hành vi"],["Heavy government borrowing can crowd out private investment by pushing rates up.","Chính phủ vay nhiều có thể lấn át đầu tư tư nhân vì đẩy lãi suất lên.","政府大量借贷会推高利率，从而挤出私人投资。","Zhèngfǔ dàliàng jièdài huì tuīgāo lìlǜ, cóng'ér jǐchū sīrén tóuzī.","Thảo luận vĩ mô"]]},{"id":"ec6","tier":3,"dom":"ec","title":"Sustainability & ESG","vi":"Phát triển bền vững và ESG","words":[["environmental impact assessment","n","đánh giá tác động môi trường (ĐTM)","环境影响评价","huánjìng yǐngxiǎng píngjià","conduct an environmental impact assessment · EIA approval","The project cannot start without an approved environmental impact assessment.","Dự án không thể khởi công nếu ĐTM chưa được duyệt."],["green building","n","công trình xanh","绿色建筑","lǜsè jiànzhù","green building certification · a certified green building","Green building certification attracts multinational tenants.","Chứng nhận công trình xanh thu hút khách thuê đa quốc gia."],["carbon emissions","n","phát thải carbon","碳排放","tàn páifàng","reduce carbon emissions · embodied carbon emissions","Buildings account for a large share of carbon emissions.","Công trình chiếm tỷ trọng lớn trong phát thải carbon."],["land reclamation","n","lấn biển, san lấp tạo đất","填海造地","tiánhǎi zàodì","a land reclamation project · large-scale land reclamation","The land reclamation plan raised concerns about mangroves.","Kế hoạch lấn biển gây lo ngại về rừng ngập mặn."],["biodiversity","n","đa dạng sinh học","生物多样性","shēngwù duōyàng xìng","protect biodiversity · a loss of biodiversity","Scientists warn of a loss of biodiversity in the bay.","Các nhà khoa học cảnh báo suy giảm đa dạng sinh học ở vịnh."],["mangrove","n","rừng ngập mặn","红树林","hóngshù lín","a mangrove forest · restore mangroves","Mangroves protect the coast from storm surges.","Rừng ngập mặn bảo vệ bờ biển trước nước dâng do bão."],["climate resilience","n","khả năng chống chịu khí hậu","气候韧性","qìhòu rènxìng","build climate resilience · climate-resilient design","Coastal projects must demonstrate climate resilience.","Dự án ven biển phải chứng minh khả năng chống chịu khí hậu."],["sea-level rise","n","nước biển dâng","海平面上升","hǎipíngmiàn shàngshēng","the risk of sea-level rise · sea-level rise scenarios","Sea-level rise threatens low-lying districts.","Nước biển dâng đe dọa các khu vực trũng thấp."],["ESG","n","môi trường, xã hội và quản trị","环境、社会和治理","huánjìng, shèhuì hé zhìlǐ","ESG criteria · ESG reporting","Foreign funds now screen projects on ESG criteria.","Quỹ ngoại nay sàng lọc dự án theo tiêu chí ESG."],["green bond","n","trái phiếu xanh","绿色债券","lǜsè zhàiquàn","issue a green bond · a green bond framework","The developer issued its first green bond.","Chủ đầu tư phát hành trái phiếu xanh đầu tiên."],["mitigation","n","biện pháp giảm thiểu tác động","减缓措施","jiǎnhuǎn cuòshī","mitigation measures · impact mitigation","The assessment lists mitigation measures for dredging.","Báo cáo liệt kê biện pháp giảm thiểu cho việc nạo vét."],["greenwashing","n","\"tẩy xanh\" (quảng bá xanh sai sự thật)","漂绿","piǎolǜ","accusations of greenwashing · avoid greenwashing","Vague green claims can look like greenwashing.","Tuyên bố \"xanh\" mơ hồ dễ bị coi là tẩy xanh."]],"sents":[["The environmental impact assessment must cover dredging, mangroves and storm surges.","ĐTM phải đánh giá việc nạo vét, rừng ngập mặn và nước dâng do bão.","环境影响评价必须涵盖疏浚、红树林和风暴潮等问题。","Huánjìng yǐngxiǎng píngjià bìxū hángài shūjùn, hóngshù lín hé fēngbào cháo děng wèntí.","Thảo luận ĐTM"],["Green certification adds about 2% to costs but lowers operating expenses over time.","Chứng nhận xanh tăng khoảng 2% chi phí nhưng giảm chi phí vận hành về lâu dài.","绿色认证会增加约百分之二的成本，但长期能降低运营费用。","Lǜsè rènzhèng huì zēngjiā yuē bǎi fēn zhī èr de chéngběn, dàn chángqī néng jiàngdī yùnyíng fèiyòng.","Thuyết phục chủ đầu tư"],["International tenants increasingly ask for buildings that meet ESG standards.","Khách thuê quốc tế ngày càng yêu cầu tòa nhà đạt chuẩn ESG.","国际租户越来越多地要求楼宇符合ESG标准。","Guójì zūhù yuèláiyuè duō de yāoqiú lóuyǔ fúhé ESG biāozhǔn.","Xu hướng thị trường"],["Large-scale land reclamation must be weighed against its impact on biodiversity.","Lấn biển quy mô lớn phải được cân nhắc với tác động lên đa dạng sinh học.","大规模填海造地必须权衡其对生物多样性的影响。","Dà guīmó tiánhǎi zàodì bìxū quánhéng qí duì shēngwù duōyàng xìng de yǐngxiǎng.","Phản biện dự án"],["We should avoid vague 'eco' claims unless we can back them with data.","Không nên dùng chữ \"sinh thái\" mơ hồ nếu không có số liệu chứng minh.","除非有数据支持，否则我们应避免含糊的\"生态\"宣传。","Chúfēi yǒu shùjù zhīchí, fǒuzé wǒmen yīng bìmiǎn hánhu de \"shēngtài\" xuānchuán.","Tránh tẩy xanh"],["Climate resilience is now part of how banks price loans for coastal projects.","Khả năng chống chịu khí hậu nay là một yếu tố ngân hàng dùng để định giá khoản vay cho dự án ven biển.","气候韧性如今已成为银行为沿海项目贷款定价的考量之一。","Qìhòu rènxìng rújīn yǐ chéngwéi yínháng wèi yánhǎi xiàngmù dàikuǎn dìngjià de kǎoliáng zhīyī.","Tài chính xanh"]]}],"reads":[{"id":"r-rates","tier":2,"dom":"ec","title":"Why interest rates move the housing market","vi":"Vì sao lãi suất làm thị trường nhà ở chuyển động","source":"Bài viết gốc của app, tổng hợp kiến thức kinh tế phổ thông","paras":[{"en":"Few numbers matter more to a housing market than the interest rate. Most buyers do not pay in cash; they borrow, and the cost of borrowing decides how much home they can afford. When a central bank raises its policy rate, commercial banks pass the increase on to borrowers. A family that could comfortably service a loan at six percent may struggle at ten, even though the price of the apartment has not changed at all.","vi":"Ít có con số nào quan trọng với thị trường nhà ở hơn lãi suất. Phần lớn người mua không trả bằng tiền mặt; họ đi vay, và chi phí vay quyết định họ mua nổi căn nhà cỡ nào. Khi ngân hàng trung ương tăng lãi suất điều hành, các ngân hàng thương mại chuyển mức tăng đó sang người vay. Một gia đình trả nợ thoải mái ở mức sáu phần trăm có thể chật vật ở mức mười, dù giá căn hộ không hề đổi."},{"en":"The effect, however, is rarely immediate. Buyers who have already signed contracts carry on, and developers keep building what they have started. It typically takes several quarters before higher rates show up as fewer transactions. Prices tend to react last of all, because owners are reluctant to sell for less than they paid. The first sign of a cooling market is therefore usually falling volume, not falling prices.","vi":"Tuy vậy, tác động hiếm khi đến ngay. Người đã ký hợp đồng vẫn tiếp tục, còn chủ đầu tư vẫn xây tiếp phần đã khởi công. Thường phải vài quý sau, lãi suất cao mới thể hiện thành số giao dịch giảm. Giá thường phản ứng sau cùng, vì chủ nhà không muốn bán thấp hơn giá mua. Vì thế dấu hiệu đầu tiên của thị trường hạ nhiệt thường là thanh khoản giảm, chứ không phải giá giảm."},{"en":"Rates also shape supply. Developers rely heavily on debt, so expensive credit squeezes their margins and delays new launches. Paradoxically, this can support prices later: when demand eventually recovers, there are fewer new homes to meet it. Investors who understand this lag often buy while sentiment is weak, accepting short-term uncertainty in exchange for a better entry price.","vi":"Lãi suất cũng định hình nguồn cung. Chủ đầu tư phụ thuộc nhiều vào vốn vay, nên tín dụng đắt đỏ bóp biên lợi nhuận và làm chậm các đợt mở bán mới. Nghịch lý là điều này có thể đỡ giá về sau: khi nhu cầu hồi phục thì lại có ít nhà mới để đáp ứng. Nhà đầu tư hiểu độ trễ này thường mua khi tâm lý còn yếu, chấp nhận bất định ngắn hạn để đổi lấy giá vào tốt hơn."}],"gloss":{"afford":"đủ khả năng chi trả","service":"trả (nợ) đều đặn","struggle":"chật vật","immediate":"ngay lập tức","transactions":"giao dịch","reluctant":"miễn cưỡng, không muốn","cooling":"hạ nhiệt","volume":"khối lượng giao dịch","squeezes":"bóp, siết","margins":"biên lợi nhuận","launches":"đợt mở bán","paradoxically":"nghịch lý thay","sentiment":"tâm lý thị trường","lag":"độ trễ","uncertainty":"sự bất định","borrow":"vay","borrowers":"người vay","credit":"tín dụng","recovers":"hồi phục","debt":"nợ"},"q":[{"t":"tfng","q":"Most home buyers pay the full price in cash.","a":"F","why":"Đoạn 1: \"Most buyers do not pay in cash; they borrow\"."},{"t":"tfng","q":"A rate rise can make a loan unaffordable even if the apartment price stays the same.","a":"T","why":"Đoạn 1: gia đình trả được ở 6% có thể chật vật ở 10% dù giá không đổi."},{"t":"tfng","q":"Prices are usually the first indicator to fall when the market cools.","a":"F","why":"Đoạn 2: giá phản ứng sau cùng; dấu hiệu đầu tiên là thanh khoản giảm."},{"t":"tfng","q":"Developers in Vietnam borrow more than developers in other countries.","a":"NG","why":"Bài không so sánh giữa các nước."},{"t":"mcq","q":"Why do prices tend to react last?","opts":["Banks delay passing on rate increases","Owners are unwilling to sell below what they paid","Developers stop building immediately","Buyers cancel signed contracts"],"a":1,"why":"Đoạn 2: \"owners are reluctant to sell for less than they paid\"."},{"t":"mcq","q":"According to the last paragraph, expensive credit can support prices later because","opts":["it reduces the number of new homes coming to market","it encourages banks to lend more","it attracts foreign investors","it lowers construction costs"],"a":0,"why":"Đoạn 3: tín dụng đắt làm chậm mở bán, nên khi cầu hồi phục thì ít nhà mới."},{"t":"gap","q":"The earliest sign of a cooling market is usually falling ___ rather than falling prices.","a":"volume","why":"Đoạn 2, câu cuối."},{"t":"gap","q":"Because developers depend on debt, costly credit squeezes their ___.","a":"margins","why":"Đoạn 3, câu 2."},{"t":"gap","q":"Investors who understand the ___ often buy while sentiment is weak.","a":"lag","why":"Đoạn 3, câu cuối."}]},{"id":"r-branded","tier":3,"dom":"re","title":"What makes a branded residence worth the premium?","vi":"Điều gì khiến căn hộ hàng hiệu đáng giá cao hơn?","source":"Bài viết gốc của app, tổng hợp kiến thức ngành","paras":[{"en":"A branded residence is a home sold under the name of a hotel group, a fashion house or another well-known brand. Buyers typically pay a noticeable premium over comparable unbranded units in the same location. Sceptics dismiss this as paying for a logo, yet the premium has proved remarkably persistent across very different markets, which suggests that buyers are purchasing something more tangible than a name.","vi":"Căn hộ hàng hiệu là nhà ở được bán dưới tên một tập đoàn khách sạn, nhà mốt hoặc thương hiệu nổi tiếng khác. Người mua thường trả cao hơn rõ rệt so với căn không gắn thương hiệu tương đương cùng vị trí. Người hoài nghi cho rằng đó là trả tiền cho cái logo, nhưng mức chênh này lại bền bỉ đáng kể ở những thị trường rất khác nhau, cho thấy người mua đang mua thứ gì đó hữu hình hơn một cái tên."},{"en":"The first thing they buy is certainty. A global operator imposes design and construction standards that a local developer must meet before the brand will lend its name. For an overseas investor who cannot inspect the site in person, that oversight works as a form of quality assurance. The second is service: housekeeping, maintenance and concierge teams trained by the operator keep the building in good condition long after handover, which in turn protects resale value.","vi":"Thứ đầu tiên họ mua là sự chắc chắn. Nhà vận hành toàn cầu đặt ra tiêu chuẩn thiết kế và xây dựng mà chủ đầu tư địa phương phải đạt thì thương hiệu mới cho gắn tên. Với nhà đầu tư nước ngoài không thể tự đến xem công trình, sự giám sát đó là một dạng bảo chứng chất lượng. Thứ hai là dịch vụ: đội buồng phòng, bảo trì và lễ tân do nhà vận hành đào tạo giữ tòa nhà trong tình trạng tốt rất lâu sau bàn giao, nhờ đó bảo vệ giá bán lại."},{"en":"There are costs, of course. Service charges are higher, and the management agreement may expire, leaving owners with an ordinary building and an expensive mortgage. Prudent buyers therefore read the agreement as carefully as the sales contract, checking how long the brand is committed and what happens if the operator withdraws. A brand can raise the ceiling on price, but only sound operation keeps it there.","vi":"Tất nhiên là có chi phí. Phí dịch vụ cao hơn, và hợp đồng quản lý có thể hết hạn, để lại cho chủ nhà một tòa nhà bình thường cùng khoản vay đắt đỏ. Vì vậy người mua thận trọng đọc hợp đồng quản lý kỹ như hợp đồng mua bán, kiểm tra thương hiệu cam kết bao lâu và điều gì xảy ra nếu nhà vận hành rút lui. Thương hiệu có thể nâng trần giá, nhưng chỉ vận hành tốt mới giữ được giá ở đó."}],"gloss":{"premium":"mức giá chênh cao hơn","comparable":"tương đương","sceptics":"người hoài nghi","dismiss":"gạt bỏ, coi nhẹ","persistent":"bền bỉ, kéo dài","tangible":"hữu hình, cụ thể","certainty":"sự chắc chắn","operator":"nhà vận hành","imposes":"áp đặt","oversight":"sự giám sát","assurance":"sự bảo đảm","concierge":"lễ tân, dịch vụ hỗ trợ cư dân","resale":"bán lại","expire":"hết hạn","prudent":"thận trọng","withdraws":"rút lui","ceiling":"mức trần","sound":"vững, tốt","inspect":"kiểm tra tận nơi","housekeeping":"dịch vụ buồng phòng"},"q":[{"t":"tfng","q":"The price premium for branded residences appears only in a few luxury markets.","a":"F","why":"Đoạn 1: mức chênh bền bỉ \"across very different markets\"."},{"t":"tfng","q":"The brand's standards must be met before its name can be used.","a":"T","why":"Đoạn 2: chủ đầu tư phải đạt chuẩn \"before the brand will lend its name\"."},{"t":"tfng","q":"Branded residences always sell faster than unbranded ones.","a":"NG","why":"Bài không nói về tốc độ bán."},{"t":"tfng","q":"Service charges in branded residences are lower because of the operator's scale.","a":"F","why":"Đoạn 3: \"Service charges are higher\"."},{"t":"mcq","q":"Why is the operator's oversight especially useful to overseas investors?","opts":["They receive a discount","They cannot visit the site themselves","They pay lower service charges","They can cancel the contract at any time"],"a":1,"why":"Đoạn 2: \"cannot inspect the site in person\"."},{"t":"mcq","q":"What does the writer advise careful buyers to do?","opts":["Avoid branded residences altogether","Negotiate lower service charges","Study the management agreement closely","Buy only after handover"],"a":2,"why":"Đoạn 3: đọc hợp đồng quản lý kỹ như hợp đồng mua bán."},{"t":"gap","q":"For buyers abroad, the operator's standards act as a form of quality ___.","a":"assurance","why":"Đoạn 2."},{"t":"gap","q":"Well-trained service teams help protect the ___ value of the property.","a":"resale","why":"Đoạn 2, câu cuối."},{"t":"gap","q":"If the management agreement were to ___, owners could be left with an ordinary building.","a":"expire","why":"Đoạn 3."}]},{"id":"r-buytolet","tier":1,"dom":"fi","title":"Does buy-to-let still add up?","vi":"Mua để cho thuê còn đáng không?","source":"Bài viết gốc của app; số liệu là ví dụ minh họa","paras":[{"en":"Imagine an apartment priced at VND 4 billion that rents for VND 15 million a month. Over a year the owner collects VND 180 million, a gross rental yield of 4.5 percent. That headline number is what most sales brochures show, but it is not what lands in the owner's pocket.","vi":"Hãy hình dung một căn hộ giá 4 tỷ đồng cho thuê 15 triệu đồng mỗi tháng. Một năm chủ nhà thu 180 triệu, tỷ suất cho thuê gộp 4,5%. Con số này là thứ phần lớn tài liệu bán hàng đưa ra, nhưng không phải số tiền thực sự vào túi chủ nhà."},{"en":"Start subtracting costs. Leaving the unit empty for one month between tenants removes VND 15 million. Management fees of about VND 1 million a month add up to VND 12 million a year, and repairs and furniture replacement might take another VND 8 million. After these deductions the owner keeps around VND 145 million, a net yield of roughly 3.6 percent, below the 6 percent a twelve-month term deposit currently pays.","vi":"Bắt đầu trừ chi phí. Để trống một tháng giữa hai khách thuê là mất 15 triệu. Phí quản lý khoảng 1 triệu mỗi tháng cộng lại 12 triệu một năm, sửa chữa và thay nội thất có thể tốn thêm 8 triệu. Sau các khoản này chủ nhà còn khoảng 145 triệu, tỷ suất ròng khoảng 3,6%, thấp hơn mức 6% của tiền gửi kỳ hạn 12 tháng hiện nay."},{"en":"So why buy? The answer is capital growth. If the apartment's value rises 5 percent a year, the total return is closer to 8.6 percent. Leverage complicates the picture: borrowing at 10 percent to earn a 3.6 percent net yield creates negative carry, so the investment only pays if prices keep climbing. Buyers should therefore test their plan against flat prices, not just the optimistic case.","vi":"Vậy tại sao vẫn mua? Câu trả lời là tăng giá tài sản. Nếu căn hộ tăng giá 5% mỗi năm, tổng lợi nhuận gần 8,6%. Đòn bẩy làm bức tranh phức tạp hơn: vay lãi 10% để nhận tỷ suất ròng 3,6% tạo ra dòng tiền âm, nên khoản đầu tư chỉ có lãi khi giá tiếp tục tăng. Vì vậy người mua nên thử kế hoạch với kịch bản giá đi ngang, không chỉ kịch bản lạc quan."}],"gloss":{"gross rental yield":"tỷ suất cho thuê gộp","headline":"con số nổi bật, bề ngoài","brochures":"tài liệu giới thiệu","subtracting":"trừ đi","tenants":"khách thuê","management fees":"phí quản lý","deductions":"khoản khấu trừ","net yield":"tỷ suất ròng","term deposit":"tiền gửi có kỳ hạn","capital growth":"tăng giá trị tài sản","total return":"tổng lợi nhuận","leverage":"đòn bẩy","negative carry":"dòng tiền âm (lãi vay cao hơn thu nhập)","optimistic":"lạc quan","flat":"đi ngang"},"figs":[["Ví dụ · Example","Purchase price","VND 4 bn","",""],["Ví dụ · Example","Monthly rent","VND 15 m","",""],["Ví dụ · Example","Gross rental yield","4.5%","",""],["Ví dụ · Example","Net yield after costs","~3.6%","",""],["Ví dụ · Example","12-month term deposit","6%","",""],["Ví dụ · Example","Total return with 5% growth","~8.6%","",""]],"q":[{"t":"tfng","q":"Sales brochures usually show the gross rental yield.","a":"T","why":"Đoạn 1."},{"t":"tfng","q":"After costs, the apartment earns more than a term deposit.","a":"F","why":"Đoạn 2: 3,6% so với 6%."},{"t":"tfng","q":"Most buyers of this apartment pay in cash.","a":"NG","why":"Bài không nói."},{"t":"tfng","q":"Borrowing at 10 percent creates negative carry in this example.","a":"T","why":"Đoạn 3."},{"t":"mcq","q":"Why do people still buy to let, according to the writer?","opts":["High monthly rent","Capital growth","Tax exemptions","Low management fees"],"a":1,"why":"Đoạn 3."},{"t":"mcq","q":"What does the writer recommend?","opts":["Always borrow the maximum","Test the plan assuming prices stay flat","Only buy fully furnished units","Avoid term deposits"],"a":1,"why":"Đoạn 3, câu cuối."},{"t":"gap","q":"Rent of VND 15 million a month on a VND 4 billion unit gives a gross yield of ___ percent.","a":"4.5","why":"Đoạn 1."},{"t":"gap","q":"After costs the owner keeps around VND ___ million a year.","a":"145","why":"Đoạn 2."},{"t":"gap","q":"Borrowing at a higher rate than the net yield creates negative ___.","a":"carry","why":"Đoạn 3."}]},{"id":"r-leads","tier":2,"dom":"mk","title":"Why most property leads go cold","vi":"Vì sao phần lớn khách tiềm năng BĐS bị nguội","source":"Bài viết gốc của app; phễu số liệu là ví dụ minh họa","paras":[{"en":"Picture a campaign that generates 1,000 leads in a month. If sales manage to reach 600 of them, book 120 site visits and close 12 deals, the closing rate looks like a modest 1.2 percent. Marketing is often blamed for poor lead quality, but the numbers usually tell a different story: the biggest losses happen after the lead has already arrived.","vi":"Hình dung một chiến dịch thu về 1.000 khách tiềm năng trong tháng. Nếu sale liên lạc được 600, hẹn được 120 lượt xem dự án và chốt 12 giao dịch, tỷ lệ chốt chỉ 1,2%. Marketing thường bị trách vì lead kém chất lượng, nhưng con số thường cho thấy điều khác: thất thoát lớn nhất xảy ra sau khi lead đã về."},{"en":"Speed matters more than most teams admit. A prospect who has just filled in a form is still thinking about the project; an hour later they are comparing three others. Teams that call back within minutes, rather than the next day, consistently reach more people. The second problem is persistence. Many leads need five or six touches across calls, messages and email before they agree to a visit, yet agents often give up after one unanswered call.","vi":"Tốc độ quan trọng hơn mức phần lớn đội ngũ thừa nhận. Người vừa điền form vẫn đang nghĩ về dự án; một giờ sau họ đã so sánh ba dự án khác. Đội gọi lại trong vài phút thay vì ngày hôm sau luôn liên lạc được nhiều người hơn. Vấn đề thứ hai là sự kiên trì. Nhiều lead cần năm, sáu lần chạm qua gọi, nhắn tin và email trước khi đồng ý đi xem, vậy mà sale thường bỏ cuộc sau một cuộc gọi không ai nghe."},{"en":"The fix is less glamorous than a new ad campaign. Agree a response time with the sales team, log every contact in the CRM, and score leads so that hot prospects are called first. Then measure the funnel stage by stage. If contact rates are low, the problem is follow-up; if visits rarely convert, the problem is the offer or the pitch. Only when both are healthy is it fair to question the quality of the leads themselves.","vi":"Cách sửa kém hào nhoáng hơn một chiến dịch quảng cáo mới. Thống nhất thời gian phản hồi với đội sale, ghi mọi lần liên hệ vào CRM, và chấm điểm lead để gọi khách nóng trước. Sau đó đo phễu theo từng bước. Nếu tỷ lệ liên lạc thấp, vấn đề là khâu chăm sóc; nếu khách đi xem mà hiếm khi chốt, vấn đề là chính sách hoặc cách tư vấn. Chỉ khi cả hai đều ổn mới công bằng để đặt câu hỏi về chất lượng lead."}],"gloss":{"generates":"tạo ra","site visits":"lượt đi xem dự án","closing rate":"tỷ lệ chốt","modest":"khiêm tốn, thấp","lead quality":"chất lượng khách tiềm năng","prospect":"khách tiềm năng","persistence":"sự kiên trì","touches":"lần chạm (liên hệ)","unanswered":"không được trả lời","glamorous":"hào nhoáng","response time":"thời gian phản hồi","funnel":"phễu","stage by stage":"theo từng bước","follow-up":"chăm sóc, gọi lại","pitch":"cách tư vấn, chào hàng","convert":"chuyển đổi"},"figs":[["Ví dụ phễu · Funnel example","Leads generated","1,000","",""],["Ví dụ phễu · Funnel example","Leads reached","600","60%",""],["Ví dụ phễu · Funnel example","Site visits booked","120","20% of reached",""],["Ví dụ phễu · Funnel example","Deals closed","12","10% of visits",""],["Ví dụ phễu · Funnel example","Lead-to-deal closing rate","1.2%","",""]],"q":[{"t":"tfng","q":"In the example, sales reached every lead the campaign generated.","a":"F","why":"Đoạn 1: chỉ 600/1.000."},{"t":"tfng","q":"The writer believes most losses happen before a lead arrives.","a":"F","why":"Đoạn 1: thất thoát lớn nhất sau khi lead về."},{"t":"tfng","q":"Many leads need several contacts before agreeing to a visit.","a":"T","why":"Đoạn 2."},{"t":"tfng","q":"Facebook leads convert better than Google leads.","a":"NG","why":"Bài không so sánh kênh."},{"t":"mcq","q":"If contact rates are low, where does the writer locate the problem?","opts":["The ad creative","Follow-up","The price","The location"],"a":1,"why":"Đoạn 3."},{"t":"mcq","q":"What is the writer's main message?","opts":["Buy more ads","Fix the process after the lead arrives","Hire more agents","Lower prices"],"a":1,"why":"Toàn bài."},{"t":"gap","q":"In the example, 120 site visits produced ___ deals.","a":"12","why":"Đoạn 1."},{"t":"gap","q":"Agents often give up after one ___ call.","a":"unanswered","why":"Đoạn 2."},{"t":"gap","q":"Leads should be scored so that hot ___ are called first.","a":"prospects","why":"Đoạn 3."}]},{"id":"r-metro","tier":2,"dom":"ec","title":"How metro lines reshape property values","vi":"Tuyến metro thay đổi giá trị bất động sản ra sao","source":"Bài viết gốc của app, tổng hợp kiến thức kinh tế đô thị","paras":[{"en":"When Ho Chi Minh City's first metro line opened at the end of 2024, linking Ben Thanh with Suoi Tien over about 20 kilometres, it did more than move passengers. It changed how buyers measure location. Instead of asking how far a project is from District 1, many now ask how far it is from the nearest station.","vi":"Khi tuyến metro đầu tiên của TP.HCM khai thác cuối năm 2024, nối Bến Thành với Suối Tiên dài khoảng 20 km, nó làm nhiều hơn việc chở khách. Nó thay đổi cách người mua đo vị trí. Thay vì hỏi dự án cách Quận 1 bao xa, nhiều người giờ hỏi cách nhà ga gần nhất bao xa."},{"en":"Economists call this capitalisation: the benefit of shorter, more reliable journeys is built into land prices. The effect is strongest within walking distance, usually defined as 500 to 800 metres from a station, and fades quickly beyond it. Interestingly, much of the price gain tends to happen before a line opens, during the announcement and construction phases, as investors bet on the future. By the time trains run, part of the upside is often already priced in.","vi":"Các nhà kinh tế gọi đây là sự vốn hóa: lợi ích của quãng đi lại ngắn hơn, đáng tin hơn được tính vào giá đất. Hiệu ứng mạnh nhất trong bán kính đi bộ, thường là 500 đến 800 mét từ nhà ga, và giảm nhanh khi ra xa hơn. Điều thú vị là phần lớn mức tăng giá thường diễn ra trước khi tuyến khai thác, trong giai đoạn công bố và thi công, khi nhà đầu tư đặt cược vào tương lai. Đến khi tàu chạy, một phần dư địa tăng thường đã được phản ánh vào giá."},{"en":"Not every station benefits equally. Stations that connect to buses, offices and shops create real demand, while isolated stations surrounded by empty land may disappoint. Planners therefore promote transit-oriented development, which concentrates housing and jobs around stations. For buyers, the lesson is to look beyond the map: frequency, connections and what is built around a station matter as much as the line itself.","vi":"Không phải nhà ga nào cũng được hưởng lợi như nhau. Ga kết nối với xe buýt, văn phòng và cửa hàng tạo ra nhu cầu thật, còn ga đứng lẻ loi giữa đất trống có thể gây thất vọng. Vì vậy các nhà quy hoạch thúc đẩy mô hình phát triển theo định hướng giao thông công cộng (TOD), tập trung nhà ở và việc làm quanh nhà ga. Với người mua, bài học là nhìn xa hơn tấm bản đồ: tần suất chạy, khả năng kết nối và những gì được xây quanh nhà ga cũng quan trọng như chính tuyến đường."}],"gloss":{"linking":"nối liền","passengers":"hành khách","capitalisation":"sự vốn hóa (lợi ích tính vào giá)","reliable":"đáng tin cậy","walking distance":"khoảng cách đi bộ","fades":"giảm dần","announcement":"công bố","bet on":"đặt cược vào","upside":"dư địa tăng giá","priced in":"đã phản ánh vào giá","isolated":"đứng riêng lẻ","disappoint":"gây thất vọng","transit-oriented development":"phát triển theo định hướng giao thông công cộng (TOD)","concentrates":"tập trung","frequency":"tần suất","connections":"kết nối"},"figs":[["Metro TP.HCM · Line 1","Opened","End of 2024","",""],["Metro TP.HCM · Line 1","Route","Ben Thanh – Suoi Tien","",""],["Metro TP.HCM · Line 1","Length","~20 km","",""],["Nguyên tắc · Rule of thumb","Walking-distance catchment","500–800 m","",""]],"q":[{"t":"tfng","q":"Ho Chi Minh City's first metro line runs between Ben Thanh and Suoi Tien.","a":"T","why":"Đoạn 1."},{"t":"tfng","q":"The price effect of a station grows stronger the further away a property is.","a":"F","why":"Đoạn 2: giảm nhanh khi ra xa."},{"t":"tfng","q":"A large part of the price gain often occurs before trains start running.","a":"T","why":"Đoạn 2."},{"t":"tfng","q":"Ticket prices on the metro are lower than bus fares.","a":"NG","why":"Bài không nói giá vé."},{"t":"mcq","q":"Which station is most likely to lift nearby values?","opts":["One surrounded by empty land","One connected to buses, offices and shops","One at the end of the line","One without parking"],"a":1,"why":"Đoạn 3."},{"t":"mcq","q":"What does 'priced in' mean here?","opts":["Already reflected in current prices","Fixed by the government","Paid in instalments","Included in the ticket"],"a":0,"why":"Đoạn 2."},{"t":"gap","q":"Economists call the effect of transport on land prices ___.","a":"capitalisation","why":"Đoạn 2."},{"t":"gap","q":"Walking distance usually means 500 to ___ metres from a station.","a":"800","why":"Đoạn 2."},{"t":"gap","q":"Planners promote transit-oriented ___ around stations.","a":"development","why":"Đoạn 3."}]},{"id":"r-green","tier":3,"dom":"ec","title":"Green buildings: cost or investment?","vi":"Công trình xanh: chi phí hay khoản đầu tư?","source":"Bài viết gốc của app, tổng hợp kiến thức ngành","paras":[{"en":"For years, developers in Vietnam treated green certification as a marketing extra. That view is changing. Multinational tenants increasingly have their own carbon targets, and many will only lease space in certified buildings. In the office market, a LEED or EDGE certificate is becoming less a selling point than a requirement for entry.","vi":"Nhiều năm qua, chủ đầu tư ở Việt Nam coi chứng nhận xanh như một thứ phụ trợ cho marketing. Quan điểm đó đang thay đổi. Khách thuê đa quốc gia ngày càng có mục tiêu carbon riêng, và nhiều đơn vị chỉ thuê mặt bằng trong tòa nhà có chứng nhận. Ở thị trường văn phòng, chứng chỉ LEED hay EDGE đang dần không còn là điểm cộng mà là điều kiện để được xem xét."},{"en":"The economics are better than many assume. EDGE, a standard developed by the International Finance Corporation, requires at least 20 percent savings in energy, water and the energy embodied in materials compared with a conventional building. Achieving that often adds only a few percent to construction costs, mainly through better glazing, efficient air conditioning and smarter design. Lower utility bills then reduce service charges, which makes the building easier to lease and helps it keep its value.","vi":"Bài toán kinh tế tốt hơn nhiều người nghĩ. EDGE, tiêu chuẩn do Tổ chức Tài chính Quốc tế (IFC) xây dựng, yêu cầu tiết kiệm ít nhất 20% năng lượng, nước và năng lượng hàm chứa trong vật liệu so với công trình thông thường. Đạt mức này thường chỉ tăng vài phần trăm chi phí xây dựng, chủ yếu nhờ kính tốt hơn, điều hòa hiệu quả và thiết kế thông minh. Hóa đơn điện nước thấp hơn giúp giảm phí dịch vụ, khiến tòa nhà dễ cho thuê hơn và giữ giá tốt hơn."},{"en":"Finance is moving in the same direction. Banks and bond investors are beginning to offer better terms for green projects, while buildings that fall behind risk becoming stranded assets that are expensive to upgrade later. The main danger for developers now is greenwashing: vague claims about being 'eco' without measurable data. Certification, monitored performance and transparent reporting are what separate genuine green buildings from marketing.","vi":"Tài chính cũng đi theo hướng đó. Ngân hàng và nhà đầu tư trái phiếu bắt đầu đưa điều kiện tốt hơn cho dự án xanh, còn những tòa nhà tụt lại có nguy cơ trở thành tài sản mắc kẹt, tốn kém để nâng cấp về sau. Rủi ro chính với chủ đầu tư hiện nay là tẩy xanh: tuyên bố mơ hồ về 'sinh thái' mà không có số liệu đo được. Chứng nhận, theo dõi hiệu suất vận hành và báo cáo minh bạch là thứ phân biệt công trình xanh thật với marketing."}],"gloss":{"certification":"chứng nhận","multinational":"đa quốc gia","carbon targets":"mục tiêu carbon","selling point":"điểm bán hàng","requirement for entry":"điều kiện tối thiểu","embodied":"hàm chứa","conventional":"thông thường","glazing":"kính (cửa, mặt dựng)","utility bills":"hóa đơn điện nước","service charges":"phí dịch vụ","terms":"điều kiện (vay vốn)","stranded assets":"tài sản mắc kẹt","greenwashing":"tẩy xanh","measurable":"đo lường được","transparent":"minh bạch","genuine":"thật sự"},"figs":[["EDGE (IFC)","Minimum energy saving","20%","vs công trình thông thường",""],["EDGE (IFC)","Minimum water saving","20%","",""],["EDGE (IFC)","Minimum embodied-energy saving","20%","",""]],"q":[{"t":"tfng","q":"Many multinational tenants now require certified buildings.","a":"T","why":"Đoạn 1."},{"t":"tfng","q":"EDGE was developed by the World Green Building Council.","a":"F","why":"Đoạn 2: do IFC xây dựng."},{"t":"tfng","q":"Green certification usually doubles construction costs.","a":"F","why":"Đoạn 2: chỉ tăng vài phần trăm."},{"t":"tfng","q":"Most green buildings in Vietnam are in Hanoi.","a":"NG","why":"Bài không nói."},{"t":"mcq","q":"How do lower utility bills help a building?","opts":["They raise service charges","They make it easier to lease","They remove the need for certification","They increase construction costs"],"a":1,"why":"Đoạn 2."},{"t":"mcq","q":"What separates genuine green buildings from greenwashing?","opts":["A bigger marketing budget","Certification and measurable reporting","Using the word 'eco'","Location"],"a":1,"why":"Đoạn 3."},{"t":"gap","q":"EDGE requires at least ___ percent savings in energy and water.","a":"20","why":"Đoạn 2."},{"t":"gap","q":"Buildings that fall behind risk becoming ___ assets.","a":"stranded","why":"Đoạn 3."},{"t":"gap","q":"Vague green claims without data are called ___.","a":"greenwashing","why":"Đoạn 3."}]},{"id":"r-eia","tier":3,"dom":"ec","title":"Building by the sea: what an environmental impact assessment covers","vi":"Xây dự án ven biển: ĐTM xem xét những gì?","source":"Bài viết gốc của app, tổng hợp quy trình ĐTM chung","paras":[{"en":"Large coastal projects such as the planned urban area in Can Gio, which covers roughly 2,870 hectares including reclaimed land, or the mega townships around Ha Long Bay, cannot begin construction without an approved environmental impact assessment. Under Vietnam's Law on Environmental Protection 2020, the assessment is meant to identify harm before it happens, not to justify a decision already made.","vi":"Các dự án ven biển lớn như khu đô thị dự kiến ở Cần Giờ, rộng khoảng 2.870 ha kể cả phần lấn biển, hay các đại đô thị quanh vịnh Hạ Long, không thể khởi công nếu ĐTM chưa được phê duyệt. Theo Luật Bảo vệ môi trường 2020, ĐTM nhằm nhận diện tác hại trước khi xảy ra, chứ không phải để hợp thức hóa một quyết định đã có sẵn."},{"en":"A credible assessment follows several steps. It begins with scoping, deciding which impacts matter most, and a baseline survey of the existing environment: water quality, sediment, mangroves, fisheries and the communities that depend on them. It then predicts the effects of dredging, land reclamation, construction traffic and future waste water, and proposes mitigation measures such as replanting mangroves, silt curtains during dredging and treatment plants sized for the eventual population.","vi":"Một ĐTM đáng tin cậy gồm nhiều bước. Bắt đầu bằng xác định phạm vi, tức chọn các tác động quan trọng nhất, và khảo sát hiện trạng môi trường nền: chất lượng nước, trầm tích, rừng ngập mặn, nguồn lợi thủy sản và cộng đồng sống dựa vào chúng. Sau đó dự báo tác động của nạo vét, lấn biển, giao thông thi công và nước thải trong tương lai, rồi đề xuất biện pháp giảm thiểu như trồng lại rừng ngập mặn, màng chắn bùn khi nạo vét và nhà máy xử lý đủ công suất cho dân số khi dự án hoàn chỉnh."},{"en":"Two elements are often weakest in practice. Public consultation can be rushed, leaving local residents and fishers with little real influence. And monitoring after approval is frequently underfunded, so no one checks whether the promised mitigation actually works. For investors and buyers, the quality of an assessment is also a financial signal: projects with credible environmental plans face fewer delays, lower climate risk and stronger appeal to international funds.","vi":"Hai khâu thường yếu nhất trên thực tế. Tham vấn cộng đồng có thể bị làm vội, khiến cư dân và ngư dân địa phương ít có ảnh hưởng thật. Và giám sát sau phê duyệt thường thiếu kinh phí, nên không ai kiểm tra biện pháp giảm thiểu đã hứa có hiệu quả hay không. Với nhà đầu tư và người mua, chất lượng ĐTM cũng là một tín hiệu tài chính: dự án có kế hoạch môi trường đáng tin cậy ít bị chậm trễ, ít rủi ro khí hậu hơn và hấp dẫn hơn với quỹ quốc tế."}],"gloss":{"reclaimed":"được lấn biển, san lấp","justify":"hợp thức hóa, biện minh","credible":"đáng tin cậy","scoping":"xác định phạm vi","baseline survey":"khảo sát hiện trạng nền","sediment":"trầm tích","fisheries":"nguồn lợi thủy sản","dredging":"nạo vét","mitigation measures":"biện pháp giảm thiểu","silt curtains":"màng chắn bùn","treatment plants":"nhà máy xử lý","consultation":"tham vấn","underfunded":"thiếu kinh phí","monitoring":"giám sát","appeal":"sức hấp dẫn"},"figs":[["Cần Giờ","Planned urban area incl. reclamation","~2,870 ha","",""],["Pháp lý · Legal","Governing law","Law on Environmental Protection 2020","",""]],"q":[{"t":"tfng","q":"Large coastal projects may begin construction before the assessment is approved.","a":"F","why":"Đoạn 1."},{"t":"tfng","q":"A baseline survey records the environment before the project starts.","a":"T","why":"Đoạn 2."},{"t":"tfng","q":"The Can Gio project will house exactly 200,000 residents.","a":"NG","why":"Bài không nêu dân số."},{"t":"tfng","q":"Monitoring after approval is often well funded.","a":"F","why":"Đoạn 3: thường thiếu kinh phí."},{"t":"mcq","q":"Which is given as a mitigation measure?","opts":["Increasing building heights","Replanting mangroves","Lowering prices","Hiring more agents"],"a":1,"why":"Đoạn 2."},{"t":"mcq","q":"Why does assessment quality matter to investors?","opts":["It guarantees higher rents","It signals fewer delays and lower climate risk","It replaces a construction permit","It reduces taxes"],"a":1,"why":"Đoạn 3."},{"t":"gap","q":"The assessment begins with ___, deciding which impacts matter most.","a":"scoping","why":"Đoạn 2."},{"t":"gap","q":"Silt ___ can be used during dredging.","a":"curtains","why":"Đoạn 2."},{"t":"gap","q":"Public ___ can be rushed in practice.","a":"consultation","why":"Đoạn 3."}]},{"id":"r-bonds","tier":3,"dom":"fi","title":"Corporate bonds and Vietnam's developers","vi":"Trái phiếu doanh nghiệp và các chủ đầu tư Việt Nam","source":"Bài viết gốc của app, tổng hợp diễn biến thị trường trái phiếu","paras":[{"en":"Before 2022, corporate bonds were one of the easiest ways for Vietnamese developers to raise money. Banks limited lending to real estate, so companies turned to bonds sold through private placement, often to individual investors attracted by coupons above 10 percent. Many of these bonds were backed by land or shares in the developer itself, and investors had limited information about the projects behind them.","vi":"Trước 2022, trái phiếu doanh nghiệp là một trong những cách dễ nhất để chủ đầu tư Việt Nam huy động vốn. Ngân hàng hạn chế cho vay bất động sản, nên doanh nghiệp chuyển sang trái phiếu phát hành riêng lẻ, thường bán cho nhà đầu tư cá nhân bị hấp dẫn bởi lãi suất trên 10%. Nhiều trái phiếu được bảo đảm bằng đất hoặc cổ phiếu của chính chủ đầu tư, và nhà đầu tư có rất ít thông tin về dự án phía sau."},{"en":"In 2022 confidence collapsed after several high-profile violations came to light. New issuance almost stopped, and developers that had relied on rolling over debt suddenly faced large maturities with no way to refinance. To prevent a chain of defaults, the government issued Decree 08 in March 2023, allowing issuers to negotiate maturity extensions of up to two years with bondholders and, with their consent, to repay in other assets such as property.","vi":"Năm 2022, niềm tin sụp đổ sau khi nhiều vụ vi phạm lớn bị phát hiện. Phát hành mới gần như ngừng, và những chủ đầu tư quen đảo nợ bỗng đối mặt lượng trái phiếu đáo hạn lớn mà không thể tái cấp vốn. Để ngăn chuỗi vỡ nợ, Chính phủ ban hành Nghị định 08 vào tháng 3/2023, cho phép doanh nghiệp thương lượng với trái chủ gia hạn tối đa hai năm và, nếu trái chủ đồng ý, trả nợ bằng tài sản khác như bất động sản."},{"en":"The market has since recovered, but on different terms. Issuers now face stricter disclosure rules, public offerings increasingly require a credit rating, and banks dominate the investor base more than individuals do. For anyone assessing a developer, the bond schedule remains a key document: large maturities in the next twelve months, high coupons and collateral tied to unfinished projects are warning signs, while green bonds and longer tenors suggest a stronger financial position.","vi":"Thị trường sau đó đã phục hồi, nhưng theo luật chơi khác. Doanh nghiệp phát hành phải tuân thủ quy định công bố thông tin chặt hơn, phát hành ra công chúng ngày càng cần xếp hạng tín nhiệm, và ngân hàng chiếm phần lớn nhà đầu tư thay vì cá nhân. Với bất kỳ ai thẩm định một chủ đầu tư, lịch đáo hạn trái phiếu vẫn là tài liệu then chốt: lượng đáo hạn lớn trong 12 tháng tới, lãi suất cao và tài sản bảo đảm gắn với dự án dở dang là tín hiệu cảnh báo, còn trái phiếu xanh và kỳ hạn dài hơn cho thấy sức khỏe tài chính tốt hơn."}],"gloss":{"raise money":"huy động vốn","private placement":"phát hành riêng lẻ","coupons":"lãi suất danh nghĩa trái phiếu","backed by":"được bảo đảm bằng","high-profile":"gây chú ý lớn","violations":"vi phạm","issuance":"phát hành","rolling over":"đảo nợ","maturities":"khoản đáo hạn","refinance":"tái cấp vốn","defaults":"vỡ nợ","extensions":"gia hạn","bondholders":"trái chủ","consent":"sự đồng ý","disclosure":"công bố thông tin","credit rating":"xếp hạng tín nhiệm","collateral":"tài sản bảo đảm","tenors":"kỳ hạn"},"figs":[["Mốc · Milestones","Confidence crisis","2022","",""],["Mốc · Milestones","Decree 08/2023","March 2023","",""],["Nghị định 08 · Decree 08","Maximum maturity extension","2 years","nếu trái chủ đồng ý",""],["Trước 2022 · Pre-2022","Typical coupons attracting individuals","above 10%","",""]],"q":[{"t":"tfng","q":"Before 2022, many developer bonds were sold through private placement.","a":"T","why":"Đoạn 1."},{"t":"tfng","q":"Decree 08 allowed issuers to extend maturities without bondholders' agreement.","a":"F","why":"Đoạn 2: phải thương lượng, cần sự đồng ý."},{"t":"tfng","q":"Individuals now make up most of the bond investor base.","a":"F","why":"Đoạn 3: ngân hàng chiếm phần lớn."},{"t":"tfng","q":"The average coupon in 2026 is 9 percent.","a":"NG","why":"Bài không nêu."},{"t":"mcq","q":"Why did developers turn to bonds before 2022?","opts":["Bonds were tax-free","Banks limited real estate lending","The stock market was closed","Foreign investors demanded it"],"a":1,"why":"Đoạn 1."},{"t":"mcq","q":"Which is described as a warning sign?","opts":["Green bonds","Longer tenors","Large maturities in the next twelve months","A credit rating"],"a":2,"why":"Đoạn 3."},{"t":"gap","q":"Decree 08 allowed maturity extensions of up to ___ years.","a":"two","why":"Đoạn 2."},{"t":"gap","q":"Developers that relied on ___ over debt faced large maturities.","a":"rolling","why":"Đoạn 2."},{"t":"gap","q":"Public offerings increasingly require a credit ___.","a":"rating","why":"Đoạn 3."}]}]}</script>
<script>
'use strict';
const DATA = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s), esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const H = 3600e3, D = 24 * H;
const TIER = {1: ['Cơ bản', 'B2 · công việc hằng ngày'], 2: ['Trôi chảy', 'C1 · đàm phán, báo cáo'], 3: ['Giao tiếp chuyên sâu', 'C1–C2 · thuật ngữ ngành']};
const DOM = {re: ['Bất động sản', 'var(--re)'], mk: ['Marketing', 'var(--mk)'], fi: ['Tài chính', 'var(--fi)'], ec: ['Kinh tế vi mô, vĩ mô', 'var(--ec)']};
const UNITS = DATA.units, UBY = Object.fromEntries(UNITS.map(u => [u.id, u]));
/* từ: [en,pos,vi,zh,py,colloc,ex,exvi] */
const WORDS = UNITS.flatMap(u => u.words.map(w => ({id: u.id + ':' + w[0], u: u.id, en: w[0], pos: w[1], vi: w[2], zh: w[3], py: w[4], co: w[5], ex: w[6], exvi: w[7]})));
const WBY = Object.fromEntries(WORDS.map(w => [w.id, w]));

/* ---------- state ---------- */
const KEY = 'en-v1';
let S = {cards: {}, weak: {}, nb: {}, packs: [], done: {}, tier: 1, days: {}, zh: 1, rate: 1, best: 0};
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function today(t = Date.now()){ const d = new Date(t); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function bump(n = 1){ S.days[today()] = (S.days[today()] || 0) + n; }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function reads(){ return [...DATA.reads, ...S.packs.filter(p => p.type === 'reading')]; }
function listens(){ return S.packs.filter(p => p.type === 'listening'); }

/* ---------- thẻ: cả từ giáo trình lẫn từ trong sổ ---------- */
function nbWord(k){ const n = S.nb[k]; return n && {id: 'nb:' + k, en: n.w || k, vi: n.m || '', nb: 1, ex: n.ctx || '', note: n.note || '', zh: n.lang === 'zh' ? '' : n.zh || '', py: n.lang === 'zh' ? '' : n.py || '', pos: n.ipa || n.pos || '', lang: n.lang || 'en'}; }
function getW(id){ return id.startsWith('nb:') ? nbWord(id.slice(3)) : WBY[id]; }
/* S.cards[id] = [khoảng cách (giờ), đến hạn, số lần quên] */
function nextIv(c, g){ const iv = c ? c[0] : 0; return g === 0 ? 0 : g === 1 ? Math.max(6, Math.round(iv * 1.2)) : g === 2 ? (iv ? Math.round(iv * 2.5) : 12) : (iv ? Math.round(iv * 3.5) : 48); }
function fmtIv(h){ if (!h) return '1 phút'; if (h < 24) return h + ' giờ'; const d = Math.round(h / 24); return d < 31 ? d + ' ngày' : Math.round(d / 30) + ' tháng'; }
function grade(id, g){
  const c = S.cards[id], iv = nextIv(c, g), now = Date.now();
  S.cards[id] = [iv, now + (iv ? iv * H : 60e3), (c ? c[2] : 0) + (g === 0 ? 1 : 0)];
  if (g === 0) S.weak[id] = [(S.weak[id] ? S.weak[id][0] : 0) + 1, 0];
  else if (g >= 2 && S.weak[id]){ if (++S.weak[id][1] >= 2) delete S.weak[id]; }
  bump(); save();
}
function dueIds(){ const now = Date.now(); return Object.keys(S.cards).filter(id => S.cards[id][1] <= now + H && getW(id)); }
function weakIds(){ return Object.keys(S.weak).filter(getW); }
function stOf(id){ const c = S.cards[id]; return !c ? '' : c[0] >= 24 * 7 ? 'k' : 'l'; }

/* ---------- giọng đọc ---------- */
let voices = [];
function loadVoices(){ try { voices = speechSynthesis.getVoices(); } catch (e) {} }
if ('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(lang){ const v = voices.filter(x => x.lang && x.lang.replace('_', '-').toLowerCase().startsWith(lang));
  const good = /Samantha|Daniel|Karen|Google US|Google UK|Natural|Aria|Jenny|Ting-?Ting|Lili|Xiaoxiao|Google 普通话/i; return v.find(x => good.test(x.name)) || v[0]; }
function speak(text, lang = 'en', rate, onend){
  if (!('speechSynthesis' in window)){ onend && onend(); return; }
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); const v = pickVoice(lang === 'zh' ? 'zh' : 'en');
  if (v){ u.voice = v; u.lang = v.lang; } else u.lang = lang === 'zh' ? 'zh-CN' : 'en-US';
  u.rate = rate || (lang === 'zh' ? 0.85 : S.rate || 1); if (onend) u.onend = onend; speechSynthesis.speak(u);
}

/* ---------- chữ chạm được + sổ từ ---------- */
function normA(w){ return norm(w).replace(/,/g, ''); }
function norm(w){ return w.toLowerCase().replace(/[’']/g, "'").replace(/^[^a-z0-9]+|[^a-z0-9]+$/g, ''); }
function glossOf(k, gl){ gl = gl || {}; const tries = [k, k.replace(/s$/, ''), k.replace(/es$/, ''), k.replace(/ed$/, ''), k.replace(/ing$/, ''), k.replace(/d$/, '')];
  for (const t of tries){ if (gl[t]) return gl[t]; const w = WORDS.find(x => x.en === t); if (w) return w.vi; }
  if (k.length >= 4){ const ph = Object.keys(gl).find(p => p.includes(' ') || p.includes('-') ? p.split(/[ -]/).some(x => tries.includes(x)) : false); if (ph) return ph + ': ' + gl[ph]; } return ''; }
function tappable(text, gl, ctxId){
  return esc(text).replace(/[A-Za-z][A-Za-z’'-]*/g, m => { const k = norm(m); if (k.length < 2) return m;
    return `<span class="tw ${S.nb[k] ? 'sv' : ''} ${gl && glossOf(k, gl) ? 'gl' : ''}" data-tw="${esc(k)}" data-ctx="${esc(ctxId || '')}">${m}</span>`; });
}
let sheetGl = null;
function openSheet(k, sentence){
  const n = S.nb[k], g = glossOf(k, sheetGl);
  $('#sheet').innerHTML = `<div class="sheet"><div style="display:flex;justify-content:space-between;align-items:center"><h3>${esc(k)}</h3><button class="sp" data-say="${esc(k)}">🔊</button></div>
    ${g ? `<div style="font-size:16px">${esc(g)}</div>` : `<div class="note">Chưa có nghĩa trong bài. Tự ghi nghĩa hoặc tra từ điển rồi lưu.</div>`}
    <input class="inp" id="shm" style="margin-top:10px" placeholder="Nghĩa tiếng Việt (ghi theo cách bạn hiểu)" value="${esc(n ? n.m : g)}">
    <div class="rw"><button class="btn" data-nbsave="${esc(k)}" data-ctx="${esc(sentence || '')}">${n ? 'Cập nhật' : '+ Lưu vào Sổ từ'}</button>
      ${n ? `<button class="btn line" data-nbdel="${esc(k)}">Bỏ khỏi sổ</button>` : ''}
      <a class="btn ghost" target="_blank" rel="noopener" href="https://dictionary.cambridge.org/dictionary/english-vietnamese/${encodeURIComponent(k)}">Tra Cambridge</a>
      <button class="btn line" data-shclose>Đóng</button></div></div>`;
}
function closeSheet(){ $('#sheet').innerHTML = ''; }

/* ---------- khung ---------- */
function header(){ return `<header class="top"><div class="brand"><div class="logo">EN</div><div><b>Business English · B2+</b><small>${WORDS.length} từ · ${UNITS.reduce((n, u) => n + u.sents.length, 0)} mẫu câu · ${UNITS.length} bài · ${reads().length} bài đọc</small></div></div>
  <div class="lsw"><a href="index.html">中文</a><span>English</span></div></header>`; }
function nav(r){ const it = [['home', '🏠', 'Trang chủ'], ['fc-due', '🗂', 'Ôn tập'], ['doc', '📖', 'Đọc'], ['nghe', '🎧', 'Nghe'], ['so', '📒', 'Sổ từ']];
  $('#nav').innerHTML = it.map(([h, i, l]) => `<a href="#${h}" class="${r === h || (h !== 'home' && r.startsWith(h)) ? 'on' : ''}"><span>${i}</span>${l}</a>`).join(''); }
function route(){ return decodeURIComponent(location.hash.slice(1)) || 'home'; }

/* ---------- trang chủ ---------- */
function viewHome(){
  const due = dueIds().length, wk = weakIds().length, nb = Object.keys(S.nb).length, learned = WORDS.filter(w => S.cards[w.id]).length;
  const us = UNITS.filter(u => u.tier === S.tier && (!S.dom || S.dom === 'all' || u.dom === S.dom));
  return header() + `<div class="card today"><b style="font-size:18px">Hôm nay</b>
    <div class="trow"><span><b>${due}</b> thẻ đến hạn</span><span><b>${wk}</b> từ cần ôn</span><span><b>${nb}</b> từ trong sổ</span><span><b>${learned}</b>/${WORDS.length} từ đã học</span></div>
    <a class="btn block" href="${due ? '#fc-due' : wk ? '#fc-weak' : '#u-' + (UNITS.find(u => u.words.some(w => !S.cards[u.id + ':' + w[0]])) || UNITS[0]).id}">▶ ${due ? 'Ôn ' + due + ' thẻ đến hạn' : wk ? 'Ôn từ cần ôn' : 'Học bài tiếp theo'}</a></div>
  <h2>Giáo trình theo bậc</h2>
  <div class="seg" style="margin-bottom:10px">${[1, 2, 3].map(t => `<button class="${S.tier === t ? 'on' : ''}" data-tier="${t}">${TIER[t][0]}</button>`).join('')}</div>
  <p class="sub">${TIER[S.tier][1]}</p>
  <div class="seg" style="margin-bottom:12px">${[['all','Tất cả'],...Object.entries(DOM).map(([k,v])=>[k,v[0]])].map(([k,l])=>`<button class="${(S.dom||'all')===k?'on':''}" data-dom="${k}">${l}</button>`).join('')}</div>
  <div class="grid">${us.map(u => { const n = u.words.filter(w => S.cards[u.id + ':' + w[0]]).length; return `<a class="unit" style="--c:${DOM[u.dom][1]}" href="#u-${u.id}"><span class="chip" style="--c:${DOM[u.dom][1]}">${DOM[u.dom][0]}</span><b>${esc(u.title)}</b><small>${esc(u.vi)} · ${u.words.length} từ · ${u.sents.length} mẫu câu</small><div class="pg"><i style="width:${n / u.words.length * 100}%"></i></div></a>`; }).join('')}</div>
  <h2>Luyện kỹ năng</h2>
  <div class="tiles">
    <a class="tile" href="#doc"><div class="ic">📖</div><b>Đọc hiểu</b><small>Bài đọc + câu hỏi kiểu IELTS</small></a>
    <a class="tile" href="#nghe"><div class="ic">🎧</div><b>Nghe chép chính tả</b><small>Gõ từng câu hoặc điền chỗ trống</small></a>
    <a class="tile" href="#noi-tu"><div class="ic">🧩</div><b>Nối từ</b><small>Từ đã học và từ trong sổ</small></a>
    <a class="tile" href="#nhap"><div class="ic">📥</div><b>Nhập tài liệu</b><small>Văn bản, YouTube, gói bài học</small></a>
  </div>`;
}

/* ---------- bài học ---------- */
let uTab = 'w';
function viewUnit(u){
  const c = DOM[u.dom][1];
  const words = u.words.map(w => { const id = u.id + ':' + w[0]; return `<div class="w"><span class="st ${stOf(id)}"></span><div class="m"><b>${esc(w[0])}</b><span class="pos">${esc(w[1])}</span><span class="vi">${esc(w[2])}</span>
    ${S.zh ? `<span class="zhl">${esc(w[3])}</span> <span class="py">${esc(w[4])}</span>` : ''}<div class="co">${esc(w[5])}</div><div class="ex">${tappable(w[6])}<i>${esc(w[7])}</i></div></div>
    <button class="sp" data-say="${esc(w[0])}">🔊</button></div>`; }).join('');

function startDict(k){ const s = dictSrc(k); Dc = s ? Object.assign(s, {k, i: 0, mode: Dc ? Dc.mode : 'full', st: {}}) : null; }

function parseTranscript(txt){

    if (d.dnext !== undefined || d.dskip !== undefined){ if (Dc.i + 1 < Dc.items.length){ Dc.i++; return viewKeepYT(true); } location.hash = Dc.back; return; }

  }

  if (d.impread !== undefined){ const txt = ($('#itxt').value || '').trim(); if (txt.length < 40){ impMsg = 'Nội dung quá ngắn.'; return render(); }

  if (d.impyt !== undefined){ const id = ytId($('#yurl').value || ''), lines = parseTranscript($('#ysub').value || ''); if (!id){ impMsg = 'Link YouTube không hợp lệ.'; return render(); } if (lines.length < 2){ impMsg = 'Không đọc được phụ đề. Phụ đề cần có mốc thời gian (0:06 hoặc định dạng .srt).'; return render(); }
    const pid = 'y' + id; addPack({type: 'listening', id: pid, title: ($('#ytit').value || '').trim() || 'Video ' + id, yt: id, lines}); location.hash = 'dict-l-' + pid; return; }
  if (d.delpack){ S.packs = S.packs.filter(p => p.id !== d.delpack); save(); return render(); }
});
