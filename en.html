<style>
:root{--bg:#F3F0E8;--card:#fff;--ink:#161A27;--muted:#575D6E;--line:#DCD6C8;--soft:#EAE6DC;--primary:#0E6B5C;--primary-2:#D9F0EA;--accent:#F4622A;
--good:#1E8443;--bad:#D12B30;--re:#B4530A;--mk:#B02A6B;--fi:#1565BF;--ec:#5B3FC4;--zh:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#14151B;--card:#1D1F28;--ink:#EEF0F6;--muted:#9AA0AE;--line:#2C2F3B;--soft:#252834;--primary:#4CC9B0;--primary-2:#17352F;--good:#4CC97A;--bad:#FF6B6E;--re:#F0A35A;--mk:#F07AB0;--fi:#6FB1FF;--ec:#A592FF}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5}
a{color:var(--primary)}button{font:inherit;cursor:pointer}
#app{max-width:860px;margin:0 auto;padding:14px 14px 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:13px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px}
.brand b{display:block;font-size:17px}.brand small{color:var(--muted);font-size:12.5px}
.lsw{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card);font-size:13px;font-weight:700}
.lsw{flex:none}.lsw a,.lsw span{white-space:nowrap;padding:6px 12px;text-decoration:none;color:var(--muted)}.lsw span{background:var(--primary);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
h1{font-size:23px;margin:0 0 4px}h2{font-size:17px;margin:20px 4px 8px}.sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.btn{display:inline-block;border:0;border-radius:14px;background:var(--primary);color:#fff;font-weight:700;padding:11px 16px;text-decoration:none;text-align:center}
.btn.ghost{background:var(--primary-2);color:var(--primary)}.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}.btn.block{display:block;width:100%}
.btn:disabled{opacity:.45}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}.seg button{border:0;background:transparent;border-radius:9px;padding:7px 12px;font-weight:600;color:var(--muted)}.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.back{display:inline-block;margin-bottom:8px;text-decoration:none;font-weight:600}
.chip{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:2px 9px;background:color-mix(in srgb,var(--c,var(--primary)) 18%,transparent);color:var(--c,var(--primary))}
.today{border-left:5px solid var(--primary)}.trow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.trow span{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--soft)}.trow b{color:var(--primary)}
.grid{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.unit{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:16px;padding:13px 14px}
.unit b{display:block;font-size:15.5px}.unit small{color:var(--muted);font-size:13px;display:block}.unit .pg{height:6px;border-radius:3px;background:var(--line);margin-top:9px;overflow:hidden}.unit .pg i{display:block;height:100%;background:var(--c)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px}.tile .ic{font-size:22px}.tile b{display:block;margin-top:4px}.tile small{color:var(--muted);font-size:12.5px}
.w{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}.w:last-child{border:0}.w .m{flex:1;min-width:0}
.w b{font-size:16.5px}.w .pos{font-size:12px;color:var(--muted);font-style:italic;margin-left:4px}.w .vi{display:block;font-size:14.5px}.zhl{font-family:var(--zh);font-size:15px;color:var(--ec)}.py{font-size:12.5px;color:var(--muted)}
.w .co{font-size:13px;color:var(--muted);margin-top:3px}.w .ex{font-size:14px;margin-top:4px}.w .ex i{color:var(--muted);display:block;font-size:13px}
.sp{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--primary);display:grid;place-items:center;font-size:15px}
.st{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none;margin-top:8px}.st.l{background:#8E81EC}.st.k{background:var(--good)}
.sent{padding:12px 0;border-bottom:1px solid var(--line)}.sent:last-child{border:0}.sent .en{font-size:16.5px;font-weight:600}.sent .vi{font-size:14.5px;color:var(--muted)}.sent .row{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.flash{min-height:300px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;cursor:pointer}.flash .big{font-size:32px;font-weight:800;line-height:1.2}.flash .hint{color:var(--muted);font-size:13px;margin-top:10px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:sticky;bottom:10px}.grades button{border:0;border-radius:14px;color:#fff;font-weight:800;padding:10px 4px}.grades small{display:block;font-weight:500;font-size:11.5px;opacity:.9}
.g0{background:#D12B30}.g1{background:#DE7A00}.g2{background:#1E8443}.g3{background:#1565BF}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden;flex:1}.prog i{display:block;height:100%;background:var(--primary)}
.sh{display:flex;gap:10px;align-items:center;margin-bottom:10px}.sh .x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;text-decoration:none;color:var(--ink);font-weight:700;flex:none}
.para{font-size:17px;line-height:1.75;margin:0 0 14px}.para .tr{display:block;font-size:14.5px;line-height:1.55;color:var(--muted);margin-top:6px;border-left:3px solid var(--line);padding-left:10px}
.tw{cursor:pointer;border-radius:4px}.tw:hover{background:var(--primary-2)}.tw.sv{background:#FFE9A8;color:#5A3A00}.tw.gl{border-bottom:1.5px dotted var(--primary)}
@media (prefers-color-scheme:dark){.tw.sv{background:#5A4410;color:#FFE2A8}}
.q{padding:12px 0;border-bottom:1px solid var(--line)}.q:last-child{border:0}.q p{margin:0 0 8px;font-weight:600}.q .opts{display:flex;flex-wrap:wrap;gap:8px}
.q .o{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:7px 12px;color:var(--ink);text-align:left}.q .o.on{border-color:var(--primary);background:var(--primary-2)}.q .o.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--card))}.q .o.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
.q input,.inp{font:inherit;padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}.q input{max-width:240px}.q input.ok{border-color:var(--good)}.q input.no{border-color:var(--bad)}
.figs summary{cursor:pointer;font-weight:700}.figs table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}.figs td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}.figs td:nth-child(2){text-align:right;width:48%}.figs td:nth-child(2) span{display:block;font-size:12.5px;color:var(--muted)}.figs td small{display:block;color:var(--muted);font-size:11px}.figs td span.up{color:var(--good)}.figs td span.dn{color:var(--bad)}.figs tr.fseg td{background:var(--soft);font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--primary)}
.why{font-size:13.5px;color:var(--muted);margin-top:6px}
textarea.inp{min-height:96px;resize:vertical}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px;box-shadow:0 -10px 30px rgba(0,0,0,.18);z-index:50;max-width:860px;margin:0 auto}
.sheet h3{margin:0 0 4px;font-size:22px}.sheet .rw{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.dtext{font-size:19px;line-height:1.9;margin:10px 0}.dw{display:inline-block;margin:0 2px;border-bottom:2px solid var(--line);min-width:1.2em;text-align:center}.dw.ok{color:var(--good);border-color:transparent}.dw.miss{color:var(--bad)}.dw.hid{color:var(--muted);letter-spacing:1px}
.cz{display:inline-block;width:auto;min-width:60px;font:inherit;font-size:17px;padding:2px 6px;margin:2px;border:0;border-bottom:2.5px solid var(--primary);background:var(--primary-2);border-radius:6px 6px 0 0;color:var(--ink);text-align:center}.cz.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--card))}.cz.no{border-color:var(--bad)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.ctl .sp{width:44px;height:44px;font-size:18px}
.yt{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;background:#000;margin-bottom:10px}.yt>div,.yt iframe{position:absolute;inset:0;width:100%;height:100%}
.res{font-weight:800;margin:8px 0}.res.ok{color:var(--good)}.res.no{color:var(--bad)}
.nbx{border-bottom:1px solid var(--line);padding-bottom:6px}.nbx:last-child{border:0}.nbx .nbrow{border:0}.nbmeta{font-size:13px;color:var(--muted);padding:0 0 4px}.nbmeta span{margin-right:6px}.nbctx{font-style:italic;margin-top:3px}.nbnote{color:var(--ink);margin-top:3px}.nbsrc{font-size:12px;display:inline-block;margin-top:3px;text-decoration:none}
.nbrow{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.nbrow:last-child{border:0}.nbrow b{min-width:110px}.nbrow input{flex:1;min-width:0}.nbrow button{border:0;background:transparent;color:var(--muted);font-size:16px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:10px;border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 80%,#fff),var(--primary))}
.mcard{min-height:100px;border-radius:14px;border:0;border-bottom:4px solid rgba(0,0,0,.22);padding:8px 6px;font-weight:700;font-size:15px;background:#fff;color:#161A27;transition:transform .12s,opacity .3s}
.mcard.v{background:#FFF3D6;color:#6B3A00;border-bottom-color:#DE7A00}.mcard.sel{transform:translateY(-3px) scale(1.03);box-shadow:0 0 0 3.5px #FFD23F}.mcard.ok{background:#CFF5DC;transform:scale(1.05)}.mcard.no{background:#FFD9DA;animation:shake .4s}.mcard.gone{opacity:0;pointer-events:none}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media(min-width:900px){.mcard{min-height:140px;font-size:18px}}
.done{text-align:center}.done .em{font-size:44px;font-weight:900;color:var(--primary)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40}
nav.bottom a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600}nav.bottom a.on{color:var(--primary)}nav.bottom span{display:block;font-size:19px}
.note{font-size:13.5px;color:var(--muted)}code{background:var(--soft);padding:1px 6px;border-radius:6px;font-size:13px}
pre{background:var(--soft);padding:10px;border-radius:12px;font-size:12px;overflow:auto}
</style>

 once the down payment clears.","Hợp đồng mua bán được ký khi khoản thanh toán đợt đầu đã vào tài khoản."],["reservation fee","n","phí giữ chỗ","认筹金","rènchóu jīn","pay a reservation fee · a refundable reservation fee","A refundable reservation fee holds your place in the queue.","Phí giữ chỗ có hoàn lại giúp anh chị giữ thứ tự ưu tiên."],["fully furnished","adj","đầy đủ nội thất","精装修","jīng zhuāngxiū","a fully furnished unit · handed over fully furnished","Every unit is handed over fully furnished.","Mọi căn đều bàn giao đầy đủ nội thất."],["net saleable area","n","diện tích thông thủy","套内面积","tàonèi miànjī","priced on net saleable area · the net saleable area of the unit","The price is calculated on net saleable area.","Giá được tính theo diện tích thông thủy."]],"sents":[["Would you like to see the show unit first, or go straight to the actual apartment?","Anh chị muốn xem căn hộ mẫu trước, hay đi thẳng lên căn thực tế?","您想先看样板房，还是直接去看实际的房子？","Nín xiǎng xiān kàn yàngbǎn fáng, háishi zhíjiē qù kàn shíjì de fángzi?","Đón khách"],["The down payment is 20%, and the rest is paid in instalments until handover.","Thanh toán đợt đầu 20%, phần còn lại trả góp đến khi bàn giao.","首付是百分之二十，其余分期支付，直到交房。","Shǒufù shì bǎi fēn zhī èrshí, qíyú fēnqī zhīfù, zhídào jiāofáng.","Báo chính sách"],["The maintenance fee covers security, cleaning and the shared amenities.","Phí quản lý bao gồm an ninh, vệ sinh và các tiện ích chung.","物业费包括安保、保洁和公共配套设施。","Wùyè fèi bāokuò ānbǎo, bǎojié hé gōnggòng pèitào shèshī.","Giải thích chi phí"],["May I ask what your budget range is?","Cho tôi hỏi tầm ngân sách của anh chị là bao nhiêu?","请问您的预算范围是多少？","Qǐngwèn nín de yùsuàn fànwéi shì duōshao?","Khai thác nhu cầu"],["This unit is handed over fully furnished, so you can move in or rent it out right away.","Căn này bàn giao đầy đủ nội thất, anh chị có thể dọn vào hoặc cho thuê ngay.","这套房子是精装修交付，您可以直接入住或者马上出租。","Zhè tào fángzi shì jīng zhuāngxiū jiāofù, nín kěyǐ zhíjiē rùzhù huòzhě mǎshàng chūzū.","Giới thiệu sản phẩm"],["The price is based on the net saleable area, not the gross area.","Giá tính theo diện tích thông thủy, không phải tim tường.","价格按套内面积计算，不是按建筑面积。","Jiàgé àn tàonèi miànjī jìsuàn, bú shì àn jiànzhù miànjī.","Giải thích giá"]]},{"id":"re4","tier":1,"dom":"re","title":"After-sales & property management","vi":"Bàn giao, hậu mãi và vận hành tòa nhà","words":[["snagging","n","kiểm tra lỗi trước khi nhận nhà","验房","yànfáng","a snagging inspection · snagging list","We arranged a snagging inspection one week before handover.","Chúng tôi sắp xếp kiểm tra lỗi một tuần trước bàn giao."],["defect","n","lỗi, khiếm khuyết","缺陷","quēxiàn","a minor defect · report a defect","Please report any defect within the warranty period.","Vui lòng báo lỗi trong thời gian bảo hành."],["warranty","n","bảo hành","保修","bǎoxiū","under warranty · a five-year warranty","The structure is under warranty for five years.","Kết cấu được bảo hành năm năm."],["property manager","n","đơn vị quản lý vận hành","物业管理公司","wùyè guǎnlǐ gōngsī","an international property manager · appoint a property manager","An international property manager will run the building.","Một đơn vị quản lý quốc tế sẽ vận hành tòa nhà."],["tenant","n","khách thuê","租客","zūkè","find a tenant · a long-term tenant","We found a tenant within two weeks.","Chúng tôi tìm được khách thuê trong hai tuần."],["landlord","n","chủ nhà cho thuê","房东","fángdōng","a private landlord · the landlord's responsibility","Repairs to the air conditioner are the landlord's responsibility.","Sửa máy lạnh là trách nhiệm của chủ nhà."],["residents' committee","n","ban quản trị tòa nhà","业主委员会","yèzhǔ wěiyuánhuì","elect a residents' committee · the residents' committee meeting","The residents' committee approved the new parking rules.","Ban quản trị đã thông qua quy định đỗ xe mới."],["sinking fund","n","quỹ bảo trì (2%)","维修基金","wéixiū jījīn","contribute to the sinking fund · a 2% sinking fund","Buyers pay 2% of the price into the sinking fund.","Người mua đóng 2% giá trị căn vào quỹ bảo trì."],["move in","v","dọn vào ở","入住","rùzhù","move in after handover · ready to move in","Most owners will move in after Lunar New Year.","Phần lớn chủ nhà sẽ dọn vào sau Tết."],["complaint","n","khiếu nại, phàn nàn","投诉","tóusù","handle a complaint · file a complaint","The front desk handles complaints within 24 hours.","Lễ tân xử lý khiếu nại trong 24 giờ."],["key handover","n","bàn giao chìa khóa","交钥匙","jiāo yàoshi","key handover ceremony · on key handover","The key handover ceremony is on Saturday morning.","Lễ bàn giao chìa khóa vào sáng thứ Bảy."],["fit-out","n","thi công hoàn thiện nội thất","装修","zhuāngxiū","fit-out works · a basic fit-out","Fit-out works must stop by 6 p.m.","Thi công nội thất phải dừng trước 6 giờ chiều."]],"sents":[["Let's walk through the apartment together and note any defects on the snagging list.","Mình cùng đi một vòng căn hộ và ghi các lỗi vào danh sách nhé.","我们一起看一遍房子，把问题记在验房清单上。","Wǒmen yìqǐ kàn yí biàn fángzi, bǎ wèntí jì zài yànfáng qīngdān shàng.","Bàn giao nhà"],["Any defects will be fixed within 14 days at no cost to you.","Mọi lỗi sẽ được sửa trong 14 ngày, anh chị không mất chi phí.","所有问题将在十四天内免费维修。","Suǒyǒu wèntí jiāng zài shísì tiān nèi miǎnfèi wéixiū.","Cam kết hậu mãi"],["Our leasing team can find a tenant and collect the rent for you every month.","Đội cho thuê của chúng tôi có thể tìm khách và thu tiền thuê hằng tháng giúp anh chị.","我们的租赁团队可以帮您找租客，每月代收租金。","Wǒmen de zūlìn tuánduì kěyǐ bāng nín zhǎo zūkè, měi yuè dàishōu zūjīn.","Dịch vụ cho thuê hộ"],["The sinking fund is transferred to the residents' committee once it is elected.","Quỹ bảo trì được chuyển cho ban quản trị khi ban được bầu.","维修基金在业主委员会成立后移交给他们。","Wéixiū jījīn zài yèzhǔ wěiyuánhuì chénglì hòu yíjiāo gěi tāmen.","Giải thích quỹ bảo trì"],["I'm sorry for the inconvenience; I'll follow up with the technical team today.","Xin lỗi vì sự bất tiện; hôm nay tôi sẽ làm việc lại với đội kỹ thuật.","给您带来不便很抱歉，我今天就跟技术团队跟进。","Gěi nín dàilái búbiàn hěn bàoqiàn, wǒ jīntiān jiù gēn jìshù tuánduì gēnjìn.","Xử lý khiếu nại"],["Please register fit-out works with management at least three days in advance.","Vui lòng đăng ký thi công nội thất với ban quản lý trước ít nhất ba ngày.","装修请至少提前三天向物业登记。","Zhuāngxiū qǐng zhìshǎo tíqián sān tiān xiàng wùyè dēngjì.","Quy định tòa nhà"]]},{"id":"mk1","tier":1,"dom":"mk","title":"Campaign basics","vi":"Chiến dịch cơ bản","words":[["target audience","n","đối tượng mục tiêu","目标受众","mùbiāo shòuzhòng","reach the target audience · define a target audience","Our target audience is investors aged thirty to forty-five.","Đối tượng mục tiêu là nhà đầu tư từ ba mươi đến bốn mươi lăm tuổi."],["lead","n","khách hàng tiềm năng","潜在客户","qiánzài kèhù","generate leads · a qualified lead","Sales follows up on every lead within an hour.","Sale gọi lại mỗi khách tiềm năng trong vòng một giờ."],["campaign","n","chiến dịch","营销活动","yíngxiāo huódòng","launch a campaign · an ad campaign","The campaign goes live next Monday.","Chiến dịch chạy từ thứ Hai tuần sau."],["budget","n","ngân sách","预算","yùsuàn","allocate a budget · stay within budget","We need to stay within the monthly budget.","Chúng ta phải giữ trong ngân sách tháng."],["brand awareness","n","độ nhận biết thương hiệu","品牌知名度","pǐnpái zhīmíngdù","build brand awareness · raise brand awareness","Video ads helped build brand awareness.","Quảng cáo video giúp tăng độ nhận biết thương hiệu."],["landing page","n","trang đích","落地页","luòdì yè","optimise the landing page · a landing page form","The landing page loads too slowly on mobile.","Trang đích tải quá chậm trên điện thoại."],["call to action","n","lời kêu gọi hành động","行动号召","xíngdòng hàozhào","a clear call to action · a call-to-action button","Every post should end with a call to action.","Mỗi bài đăng nên kết bằng lời kêu gọi hành động."],["engagement","n","mức độ tương tác","互动","hùdòng","drive engagement · engagement rate","Short videos drive the most engagement.","Video ngắn tạo nhiều tương tác nhất."],["brief","n","bản yêu cầu (brief)","需求简报","xūqiú jiǎnbào","write a creative brief · send the brief","The agency needs a clear brief by Wednesday.","Agency cần brief rõ ràng trước thứ Tư."],["content calendar","n","lịch nội dung","内容日历","nèiróng rìlì","plan a content calendar · the monthly content calendar","The content calendar is planned a month ahead.","Lịch nội dung được lên trước một tháng."],["deadline","n","hạn chót","截止日期","jiézhǐ rìqī","meet the deadline · a tight deadline","We're working to a tight deadline.","Chúng ta đang làm với hạn chót gấp."],["stakeholder","n","các bên liên quan","利益相关者","lìyì xiāngguān zhě","key stakeholders · align stakeholders","All stakeholders signed off on the plan.","Tất cả các bên liên quan đã duyệt kế hoạch."]],"sents":[["Who exactly is our target audience for this launch?","Chính xác thì đối tượng mục tiêu của đợt mở bán này là ai?","这次发布的目标受众到底是谁？","Zhè cì fābù de mùbiāo shòuzhòng dàodǐ shì shéi?","Họp lên kế hoạch"],["We generated 300 leads last week, mostly from Facebook.","Tuần trước chúng ta có 300 khách tiềm năng, phần lớn từ Facebook.","上周我们获得了三百个潜在客户，大部分来自Facebook。","Shàng zhōu wǒmen huòdé le sānbǎi gè qiánzài kèhù, dà bùfen láizì Facebook.","Báo cáo tuần"],["Could you send me the campaign report by Friday?","Bạn gửi tôi báo cáo chiến dịch trước thứ Sáu được không?","你能在周五之前把活动报告发给我吗？","Nǐ néng zài zhōuwǔ zhīqián bǎ huódòng bàogào fā gěi wǒ ma?","Giao việc"],["The call to action needs to be clearer.","Lời kêu gọi hành động cần rõ ràng hơn.","行动号召需要更明确一些。","Xíngdòng hàozhào xūyào gèng míngquè yìxiē.","Góp ý nội dung"],["Let's align with all stakeholders before we finalise the brief.","Hãy thống nhất với các bên liên quan trước khi chốt brief.","在定稿简报之前，我们先和所有相关方对齐。","Zài dìnggǎo jiǎnbào zhīqián, wǒmen xiān hé suǒyǒu xiāngguān fāng duìqí.","Phối hợp nội bộ"],["Can we push the deadline to Thursday without affecting the launch?","Lùi hạn chót sang thứ Năm có ảnh hưởng đến đợt mở bán không?","能不能把截止日期推到周四，又不影响发布？","Néng bu néng bǎ jiézhǐ rìqī tuī dào zhōusì, yòu bù yǐngxiǎng fābù?","Xin lùi deadline"]]},{"id":"mk4","tier":1,"dom":"mk","title":"Content & social media","vi":"Nội dung và mạng xã hội","words":[["caption","n","chú thích bài đăng (caption)","文案","wén'àn","write a caption · a catchy caption","Keep the caption under three lines.","Giữ caption dưới ba dòng."],["hook","n","câu mở đầu gây chú ý (hook)","开头钩子","kāitóu gōuzi","a strong hook · a three-second hook","The hook has to land in the first three seconds.","Hook phải gây chú ý trong ba giây đầu."],["thumbnail","n","ảnh bìa video","封面图","fēngmiàn tú","design a thumbnail · a clickable thumbnail","A clear thumbnail doubled our views.","Ảnh bìa rõ ràng giúp lượt xem tăng gấp đôi."],["post","v","đăng bài","发布","fābù","post daily · post a reel","We post three times a week on Facebook.","Chúng tôi đăng ba bài mỗi tuần trên Facebook."],["influencer","n","người có ảnh hưởng (KOL)","网红","wǎnghóng","partner with an influencer · a finance influencer","We partnered with a finance influencer for the launch.","Chúng tôi hợp tác với một KOL tài chính cho đợt mở bán."],["followers","n","người theo dõi","粉丝","fěnsī","gain followers · 10,000 followers","The page gained 2,000 followers this month.","Trang tăng 2.000 người theo dõi trong tháng này."],["comment","n","bình luận","评论","pínglùn","reply to comments · a negative comment","Reply to every comment within an hour.","Trả lời mọi bình luận trong vòng một giờ."],["livestream","n","phát trực tiếp","直播","zhíbō","host a livestream · a livestream tour","We host a livestream tour of the show unit every Sunday.","Chúng tôi livestream tham quan căn mẫu mỗi Chủ nhật."],["visual identity","n","bộ nhận diện hình ảnh","视觉识别","shìjué shíbié","a consistent visual identity · update the visual identity","All posts follow the same visual identity.","Mọi bài đăng theo cùng một bộ nhận diện."],["copywriting","n","viết nội dung quảng cáo","文案写作","wén'àn xiězuò","sales copywriting · copywriting skills","Good copywriting sells benefits, not features.","Viết quảng cáo tốt bán lợi ích, không bán tính năng."],["user-generated content","n","nội dung do người dùng tạo (UGC)","用户生成内容","yònghù shēngchéng nèiróng","encourage user-generated content · a UGC campaign","Residents' photos are the best user-generated content.","Ảnh của cư dân là nội dung người dùng tạo tốt nhất."],["go viral","v","lan truyền mạnh","走红","zǒuhóng","a video that went viral · go viral overnight","The drone video went viral overnight.","Video flycam lan truyền mạnh chỉ sau một đêm."]],"sents":[["The first three seconds need a stronger hook: open with the price, not the logo.","Ba giây đầu cần hook mạnh hơn: mở bằng giá, không phải logo.","前三秒需要更强的钩子：先说价格，不要先放标志。","Qián sān miǎo xūyào gèng qiáng de gōuzi: xiān shuō jiàgé, búyào xiān fàng biāozhì.","Góp ý video"],["Can you draft three caption options for tomorrow's post?","Bạn soạn giúp ba phương án caption cho bài ngày mai nhé?","你能为明天的帖子写三个文案版本吗？","Nǐ néng wèi míngtiān de tiězi xiě sān gè wén'àn bǎnběn ma?","Giao việc"],["Let's reply to negative comments privately and keep the tone calm.","Hãy trả lời bình luận tiêu cực qua tin nhắn riêng và giữ giọng bình tĩnh.","负面评论我们私下回复，语气保持冷静。","Fùmiàn pínglùn wǒmen sīxià huífù, yǔqì bǎochí lěngjìng.","Quản lý cộng đồng"],["We'll go live from the show unit at 8 p.m. on Sunday.","Chúng ta sẽ livestream từ căn mẫu lúc 8 giờ tối Chủ nhật.","我们周日晚上八点在样板房直播。","Wǒmen zhōurì wǎnshang bā diǎn zài yàngbǎn fáng zhíbō.","Lên lịch"],["Post consistently; one viral video won't build a brand.","Đăng đều đặn; một video viral không xây được thương hiệu.","要持续发布，一条爆款视频撑不起一个品牌。","Yào chíxù fābù, yì tiáo bàokuǎn shìpín chēng bù qǐ yí gè pǐnpái.","Chia sẻ kinh nghiệm"],["Ask residents whether we can share their photos, with credit.","Hỏi cư dân xem mình có thể chia sẻ ảnh của họ, ghi tên tác giả, không.","问一下业主能不能分享他们的照片，并注明出处。","Wèn yíxià yèzhǔ néng bu néng fēnxiǎng tāmen de zhàopiàn, bìng zhùmíng chūchù.","Xin phép nội dung"]]},{"id":"fi1","tier":1,"dom":"fi","title":"Money basics at work","vi":"Tài chính cơ bản trong công việc","words":[["interest rate","n","lãi suất","利率","lìlǜ","a fixed interest rate · raise interest rates","The interest rate is fixed for the first year.","Lãi suất cố định trong năm đầu."],["loan","n","khoản vay","贷款","dàikuǎn","apply for a loan · repay a loan","She applied for a loan to expand the business.","Cô ấy xin vay để mở rộng kinh doanh."],["cash flow","n","dòng tiền","现金流","xiànjīn liú","positive cash flow · manage cash flow","Rental income gives the owner a steady cash flow.","Thu nhập cho thuê mang lại dòng tiền đều cho chủ nhà."],["revenue","n","doanh thu","收入","shōurù","annual revenue · generate revenue","Revenue rose twelve percent year on year.","Doanh thu tăng mười hai phần trăm so với cùng kỳ."],["profit margin","n","biên lợi nhuận","利润率","lìrùn lǜ","a thin profit margin · improve profit margins","Rising costs are squeezing our profit margin.","Chi phí tăng đang bóp nghẹt biên lợi nhuận."],["instalment","n","đợt trả góp","分期付款","fēnqī fùkuǎn","pay in instalments · a monthly instalment","The second instalment is due next month.","Đợt thanh toán thứ hai đến hạn vào tháng sau."],["deposit","n","tiền đặt cọc","定金","dìngjīn","pay a deposit · a refundable deposit","A small deposit secures the unit for a week.","Một khoản cọc nhỏ giữ căn trong một tuần."],["invoice","n","hóa đơn","发票","fāpiào","issue an invoice · an unpaid invoice","Please issue the invoice in the company's name.","Vui lòng xuất hóa đơn theo tên công ty."],["VAT","n","thuế giá trị gia tăng","增值税","zēngzhí shuì","10% VAT · exclusive of VAT","Prices are shown exclusive of VAT.","Giá hiển thị chưa gồm VAT."],["receipt","n","biên nhận","收据","shōujù","issue a receipt · keep the receipt","Always ask for a receipt when you pay.","Luôn yêu cầu biên nhận khi thanh toán."],["expense","n","khoản chi","费用","fèiyòng","operating expenses · cut expenses","Marketing is our largest expense this quarter.","Marketing là khoản chi lớn nhất quý này."],["balance","n","phần tiền còn lại","尾款","wěikuǎn","the remaining balance · pay the balance","The remaining balance is due on handover.","Phần còn lại thanh toán khi bàn giao."]],"sents":[["The bank is offering a fixed interest rate for the first two years.","Ngân hàng đang áp dụng lãi suất cố định trong hai năm đầu.","银行前两年提供固定利率。","Yínháng qián liǎng nián tígōng gùdìng lìlǜ.","Tư vấn vay"],["You can pay in twelve monthly instalments.","Anh chị có thể trả góp thành mười hai đợt hằng tháng.","您可以分十二个月付款。","Nín kěyǐ fēn shí'èr gè yuè fùkuǎn.","Phương án thanh toán"],["The deposit is refundable within seven days.","Tiền cọc được hoàn lại trong vòng bảy ngày.","定金七天内可以退还。","Dìngjīn qī tiān nèi kěyǐ tuìhuán.","Giữ chỗ"],["Cash flow is tight this quarter.","Dòng tiền quý này khá căng.","这个季度现金流比较紧张。","Zhège jìdù xiànjīn liú bǐjiào jǐnzhāng.","Họp nội bộ"],["The price includes 10% VAT but excludes the maintenance fee.","Giá đã gồm 10% VAT nhưng chưa gồm phí bảo trì.","价格包含百分之十的增值税，但不含维修基金。","Jiàgé bāohán bǎi fēn zhī shí de zēngzhí shuì, dàn bù hán wéixiū jījīn.","Giải thích giá"],["Please keep the receipt for every payment until handover.","Vui lòng giữ biên nhận mọi khoản thanh toán đến khi bàn giao.","请保留每一笔付款的收据，直到交房。","Qǐng bǎoliú měi yì bǐ fùkuǎn de shōujù, zhídào jiāofáng.","Dặn khách"]]},{"id":"fi4","tier":1,"dom":"fi","title":"Banking & payments","vi":"Ngân hàng và thanh toán","words":[["bank transfer","n","chuyển khoản","银行转账","yínháng zhuǎnzhàng","make a bank transfer · pay by bank transfer","Please pay the deposit by bank transfer.","Vui lòng chuyển khoản tiền cọc."],["account number","n","số tài khoản","账号","zhànghào","the developer's account number · check the account number","Only transfer to the account number in the contract.","Chỉ chuyển vào số tài khoản ghi trong hợp đồng."],["approve","v","phê duyệt","批准","pīzhǔn","approve a loan · get approved","The bank approved the loan in five days.","Ngân hàng duyệt khoản vay trong năm ngày."],["credit score","n","điểm tín dụng","信用评分","xìnyòng píngfēn","a good credit score · check your credit score","A good credit score helps you get a lower rate.","Điểm tín dụng tốt giúp có lãi suất thấp hơn."],["monthly repayment","n","số tiền trả hằng tháng","月供","yuègōng","calculate the monthly repayment · a monthly repayment of 15 million","Your monthly repayment would be about 18 million dong.","Số tiền trả mỗi tháng khoảng 18 triệu đồng."],["principal","n","nợ gốc","本金","běnjīn","repay the principal · principal and interest","The first two years cover interest only, not principal.","Hai năm đầu chỉ trả lãi, chưa trả gốc."],["early repayment","n","trả nợ trước hạn","提前还款","tíqián huánkuǎn","an early repayment fee · allow early repayment","Early repayment carries a 2% fee in year one.","Trả nợ trước hạn năm đầu chịu phí 2%."],["savings","n","tiền tiết kiệm","存款","cúnkuǎn","personal savings · a savings account","They used their savings for the down payment.","Họ dùng tiền tiết kiệm để trả đợt đầu."],["term deposit","n","tiền gửi có kỳ hạn","定期存款","dìngqī cúnkuǎn","a 12-month term deposit · term deposit rates","Term deposit rates are now around 6% a year.","Lãi tiền gửi kỳ hạn hiện khoảng 6%/năm."],["bank guarantee","n","bảo lãnh ngân hàng","银行担保","yínháng dānbǎo","provide a bank guarantee · covered by a bank guarantee","Each payment is protected by a bank guarantee.","Mỗi khoản thanh toán được ngân hàng bảo lãnh."],["processing fee","n","phí hồ sơ","手续费","shǒuxù fèi","waive the processing fee · a 1% processing fee","There is no processing fee for this loan.","Khoản vay này không có phí hồ sơ."],["statement","n","sao kê","对账单","duìzhàng dān","a bank statement · monthly statements","The bank needs six months of statements.","Ngân hàng cần sao kê sáu tháng."]],"sents":[["For your safety, only transfer money to the account number printed in the contract.","Để an toàn, anh chị chỉ chuyển tiền vào số tài khoản in trong hợp đồng.","为了安全，请只转账到合同上印的账号。","Wèile ānquán, qǐng zhǐ zhuǎnzhàng dào hétong shàng yìn de zhànghào.","Cảnh báo thanh toán"],["With a 70% loan over 20 years, your monthly repayment is about 22 million dong.","Vay 70% trong 20 năm, số tiền trả mỗi tháng khoảng 22 triệu đồng.","贷款七成、二十年期，您的月供大约两千二百万越南盾。","Dàikuǎn qī chéng, èrshí nián qī, nín de yuègōng dàyuē liǎngqiān èrbǎi wàn Yuènán dùn.","Tính khoản vay"],["The bank will need your ID, marriage certificate and six months of statements.","Ngân hàng cần CCCD, giấy đăng ký kết hôn và sao kê sáu tháng.","银行需要您的身份证、结婚证和六个月的对账单。","Yínháng xūyào nín de shēnfèn zhèng, jiéhūn zhèng hé liù gè yuè de duìzhàng dān.","Hồ sơ vay"],["You can repay early without a fee after the third year.","Sau năm thứ ba anh chị có thể trả trước hạn mà không mất phí.","第三年后可以免费提前还款。","Dì-sān nián hòu kěyǐ miǎnfèi tíqián huánkuǎn.","Điều khoản vay"],["Your payments are protected by a bank guarantee until handover.","Các khoản thanh toán của anh chị được ngân hàng bảo lãnh đến khi bàn giao.","在交房之前，您的付款都有银行担保。","Zài jiāofáng zhīqián, nín de fùkuǎn dōu yǒu yínháng dānbǎo.","Trấn an khách"],["Compared with a term deposit at 6%, this unit earns about 5% in rent plus capital growth.","So với gửi tiết kiệm 6%, căn này cho thuê được khoảng 5% cộng thêm tăng giá tài sản.","与百分之六的定期存款相比，这套房租金回报约百分之五，还有资产增值。","Yǔ bǎi fēn zhī liù de dìngqī cúnkuǎn xiāngbǐ, zhè tào fáng zūjīn huíbào yuē bǎi fēn zhī wǔ, hái yǒu zīchǎn zēngzhí.","So sánh kênh đầu tư"]]},{"id":"ec1","tier":1,"dom":"ec","title":"How the economy works","vi":"Nền kinh tế vận hành thế nào","words":[["supply","n","nguồn cung","供给","gōngjǐ","limited supply · supply and demand","New supply will hit the market next year.","Nguồn cung mới sẽ ra thị trường vào năm sau."],["demand","n","nhu cầu","需求","xūqiú","strong demand · meet demand","Demand for affordable housing remains strong.","Nhu cầu nhà ở vừa túi tiền vẫn cao."],["inflation","n","lạm phát","通货膨胀","tōnghuò péngzhàng","rising inflation · curb inflation","Inflation pushes up construction costs.","Lạm phát đẩy chi phí xây dựng lên."],["gross domestic product","n","tổng sản phẩm quốc nội (GDP)","国内生产总值","guónèi shēngchǎn zǒngzhí","GDP growth · GDP per capita","Gross domestic product grew by six percent.","GDP tăng sáu phần trăm."],["unemployment","n","thất nghiệp","失业","shīyè","unemployment rate · rising unemployment","Unemployment fell to a ten-year low.","Thất nghiệp giảm xuống mức thấp nhất mười năm."],["exchange rate","n","tỷ giá hối đoái","汇率","huìlǜ","a stable exchange rate · exchange rate risk","A weaker exchange rate makes imports more expensive.","Tỷ giá yếu đi khiến hàng nhập khẩu đắt hơn."],["consumer","n","người tiêu dùng","消费者","xiāofèi zhě","consumer spending · consumer confidence","Consumer confidence is slowly recovering.","Niềm tin người tiêu dùng đang dần hồi phục."],["economic growth","n","tăng trưởng kinh tế","经济增长","jīngjì zēngzhǎng","sustain economic growth · slow economic growth","Exports are driving economic growth.","Xuất khẩu đang thúc đẩy tăng trưởng kinh tế."],["tourism","n","du lịch","旅游业","lǚyóu yè","tourism recovery · boost tourism","Tourism supports retail spending in coastal cities.","Du lịch hỗ trợ chi tiêu bán lẻ ở các thành phố biển."],["infrastructure","n","hạ tầng","基础设施","jīchǔ shèshī","infrastructure investment · transport infrastructure","New infrastructure usually lifts land prices nearby.","Hạ tầng mới thường kéo giá đất xung quanh lên."],["middle class","n","tầng lớp trung lưu","中产阶级","zhōngchǎn jiējí","a growing middle class · middle-class buyers","The middle class is driving demand for better homes.","Tầng lớp trung lưu đang thúc đẩy nhu cầu nhà tốt hơn."],["interest","n","tiền lãi","利息","lìxī","pay interest · interest income","Interest on savings is taxed at 5%.","Tiền lãi tiết kiệm chịu thuế 5%."]],"sents":[["When supply is limited and demand keeps rising, prices go up.","Khi nguồn cung hạn chế mà nhu cầu cứ tăng, giá sẽ lên.","供给有限而需求不断上升 .","Chi phí mỗi lead của chúng ta thấp hơn nhiều so với trung bình ngành."],["funnel","n","phễu marketing","营销漏斗","yíngxiāo lòudǒu","top of the funnel · move down the funnel","We lose most prospects in the middle of the funnel.","Chúng ta mất phần lớn khách ở giữa phễu."],["retargeting","n","tiếp thị lại","再营销","zài yíngxiāo","a retargeting campaign · retargeting ads","Retargeting brings back visitors who did not sign up.","Tiếp thị lại kéo về những người đã xem nhưng chưa đăng ký."],["A/B testing","n","thử nghiệm A/B","A/B测试","A/B cèshì","run A/B testing · A/B test a headline","A/B testing showed the shorter headline works better.","Thử nghiệm A/B cho thấy tiêu đề ngắn hiệu quả hơn."],["reach","n","số người tiếp cận","触达人数","chùdá rénshù","organic reach · expand reach","Organic reach has fallen sharply this year.","Lượng tiếp cận tự nhiên giảm mạnh trong năm nay."],["return on ad spend","n","lợi nhuận trên chi tiêu quảng cáo (ROAS)","广告支出回报率","guǎnggào zhīchū huíbào lǜ","measure return on ad spend · a ROAS of 4","Search ads deliver our highest return on ad spend.","Quảng cáo tìm kiếm mang lại ROAS cao nhất."],["creative","n","mẫu quảng cáo (hình, video)","广告素材","guǎnggào sùcái","refresh the creatives · ad creative","We rotate the creatives every two weeks.","Chúng tôi đổi mẫu quảng cáo hai tuần một lần."],["click-through rate","n","tỷ lệ nhấp (CTR)","点击率","diǎnjī lǜ","a low click-through rate · improve the click-through rate","The video ad has a click-through rate of 1.8%.","Quảng cáo video có tỷ lệ nhấp 1,8%."],["impression","n","lượt hiển thị","曝光","bàoguāng","cost per thousand impressions · 2 million impressions","The campaign delivered two million impressions.","Chiến dịch đạt hai triệu lượt hiển thị."],["lookalike audience","n","tệp đối tượng tương tự","相似受众","xiāngsì shòuzhòng","build a lookalike audience · a 1% lookalike audience","A lookalike audience of past buyers performed best.","Tệp tương tự từ người mua cũ hiệu quả nhất."],["frequency","n","tần suất hiển thị","频次","píncì","ad frequency · cap the frequency","Frequency above four usually means ad fatigue.","Tần suất trên bốn thường là dấu hiệu khán giả chán quảng cáo."]],"sents":[["Our cost per lead dropped by 18% after we refreshed the creatives.","Chi phí mỗi lead giảm 18% sau khi chúng ta làm mới mẫu quảng cáo.","更新广告素材后，我们的单个线索成本下降了百分之十八。","Gēngxīn guǎnggào sùcái hòu, wǒmen de dān gè xiànsuǒ chéngběn xiàjiàng le bǎi fēn zhī shíbā.","Báo cáo hiệu quả"],["Most prospects drop off at the middle of the funnel.","Phần lớn khách tiềm năng rơi rụng ở giữa phễu.","大部分潜在客户在漏斗中段流失。","Dà bùfen qiánzài kèhù zài lòudǒu zhōngduàn liúshī.","Phân tích phễu"],["Let's run an A/B test before scaling the budget.","Hãy chạy thử A/B trước khi tăng ngân sách.","在扩大预算之前，我们先做一次A/B测试吧。","Zài kuòdà yùsuàn zhīqián, wǒmen xiān zuò yí cì A/B cèshì ba.","Đề xuất"],["The numbers look promising, but the sample is still too small.","Số liệu có vẻ khả quan, nhưng mẫu vẫn còn quá nhỏ.","数据看起来不错，但样本还是太小。","Shùjù kàn qǐlái búcuò, dàn yàngběn háishi tài xiǎo.","Thận trọng với dữ liệu"],["The click-through rate is fine, but frequency is too high, so people are tired of the ad.","Tỷ lệ nhấp ổn, nhưng tần suất quá cao nên người xem đã chán quảng cáo.","点击率还行，但频次太高，用户已经看腻了。","Diǎnjī lǜ hái xíng, dàn píncì tài gāo, yònghù yǐjīng kàn nì le.","Tối ưu quảng cáo"],["Let's build a lookalike audience from buyers who already paid a deposit.","Hãy tạo tệp tương tự từ những khách đã đặt cọc.","我们用已付定金的买家建一个相似受众。","Wǒmen yòng yǐ fù dìngjīn de mǎijiā jiàn yí gè xiāngsì shòuzhòng.","Đề xuất target"]]},{"id":"mk5","tier":2,"dom":"mk","title":"Sales enablement, CRM & events","vi":"Hỗ trợ bán hàng, CRM và sự kiện","words":[["CRM","n","hệ thống quản lý khách hàng","客户关系管理系统","kèhù guānxì guǎnlǐ xìtǒng","update the CRM · CRM data","Every call must be logged in the CRM.","Mọi cuộc gọi phải được ghi vào CRM."],["pipeline","n","danh sách khách đang theo","销售管道","xiāoshòu guǎndào","a healthy pipeline · pipeline review","We review the pipeline every Monday.","Chúng ta rà pipeline mỗi thứ Hai."],["follow up","v","chăm sóc lại, theo sát","跟进","gēnjìn","follow up with a lead · follow up within 24 hours","Follow up with every visitor within 24 hours.","Gọi lại mọi khách tham quan trong 24 giờ."],["lead scoring","n","chấm điểm khách tiềm năng","线索评分","xiànsuǒ píngfēn","a lead scoring model · lead scoring criteria","Lead scoring helps sales focus on hot prospects.","Chấm điểm lead giúp sale tập trung vào khách nóng."],["sales kit","n","bộ tài liệu bán hàng","销售资料包","xiāoshòu zīliào bāo","prepare the sales kit · update the sales kit","The sales kit includes the price list and floor plans.","Bộ tài liệu bán hàng gồm bảng giá và mặt bằng."],["launch event","n","sự kiện mở bán","开盘活动","kāipán huódòng","host a launch event · attend the launch event","The launch event attracted 600 guests.","Sự kiện mở bán thu hút 600 khách."],["site visit","n","đi xem dự án","看房","kànfáng","arrange a site visit · site visit bookings","Weekend site visits are fully booked.","Lịch xem dự án cuối tuần đã kín."],["objection handling","n","xử lý từ chối","异议处理","yìyì chǔlǐ","an objection handling script · train objection handling","We trained the team on objection handling about legal status.","Chúng tôi đào tạo đội xử lý từ chối về pháp lý."],["referral","n","khách giới thiệu","转介绍","zhuǎn jièshào","a referral programme · ask for referrals","Referrals close twice as fast as ad leads.","Khách giới thiệu chốt nhanh gấp đôi khách từ quảng cáo."],["closing rate","n","tỷ lệ chốt","成交率","chéngjiāo lǜ","improve the closing rate · closing rate per agent","Our closing rate on site visits is around 15%.","Tỷ lệ chốt từ khách xem dự án khoảng 15%."],["agency","n","đại lý phân phối","代理公司","dàilǐ gōngsī","a distribution agency · agency agreement","Five agencies will distribute the project.","Năm đại lý sẽ phân phối dự án."],["commission","n","hoa hồng","佣金","yòngjīn","earn a commission · commission rate","The commission rate is 3% of the contract value.","Hoa hồng là 3% giá trị hợp đồng."]],"sents":[["Please log every call and site visit in the CRM before you leave today.","Vui lòng ghi mọi cuộc gọi và lượt xem dự án vào CRM trước khi về hôm nay.","今天下班前请把所有电话和看房记录录入CRM。","Jīntiān xiàbān qián qǐng bǎ suǒyǒu diànhuà hé kànfáng jìlù lùrù CRM.","Nhắc đội sale"],["Hot leads should get a call back within five minutes, not five hours.","Lead nóng phải được gọi lại trong năm phút, không phải năm giờ.","热线索应该在五分钟内回电，而不是五个小时。","Rè xiànsuǒ yīnggāi zài wǔ fēnzhōng nèi huídiàn, ér bú shì wǔ gè xiǎoshí.","Quy trình"],["What objections are we hearing most often this week?","Tuần này mình nghe lời từ chối nào nhiều nhất?","这周我们听到最多的异议是什么？","Zhè zhōu wǒmen tīngdào zuì duō de yìyì shì shénme?","Họp sale"],["We need a sales kit that answers the legal questions upfront.","Chúng ta cần bộ tài liệu trả lời câu hỏi pháp lý ngay từ đầu.","我们需要一份一开始就回答法律问题的销售资料包。","Wǒmen xūyào yí fèn yì kāishǐ jiù huídá fǎlǜ wèntí de xiāoshòu zīliào bāo.","Chuẩn bị tài liệu"],["Residents who refer a buyer receive one year of free management fees.","Cư dân giới thiệu được người mua sẽ được miễn một năm phí quản lý.","老业主成功推荐买家可获一年物业费减免。","Lǎo yèzhǔ chénggōng tuījiàn mǎijiā kě huò yì nián wùyè fèi jiǎnmiǎn.","Chương trình giới thiệu"],["The pipeline looks big, but most leads haven't been contacted for two weeks.","Pipeline trông lớn, nhưng phần lớn lead đã hai tuần chưa được liên hệ.","管道看起来很大，但大部分线索已经两周没联系了。","Guǎndào kàn qǐlái hěn dà, dàn dà bùfen xiànsuǒ yǐjīng liǎng zhōu méi liánxì le.","Đánh giá pipeline"]]},{"id":"fi2","tier":2,"dom":"fi","title":"Investment reasoning","vi":"Lập luận đầu tư","words":[["return on investment","n","tỷ suất hoàn vốn (ROI)","投资回报率","tóuzī huíbào lǜ","a solid return on investment · calculate the return on investment","The return on investment exceeded our forecast.","Tỷ suất hoàn vốn vượt dự báo của chúng tôi."],["leverage","n","đòn bẩy tài chính","杠杆","gànggǎn","use leverage · high leverage","Leverage magnifies both gains and losses.","Đòn bẩy khuếch đại cả lãi lẫn lỗ."],["liquidity","n","tính thanh khoản","流动性","liúdòng xìng","market liquidity · a liquidity crunch","Liquidity dried up when rates jumped.","Thanh khoản cạn khi lãi suất tăng vọt."],["break-even point","n","điểm hòa vốn","盈亏平衡点","yíngkuī pínghéng diǎn","reach the break-even point · break-even analysis","The hotel reached its break-even point in year three.","Khách sạn đạt điểm hòa vốn vào năm thứ ba."],["collateral","n","tài sản thế chấp","抵押物","dǐyā wù","put up collateral · accept as collateral","The bank accepts the apartment as collateral.","Ngân hàng nhận căn hộ làm tài sản thế chấp."],["valuation","n","định giá","估值","gūzhí","an independent valuation · a valuation report","An independent valuation came in below the asking price.","Kết quả định giá độc lập thấp hơn giá chào bán."],["portfolio","n","danh mục đầu tư","投资组合","tóuzī zǔhé","diversify a portfolio · a property portfolio","He holds property as part of a diversified portfolio.","Anh ấy giữ bất động sản trong một danh mục đa dạng."],["yield","n","lợi suất","收益率","shōuyì lǜ","a net yield · bond yields","Bond yields rose after the announcement.","Lợi suất trái phiếu tăng sau thông báo."],["equity","n","vốn tự có, vốn chủ sở hữu","自有资金","zìyǒu zījīn","put in equity · return on equity","You need about 30% equity to start.","Anh chị cần khoảng 30% vốn tự có để bắt đầu."],["loan-to-value ratio","n","tỷ lệ cho vay trên giá trị tài sản (LTV)","贷款价值比","dàikuǎn jiàzhí bǐ","a 70% loan-to-value ratio · maximum LTV","Banks cap the loan-to-value ratio at 70%.","Ngân hàng giới hạn tỷ lệ cho vay ở 70%."],["holding cost","n","chi phí nắm giữ","持有成本","chíyǒu chéngběn","reduce holding costs · annual holding cost","Interest is the biggest holding cost.","Lãi vay là chi phí nắm giữ lớn nhất."],["diversification","n","đa dạng hóa","多元化","duōyuánhuà","portfolio diversification · for diversification","Property adds diversification to a stock portfolio.","Bất động sản giúp đa dạng hóa danh mục cổ phiếu."]],"sents":[["With a 70% loan, your return on equity improves significantly.","Vay 70% thì tỷ suất sinh lời trên vốn tự có của anh chị cải thiện rõ rệt.","贷款七成的话，您的自有资金回报率会明显提高。","Dàikuǎn qī chéng dehuà, nín de zìyǒu zījīn huíbào lǜ huì míngxiǎn tígāo.","Tư vấn đòn bẩy"],["The project breaks even in year four.","Dự án hòa vốn vào năm thứ tư.","这个项目在第四年达到盈亏平衡。","Zhège xiàngmù zài dì-sì nián dádào yíngkuī pínghéng.","Trình bày phương án"],["Property is less liquid than stocks, so plan your holding period.","Bất động sản kém thanh khoản hơn cổ phiếu, nên hãy tính trước thời gian nắm giữ.","房产的流动性不如股票，所以要规划好持有期。","Fángchǎn de liúdòng xìng bùrú gǔpiào, suǒyǐ yào guīhuà hǎo chíyǒu qī.","Tư vấn rủi ro"],["Can the apartment itself be used as collateral?","Chính căn hộ này có dùng làm tài sản thế chấp được không?","这套房子本身可以作为抵押物吗？","Zhè tào fángzi běnshēn kěyǐ zuòwéi dǐyā wù ma?","Khách hỏi"],["Most banks cap the loan-to-value ratio at 70% for completed apartments.","Phần lớn ngân hàng chỉ cho vay tối đa 70% giá trị với căn hộ đã hoàn thiện.","大多数银行对现房的贷款价值比上限为百分之七十。","Dà duōshù yínháng duì xiànfáng de dàikuǎn jiàzhí bǐ shàngxiàn wéi bǎi fēn zhī qīshí.","Tư vấn vay"],["Don't forget holding costs: interest, management fees and vacancy between tenants.","Đừng quên chi phí nắm giữ: lãi vay, phí quản lý và thời gian trống giữa hai khách thuê.","别忘了持有成本：利息、物业费，还有换租客期间的空置。","Bié wàng le chíyǒu chéngběn: lìxī, wùyè fèi, hái yǒu huàn zūkè qījiān de kōngzhì.","Cảnh báo rủi ro"]]},{"id":"fi5","tier":2,"dom":"fi","title":"Financial statements & reporting","vi":"Đọc báo cáo tài chính","words":[["balance sheet","n","bảng cân đối kế toán","资产负债表","zīchǎn fùzhài biǎo","a strong balance sheet · on the balance sheet","The developer has a strong balance sheet with little debt.","Chủ đầu tư có bảng cân đối mạnh, ít nợ."],["income statement","n","báo cáo kết quả kinh doanh","利润表","lìrùn biǎo","the income statement shows · a quarterly income statement","The income statement shows a sharp drop in revenue.","Báo cáo kết quả kinh doanh cho thấy doanh thu giảm mạnh."],["EBITDA","n","lợi nhuận trước lãi vay, thuế và khấu hao","息税折旧摊销前利润","xī shuì zhéjiù tānxiāo qián lìrùn","EBITDA margin · grow EBITDA","The EBITDA margin improved to 35%.","Biên EBITDA cải thiện lên 35%."],["net profit","n","lợi nhuận ròng","净利润","jìng lìrùn","net profit after tax · net profit margin","Net profit fell 20% year on year.","Lợi nhuận ròng giảm 20% so với cùng kỳ."],["inventory","n","hàng tồn kho","存货","cúnhuò","unsold inventory · inventory turnover","Inventory makes up most of a developer's assets.","Hàng tồn kho chiếm phần lớn tài sản của chủ đầu tư."],["receivables","n","khoản phải thu","应收账款","yīngshōu zhàngkuǎn","accounts receivable · collect receivables","Receivables rose because buyers paid more slowly.","Khoản phải thu tăng vì người mua trả chậm hơn."],["write-down","n","ghi giảm giá trị tài sản","减值","jiǎnzhí","an inventory write-down · take a write-down","The company took a write-down on unsold land.","Công ty ghi giảm giá trị quỹ đất chưa bán."],["audit","n","kiểm toán","审计","shěnjì","an independent audit · audited accounts","The auditor issued a qualified opinion.","Kiểm toán đưa ra ý kiến ngoại trừ."],["guidance","n","dự báo kết quả công bố","业绩指引","yèjì zhǐyǐn","earnings guidance · cut guidance","Management cut its full-year guidance.","Ban lãnh đạo hạ dự báo kết quả cả năm."],["operating cash flow","n","dòng tiền từ hoạt động kinh doanh","经营现金流","jīngyíng xiànjīn liú","negative operating cash flow · improve operating cash flow","Operating cash flow turned positive this quarter.","Dòng tiền kinh doanh chuyển dương trong quý này."],["revenue recognition","n","ghi nhận doanh thu","收入确认","shōurù quèrèn","revenue recognition on handover · the timing of revenue recognition","Developers recognise revenue on handover, not on sale.","Chủ đầu tư ghi nhận doanh thu khi bàn giao, không phải khi bán."],["dividend","n","cổ tức","股息","gǔxī","pay a dividend · dividend yield","The board decided not to pay a dividend this year.","Hội đồng quản trị quyết định không chia cổ tức năm nay."]],"sents":[["Revenue looks weak this quarter because few projects were handed over, not because sales fell.","Doanh thu quý này yếu vì ít dự án bàn giao, không phải vì bán hàng giảm.","本季度收入偏弱是因为交房项目少，而不是销售下滑。","Běn jìdù shōurù piān ruò shì yīnwèi jiāofáng xiàngmù shǎo, ér bú shì xiāoshòu xiàhuá.","Giải thích báo cáo"],["Look at operating cash flow, not just net profit.","Hãy nhìn dòng tiền kinh doanh, không chỉ lợi nhuận ròng.","要看经营现金流，而不只是净利润。","Yào kàn jīngyíng xiànjīn liú, ér bù zhǐ shì jìng lìrùn.","Tư vấn phân tích"],["Most of the developer's assets are inventory, which is hard to sell quickly.","Phần lớn tài sản của chủ đầu tư là hàng tồn kho, khó bán nhanh.","开发商的大部分资产是存货，很难快速变现。","Kāifā shāng de dà bùfen zīchǎn shì cúnhuò, hěn nán kuàisù biànxiàn.","Đánh giá rủi ro"],["Management has cut full-year guidance by about 15%.","Ban lãnh đạo đã hạ dự báo cả năm khoảng 15%.","管理层将全年业绩指引下调了约百分之十五。","Guǎnlǐ céng jiāng quánnián yèjì zhǐyǐn xiàtiáo le yuē bǎi fēn zhī shíwǔ.","Tin doanh nghiệp"],["The audited accounts will be published at the end of March.","Báo cáo tài chính kiểm toán sẽ công bố cuối tháng Ba.","审计后的财报将在三月底发布。","Shěnjì hòu de cáibào jiāng zài sānyuè dǐ fābù.","Lịch công bố"],["A large write-down suggests the land was bought at the top of the cycle.","Khoản ghi giảm lớn cho thấy đất được mua ở đỉnh chu kỳ.","大额减值说明这块地是在周期高点买的。","Dà'é jiǎnzhí shuōmíng zhè kuài dì shì zài zhōuqī gāodiǎn mǎi de.","Nhận định"]]},{"id":"ec2","tier":2,"dom":"ec","title":"Policy & cycles","vi":"Chính sách và chu kỳ","words":[["monetary policy","n","chính sách tiền tệ","货币政策","huòbì zhèngcè","tighten monetary policy · loose monetary policy","Monetary policy remains accommodative.","Chính sách tiền tệ vẫn đang nới lỏng."],["fiscal policy","n","chính sách tài khóa","财政政策","cáizhèng zhèngcè","expansionary fiscal policy · fiscal policy measures","Fiscal policy focuses on public investment.","Chính sách tài khóa tập trung vào đầu tư công."],["recession","n","suy thoái kinh tế","经济衰退","jīngjì shuāituì","enter a recession · a mild recession","Economists expect a mild recession.","Các nhà kinh tế dự báo một đợt suy thoái nhẹ."],["purchasing power","n","sức mua","购买力","gòumǎi lì","erode purchasing power · purchasing power parity","Rising prices erode purchasing power.","Giá tăng làm xói mòn sức mua."],["elasticity","n","độ co giãn","弹性","tánxìng","price elasticity · elasticity of demand","Luxury housing has low price elasticity.","Nhà ở cao cấp có độ co giãn theo giá thấp."],["opportunity cost","n","chi phí cơ hội","机会成本","jīhuì chéngběn","the opportunity cost of capital · weigh the opportunity cost","Consider the opportunity cost of leaving money in the bank.","Hãy tính chi phí cơ hội của việc để tiền trong ngân hàng."],["foreign direct investment","n","đầu tư trực tiếp nước ngoài (FDI)","外商直接投资","wàishāng zhíjiē tóuzī","attract foreign direct investment · FDI inflows","Foreign direct investment supports demand for industrial land.","FDI hỗ trợ nhu cầu đất công nghiệp."],["central bank","n","ngân hàng trung ương","中央银行","zhōngyāng yínháng","the central bank's decision · central bank independence","The central bank kept rates unchanged.","Ngân hàng trung ương giữ nguyên lãi suất."],["credit growth","n","tăng trưởng tín dụng","信贷增长","xìndài zēngzhǎng","credit growth target · slow credit growth","Credit growth reached 11.6% in nine months.","Tăng trưởng tín dụng đạt 11,6% sau chín tháng."],["consumer price index","n","chỉ số giá tiêu dùng (CPI)","居民消费价格指数","jūmín xiāofèi jiàgé zhǐshù","the consumer price index rose · CPI basket","The consumer price index rose 4.5% year on year.","Chỉ số giá tiêu dùng tăng 4,5% so với cùng kỳ."],["trade deficit","n","thâm hụt thương mại","贸易逆差","màoyì nìchā","run a trade deficit · a trade deficit of US$19 billion","Rising imports created a trade deficit.","Nhập khẩu tăng tạo ra thâm hụt thương mại."],["public investment","n","đầu tư công","公共投资","gōnggòng tóuzī","disburse public investment · public investment projects","Public investment in roads supports the property market.","Đầu tư công vào đường sá hỗ trợ thị trường bất động sản."]],"sents":[["The central bank cut rates to stimulate borrowing.","Ngân hàng trung ương hạ lãi suất để kích thích vay vốn.","央行降息以刺激贷款。","Yāngháng jiàngxī yǐ cìjī dàikuǎn.","Bình luận chính sách"],["Looser monetary policy usually lifts property demand with a lag.","Chính sách tiền tệ nới lỏng thường kéo nhu cầu bất động sản lên, nhưng có độ trễ.","宽松的货币政策通常会滞后地提振房地产需求。","Kuānsōng de huòbì zhèngcè tōngcháng huì zhìhòu de tízhèn fángdìchǎn xūqiú.","Nhận định thị trường"],["The opportunity cost of holding cash is rising.","Chi phí cơ hội của việc giữ tiền mặt đang tăng.","持有现金的机会成本正在上升。","Chíyǒu xiànjīn de jīhuì chéngběn zhèngzài shàngshēng.","Tư vấn nhà đầu tư"],["Foreign direct investment keeps flowing into manufacturing.","Vốn FDI tiếp tục chảy vào ngành sản xuất.","外商直接投资持续流入制造业。","Wàishāng zhíjiē tóuzī chíxù liúrù zhìzào yè.","Bối cảnh vĩ mô"],["Credit growth reached 11.6% in the first nine months, close to the annual target.","Tăng trưởng tín dụng đạt 11,6% sau chín tháng, gần mục tiêu cả năm.","前九个月信贷增长达到百分之十一点六，接近全年目标。","Qián jiǔ gè yuè xìndài zēngzhǎng dádào bǎi fēn zhī shíyī diǎn liù, jiējìn quánnián mùbiāo.","Đọc số liệu"],["Faster disbursement of public investment would support land prices along new roads.","Giải ngân đầu tư công nhanh hơn sẽ hỗ trợ giá đất dọc các tuyến đường mới.","加快公共投资拨付将支撑新道路沿线的地价。","Jiākuài gōnggòng tóuzī bōfù jiāng zhīchēng xīn dàolù yánxiàn de dìjià.","Nhận định"]]},{"id":"ec5","tier":2,"dom":"ec","title":"Urbanisation, labour & demographics","vi":"Đô thị hóa, lao động và dân số","words":[["urbanisation","n","đô thị hóa","城镇化","chéngzhènhuà","rapid urbanisation · the urbanisation rate","Vietnam's urbanisation rate is still below 45%.","Tỷ lệ đô thị hóa của Việt Nam vẫn dưới 45%."],["household","n","hộ gia đình","住户","zhùhù","household income · household formation","Smaller households need more homes.","Hộ gia đình nhỏ hơn cần nhiều nhà hơn."],["labour force","n","lực lượng lao động","劳动力","láodòng lì","a young labour force · a skilled labour force","A young labour force attracts manufacturers.","Lực lượng lao động trẻ thu hút nhà sản xuất."],["wage","n","tiền lương","工资","gōngzī","the minimum wage · wage growth","Wage growth has not kept up with house prices.","Tăng lương không theo kịp giá nhà."],["migration","n","di cư","人口迁移","rénkǒu qiānyí","rural-urban migration · internal migration","Migration to big cities drives rental demand.","Di cư về thành phố lớn thúc đẩy nhu cầu thuê nhà."],["ageing population","n","dân số già hóa","人口老龄化","rénkǒu lǎolínghuà","an ageing population · the challenges of an ageing population","An ageing population will change housing needs.","Dân số già hóa sẽ thay đổi nhu cầu nhà ở."],["affordability","n","khả năng chi trả","可负担性","kě fùdān xìng","housing affordability · an affordability gap","Affordability is the biggest barrier for young buyers.","Khả năng chi trả là rào cản lớn nhất với người mua trẻ."],["price-to-income ratio","n","tỷ lệ giá nhà trên thu nhập","房价收入比","fángjià shōurù bǐ","a high price-to-income ratio · a price-to-income ratio of 20","A high price-to-income ratio shuts out first-time buyers.","Tỷ lệ giá nhà trên thu nhập cao loại người mua lần đầu ra ngoài."],["social housing","n","nhà ở xã hội","保障性住房","bǎozhàng xìng zhùfáng","build social housing · a social housing programme","The government targets one million social housing units.","Chính phủ đặt mục tiêu một triệu căn nhà ở xã hội."],["satellite city","n","đô thị vệ tinh","卫星城","wèixīng chéng","develop satellite cities · a satellite city along the metro","Satellite cities ease pressure on the urban core.","Đô thị vệ tinh giảm áp lực cho lõi đô thị."],["commute","n","quãng đường, thời gian đi làm","通勤","tōngqín","a long commute · commute time","The metro cuts the commute to 30 minutes.","Metro rút thời gian đi làm còn 30 phút."],["skilled worker","n","lao động có tay nghề","技术工人","jìshù gōngrén","a shortage of skilled workers · attract skilled workers","Factories are competing for skilled workers.","Các nhà máy đang cạnh tranh lao động có tay nghề."]],"sents":[["Urbanisation is still below 45%, so long-term housing demand remains strong.","Đô thị hóa vẫn dưới 45%, nên nhu cầu nhà ở dài hạn vẫn lớn.","城镇化率仍低于百分之四十五，因此长期住房需求依然强劲。","Chéngzhènhuà lǜ réng dīyú bǎi fēn zhī sìshíwǔ, yīncǐ chángqī zhùfáng xūqiú yīrán qiángjìng.","Luận điểm đầu tư"],["House prices have risen far faster than wages over the past five years.","Giá nhà tăng nhanh hơn lương rất nhiều trong năm năm qua.","过去五年房价涨幅远超工资涨幅。","Guòqù wǔ nián fángjià zhǎngfú yuǎn chāo gōngzī zhǎngfú.","Phân tích thị trường"],["With the metro, a satellite city 20 kilometres away is only a 30-minute commute.","Có metro, đô thị vệ tinh cách 20 km chỉ mất 30 phút đi làm.","有了地铁，二十公里外的卫星城通勤只需三十分钟。","Yǒu le dìtiě, èrshí gōnglǐ wài de wèixīng chéng tōngqín zhǐ xū sānshí fēnzhōng.","Tư vấn vị trí"],["Social housing can ease the affordability gap, but supply is far below the target.","Nhà ở xã hội giúp thu hẹp khoảng cách khả năng chi trả, nhưng nguồn cung còn xa mục tiêu.","保障性住房能缓解可负担性缺口，但供应远低于目标。","Bǎozhàng xìng zhùfáng néng huǎnjiě kě fùdān xìng quēkǒu, dàn gōngyìng yuǎn dīyú mùbiāo.","Bàn về chính sách"],["Factories near the industrial park need housing for thousands of skilled workers.","Nhà máy gần khu công nghiệp cần chỗ ở cho hàng nghìn lao động tay nghề.","工业园附近的工厂需要为数千名技术工人提供住房。","Gōngyè yuán fùjìn de gōngchǎng xūyào wèi shù qiān míng jìshù gōngrén tígōng zhùfáng.","Cơ hội sản phẩm"],["Smaller households mean the city needs more, but smaller, homes.","Hộ gia đình nhỏ hơn nghĩa là thành phố cần nhiều căn hơn nhưng nhỏ hơn.","家庭规模变小，意味着城市需要更多但面积更小的住房。","Jiātíng guīmó biàn xiǎo, yìwèizhe chéngshì xūyào gèng duō dàn miànjī gèng xiǎo de zhùfáng.","Xu hướng sản phẩm"]]},{"id":"re3","tier":3,"dom":"re","title":"Legal, due diligence & market analysis","vi":"Pháp lý, thẩm định và phân tích thị trường","words":[["due diligence","n","thẩm định pháp lý và tài chính","尽职调查","jìnzhí diàochá","conduct due diligence · legal due diligence","We conducted due diligence before acquiring the site.","Chúng tôi đã thẩm định trước khi mua khu đất."],["freehold","n","sở hữu lâu dài","永久产权","yǒngjiǔ chǎnquán","freehold ownership · a freehold title","Local buyers enjoy freehold ownership.","Người mua trong nước được sở hữu lâu dài."],["leasehold","n","sở hữu có thời hạn","租赁产权","zūlìn chǎnquán","a 50-year leasehold · leasehold term","Foreigners may purchase on a leasehold basis.","Người nước ngoài được mua theo hình thức sở hữu có thời hạn."],["absorption rate","n","tỷ lệ hấp thụ","去化率","qùhuà lǜ","a strong absorption rate · quarterly absorption rate","The absorption rate reached seventy percent at launch.","Tỷ lệ hấp thụ đạt bảy mươi phần trăm ngay khi mở bán."],["land-use rights","n","quyền sử dụng đất","土地使用权","tǔdì shǐyòng quán","transfer land-use rights · a land-use rights certificate","The company secured land-use rights for fifty years.","Công ty được cấp quyền sử dụng đất năm mươi năm."],["escrow account","n","tài khoản ký quỹ / phong tỏa","托管账户","tuōguǎn zhànghù","held in an escrow account · release funds from escrow","Buyers' funds are held in an escrow account.","Tiền của người mua được giữ trong tài khoản phong tỏa."],["zoning","n","quy hoạch phân khu","区域规划","qūyù guīhuà","zoning regulations · a zoning change","The zoning allows mixed-use development.","Quy hoạch cho phép phát triển phức hợp."],["branded residence","n","căn hộ hàng hiệu","品牌住宅","pǐnpái zhùzhái","a branded residence project · branded residence premium","Branded residences sell at a premium over comparable units.","Căn hộ hàng hiệu bán với giá cao hơn sản phẩm tương đương."],["title transfer","n","sang tên","过户","guòhù","complete the title transfer · title transfer fee","Title transfer usually takes 30 to 45 days.","Sang tên thường mất 30 đến 45 ngày."],["encumbrance","n","ràng buộc pháp lý (thế chấp, tranh chấp)","产权负担","chǎnquán fùdān","free of any encumbrance · register an encumbrance","Check that the title is free of any encumbrance.","Kiểm tra sổ không bị ràng buộc pháp lý nào."],["construction permit","n","giấy phép xây dựng","施工许可证","shīgōng xǔkě zhèng","obtain a construction permit · the construction permit is pending","The construction permit was issued last month.","Giấy phép xây dựng được cấp tháng trước."],["foreign ownership cap","n","hạn mức sở hữu cho người nước ngoài","外资持有上限","wàizī chíyǒu shàngxiàn","reach the foreign ownership cap · a 30% foreign ownership cap","The foreign ownership cap is 30% of units per building.","Hạn mức sở hữu cho người nước ngoài là 30% số căn mỗi tòa."]],"sents":[["Foreign buyers are entitled to a 50-year leasehold, which can be renewed subject to current regulations.","Người mua nước ngoài được sở hữu 50 năm và có thể gia hạn theo quy định hiện hành.","外国买家可以获得五十年的产权，按现行规定可以续期。","Wàiguó mǎijiā kěyǐ huòdé wǔshí nián de chǎnquán, àn xiànxíng guīdìng kěyǐ xùqī.","Pháp lý cho khách nước ngoài"],["Our legal team has completed due diligence on the land title.","Đội pháp lý của chúng tôi đã hoàn tất thẩm định quyền sở hữu đất.","我们的法务团队已经完成了对土地产权的尽职调查。","Wǒmen de fǎwù tuánduì yǐjīng wánchéng le duì tǔdì chǎnquán de jìnzhí diàochá.","Làm việc với đối tác"],["The absorption rate in this district has outpaced new supply for three consecutive quarters.","Tỷ lệ hấp thụ của quận này đã vượt nguồn cung mới ba quý liên tiếp.","这个区的去化率已经连续三个季度超过新增供应。","Zhège qū de qùhuà lǜ yǐjīng liánxù sān gè jìdù chāoguò xīnzēng gōngyìng.","Phân tích thị trường"],["Payments are held in an escrow account until the handover conditions are met.","Các khoản thanh toán được giữ trong tài khoản phong tỏa đến khi đủ điều kiện bàn giao.","款项存放在托管账户中，直到满足交房条件。","Kuǎnxiàng cúnfàng zài tuōguǎn zhànghù zhōng, zhídào mǎnzú jiāofáng tiáojiàn.","Bảo vệ người mua"],["Foreign ownership is capped at 30% of units in each building, so availability is limited.","Người nước ngoài chỉ được sở hữu tối đa 30% số căn mỗi tòa, nên số căn còn lại có hạn.","外国人购买上限为每栋楼百分之三十，所以可选房源有限。","Wàiguó rén gòumǎi shàngxiàn wéi měi dòng lóu bǎi fēn zhī sānshí, suǒyǐ kě xuǎn fángyuán yǒuxiàn.","Tư vấn khách nước ngoài"],["Please confirm the title is free of any encumbrance before we transfer the deposit.","Vui lòng xác nhận sổ không bị ràng buộc pháp lý trước khi chúng tôi chuyển cọc.","在我们转定金之前，请确认产权没有任何负担。","Zài wǒmen zhuǎn dìngjīn zhīqián, qǐng quèrèn chǎnquán méiyǒu rènhé fùdān.","Thẩm định trước giao dịch"]]},{"id":"re6","tier":3,"dom":"re","title":"Development & feasibility","vi":"Phát triển dự án và thẩm định khả thi","words":[["feasibility study","n","nghiên cứu khả thi","可行性研究","kěxíng xìng yánjiū","conduct a feasibility study · a preliminary feasibility study","The feasibility study assumes a 24-month sales period.","Nghiên cứu khả thi giả định thời gian bán hàng 24 tháng."],["gross floor area","n","tổng diện tích sàn (GFA)","总建筑面积","zǒng jiànzhù miànjī","gross floor area of 60,000 sqm · GFA","The tower has a gross floor area of 60,000 square metres.","Tòa tháp có tổng diện tích sàn 60.000 m²."],["plot ratio","n","hệ số sử dụng đất","容积率","róngjī lǜ","a plot ratio of 5 · increase the plot ratio","A higher plot ratio would make the project viable.","Hệ số sử dụng đất cao hơn sẽ giúp dự án khả thi."],["land use fee","n","tiền sử dụng đất","土地出让金","tǔdì chūràng jīn","pay the land use fee · land use fee assessment","Delays in land use fee assessment have stalled many projects.","Chậm xác định tiền sử dụng đất khiến nhiều dự án đình trệ."],["construction cost","n","chi phí xây dựng","建安成本","jiàn'ān chéngběn","rising construction costs · construction cost per square metre","Construction costs rose 8% because of steel prices.","Chi phí xây dựng tăng 8% do giá thép."],["presales","n","bán hàng trước khi hoàn thiện","预售","yùshòu","presales revenue · launch presales","Presales fund about 40% of construction.","Tiền bán trước tài trợ khoảng 40% chi phí xây dựng."],["master plan","n","quy hoạch tổng thể","总体规划","zǒngtǐ guīhuà","a 1/500 master plan · approve the master plan","The 1/500 master plan was approved in June.","Quy hoạch 1/500 được phê duyệt vào tháng Sáu."],["joint venture","n","liên doanh","合资企业","hézī qǐyè","form a joint venture · a joint venture partner","The two developers formed a joint venture for the township.","Hai chủ đầu tư lập liên doanh cho đại đô thị."],["site acquisition","n","thâu tóm quỹ đất","拿地","ná dì","site acquisition cost · complete site acquisition","Site acquisition took almost two years.","Việc thâu tóm quỹ đất mất gần hai năm."],["residual land value","n","giá trị đất theo phương pháp thặng dư","剩余地价","shèngyú dìjià","calculate the residual land value · the residual method","The residual land value tells us the most we can pay.","Giá trị đất thặng dư cho biết mức tối đa ta có thể trả."],["phasing","n","phân kỳ dự án","分期开发","fēnqī kāifā","project phasing · phasing strategy","Phasing lets us test prices before launching larger blocks.","Phân kỳ giúp thử giá trước khi mở bán các khối lớn hơn."],["contingency","n","chi phí dự phòng","不可预见费","bùkě yùjiàn fèi","a 5% contingency · contingency budget","We added a 5% contingency for construction risk.","Chúng tôi thêm 5% dự phòng cho rủi ro thi công."]],"sents":[["At a plot ratio of six, the residual land value comes to about 180 million dong per square metre.","Với hệ số sử dụng đất bằng sáu, giá trị đất thặng dư vào khoảng 180 triệu đồng/m².","按容积率六计算，剩余地价大约每平方米一亿八千万越南盾。","Àn róngjī lǜ liù jìsuàn, shèngyú dìjià dàyuē měi píngfāngmǐ yí yì bāqiān wàn Yuènán dùn.","Thẩm định đất"],["The project only works if presales cover at least a third of construction costs.","Dự án chỉ khả thi nếu tiền bán trước đủ ít nhất một phần ba chi phí xây dựng.","只有预售款覆盖至少三分之一的建安成本，项目才可行。","Zhǐyǒu yùshòu kuǎn fùgài zhìshǎo sān fēn zhī yī de jiàn'ān chéngběn, xiàngmù cái kěxíng.","Họp đầu tư"],["We propose a joint venture: you bring the land, we bring capital and the brand.","Chúng tôi đề xuất liên doanh: bên anh góp đất, bên tôi góp vốn và thương hiệu.","我们建议合资：您出土地，我们出资金和品牌。","Wǒmen jiànyì hézī: nín chū tǔdì, wǒmen chū zījīn hé pǐnpái.","Đề xuất hợp tác"],["Until the land use fee is finalised, our cost base remains uncertain.","Khi tiền sử dụng đất chưa chốt, giá vốn của chúng ta vẫn bất định.","在土地出让金确定之前，我们的成本基础仍不确定。","Zài tǔdì chūràng jīn quèdìng zhīqián, wǒmen de chéngběn jīchǔ réng bú quèdìng.","Rủi ro pháp lý"],["Phase one should be mid-range to build momentum and a resident community.","Giai đoạn một nên là sản phẩm trung cấp để tạo đà và cộng đồng cư dân.","一期应以中端产品为主，先积累人气和业主社区。","Yīqī yīng yǐ zhōngduān chǎnpǐn wéi zhǔ, xiān jīlěi rénqì hé yèzhǔ shèqū.","Chiến lược phân kỳ"],["Our contingency is used up, so any further delay hits the margin directly.","Khoản dự phòng đã hết, nên mọi chậm trễ thêm sẽ ăn thẳng vào biên lợi nhuận.","不可预见费已经用完了，再延误就会直接影响利润率。","Bùkě yùjiàn fèi yǐjīng yòng wán le, zài yánwù jiù huì zhíjiē yǐngxiǎng lìrùn lǜ.","Báo cáo tiến độ"]]},{"id":"mk3","tier":3,"dom":"mk","title":"Strategy & positioning","vi":"Chiến lược và định vị","words":[["positioning","n","định vị","品牌定位","pǐnpái dìngwèi","brand positioning · a premium positioning","The project needs a sharper positioning.","Dự án cần định vị sắc nét hơn."],["value proposition","n","tuyên bố giá trị","价值主张","jiàzhí zhǔzhāng","a compelling value proposition · communicate the value proposition","Our value proposition is hassle-free ownership.","Giá trị chúng tôi đưa ra là sở hữu không phải lo vận hành."],["attribution","n","phân bổ nguồn chuyển đổi","归因","guīyīn","attribution model · last-click attribution","Attribution is tricky when buyers take months to decide.","Phân bổ rất khó khi người mua mất nhiều tháng để quyết định."],["customer lifetime value","n","giá trị vòng đời khách hàng","客户终身价值","kèhù zhōngshēn jiàzhí","increase customer lifetime value · lifetime value per client","Referrals raise customer lifetime value considerably.","Khách giới thiệu làm tăng đáng kể giá trị vòng đời khách hàng."],["market segmentation","n","phân khúc thị trường","市场细分","shìchǎng xìfēn","market segmentation strategy · segmentation by income","Market segmentation revealed an underserved expat niche.","Phân khúc thị trường cho thấy nhóm chuyên gia nước ngoài chưa được phục vụ tốt."],["brand equity","n","tài sản thương hiệu","品牌资产","pǐnpái zīchǎn","build brand equity · erode brand equity","Deep discounting can erode brand equity.","Giảm giá sâu có thể làm hao mòn tài sản thương hiệu."],["go-to-market strategy","n","chiến lược đưa sản phẩm ra thị trường","市场进入策略","shìchǎng jìnrù cèlüè","a go-to-market strategy · refine the go-to-market strategy","The go-to-market strategy starts with existing clients.","Chiến lược ra thị trường bắt đầu từ khách hàng hiện hữu."],["churn","n","tỷ lệ khách rời bỏ","客户流失","kèhù liúshī","reduce churn · churn rate","Better onboarding reduced churn among tenants.","Đón tiếp tốt hơn giúp giảm tỷ lệ khách thuê rời đi."],["brand architecture","n","kiến trúc thương hiệu","品牌架构","pǐnpái jiàgòu","a clear brand architecture · master brand and sub-brands","Our brand architecture links each project to the master brand.","Kiến trúc thương hiệu gắn mỗi dự án với thương hiệu mẹ."],["share of voice","n","thị phần thảo luận","声量份额","shēngliàng fèn'é","increase share of voice · share of voice vs competitors","Our share of voice fell to 18% this quarter.","Thị phần thảo luận của ta giảm còn 18% trong quý."],["competitive landscape","n","bối cảnh cạnh tranh","竞争格局","jìngzhēng géjú","analyse the competitive landscape · a crowded competitive landscape","The competitive landscape changed after two big launches.","Bối cảnh cạnh tranh thay đổi sau hai đợt mở bán lớn."],["differentiation","n","sự khác biệt hóa","差异化","chāyìhuà","clear differentiation · point of differentiation","Our differentiation is after-sales service.","Điểm khác biệt của chúng ta là dịch vụ hậu mãi."]],"sents":[["Our positioning should speak to investors rather than end users.","Định vị của chúng ta nên hướng tới nhà đầu tư hơn là người mua ở thực.","我们的定位应该面向投资者，而不是自住买家。","Wǒmen de dìngwèi yīnggāi miànxiàng tóuzī zhě, ér bú shì zìzhù mǎijiā.","Họp chiến lược"],["Last-click attribution undervalues our awareness campaigns.","Phân bổ theo lần nhấp cuối đánh giá thấp các chiến dịch nhận biết.","末次点击归因低估了我们品牌宣传活动的价值。","Mòcì diǎnjī guīyīn dīgū le wǒmen pǐnpái xuānchuán huódòng de jiàzhí.","Tranh luận số liệu"],["What sets us apart is after-sales operation, not price.","Điểm khác biệt của chúng ta là vận hành sau bán hàng, không phải giá.","我们的差异化在于售后运营，而不是价格。","Wǒmen de chāyìhuà zàiyú shòuhòu yùnyíng, ér bú shì jiàgé.","Trình bày với đối tác"],["I'd push back on that assumption; the data tells a different story.","Tôi không đồng tình với giả định đó; dữ liệu cho thấy điều khác.","我不太认同这个假设，数据显示的情况并不一样。","Wǒ bú tài rèntóng zhège jiǎshè, shùjù xiǎnshì de qíngkuàng bìng bù yíyàng.","Phản biện lịch sự"],["Our share of voice dropped while competitors increased their video spend.","Thị phần thảo luận của ta giảm khi đối thủ tăng chi cho video.","竞争对手加大视频投放后，我们的声量份额下降了。","Jìngzhēng duìshǒu jiādà shìpín tóufàng hòu, wǒmen de shēngliàng fèn'é xiàjiàng le.","Báo cáo cạnh tranh"],["In this competitive landscape, differentiation has to come from service, not discounts.","Trong bối cảnh cạnh tranh này, khác biệt phải đến từ dịch vụ, không phải chiết khấu.","在这样的竞争格局下，差异化必须来自服务，而不是折扣。","Zài zhèyàng de jìngzhēng géjú xià, chāyìhuà bìxū láizì fúwù, ér bú shì zhékòu.","Định hướng chiến lược"]]},{"id":"mk6","tier":3,"dom":"mk","title":"Research & analytics","vi":"Nghiên cứu và phân tích dữ liệu","words":[["sample size","n","cỡ mẫu","样本量","yàngběn liàng","a small sample size · increase the sample size","The sample size is too small to draw conclusions.","Cỡ mẫu quá nhỏ để kết luận."],["survey","n","khảo sát","调研","diàoyán","conduct a survey · survey respondents","We surveyed 400 recent buyers.","Chúng tôi khảo sát 400 người mua gần đây."],["focus group","n","nhóm thảo luận","焦点小组","jiāodiǎn xiǎozǔ","run a focus group · focus group findings","The focus group preferred smaller two-bedroom units.","Nhóm thảo luận thích căn hai phòng ngủ nhỏ hơn."],["benchmark","n","chuẩn so sánh","基准","jīzhǔn","an industry benchmark · benchmark against competitors","Our cost per lead is below the industry benchmark.","Chi phí mỗi lead của ta thấp hơn chuẩn ngành."],["correlation","n","tương quan","相关性","xiāngguān xìng","a strong correlation · correlation is not causation","Correlation does not prove causation.","Tương quan không chứng minh quan hệ nhân quả."],["dashboard","n","bảng theo dõi số liệu","数据看板","shùjù kànbǎn","a real-time dashboard · build a dashboard","The dashboard updates leads in real time.","Bảng số liệu cập nhật lead theo thời gian thực."],["insight","n","phát hiện, thấu hiểu","洞察","dòngchá","consumer insight · an actionable insight","The key insight is that buyers trust residents more than ads.","Phát hiện chính là người mua tin cư dân hơn quảng cáo."],["persona","n","chân dung khách hàng","用户画像","yònghù huàxiàng","a buyer persona · build a persona","We built three buyer personas for the project.","Chúng tôi xây ba chân dung khách hàng cho dự án."],["cohort","n","nhóm khách theo thời điểm","群组","qúnzǔ","cohort analysis · the March cohort","The March cohort converted faster than earlier groups.","Nhóm khách tháng Ba chuyển đổi nhanh hơn các nhóm trước."],["statistically significant","adj","có ý nghĩa thống kê","统计显著","tǒngjì xiǎnzhù","a statistically significant result · not statistically significant","The difference is not statistically significant.","Chênh lệch này không có ý nghĩa thống kê."],["primary research","n","nghiên cứu sơ cấp","一手调研","yìshǒu diàoyán","conduct primary research · primary research data","Primary research confirmed demand from young families.","Nghiên cứu sơ cấp xác nhận nhu cầu từ gia đình trẻ."],["desk research","n","nghiên cứu tại bàn","案头研究","àntóu yánjiū","start with desk research · desk research sources","Our desk research drew on CBRE and Savills reports.","Nghiên cứu tại bàn dựa trên báo cáo của CBRE và Savills."]],"sents":[["Before we change the strategy, is this result statistically significant?","Trước khi đổi chiến lược, kết quả này có ý nghĩa thống kê không?","在改变策略之前，这个结果在统计上显著吗？","Zài gǎibiàn cèlüè zhīqián, zhège jiéguǒ zài tǒngjì shàng xiǎnzhù ma?","Phản biện số liệu"],["The data shows a correlation, but we can't claim the ads caused the sales.","Số liệu cho thấy tương quan, nhưng không thể nói quảng cáo gây ra doanh số.","数据显示有相关性，但不能说是广告带来了销量。","Shùjù xiǎnshì yǒu xiāngguān xìng, dàn bù néng shuō shì guǎnggào dàilái le xiāoliàng.","Diễn giải số liệu"],["Our main persona is a 35-year-old professional buying a second home to rent out.","Chân dung chính là người đi làm 35 tuổi mua căn thứ hai để cho thuê.","我们的主要用户画像是三十五岁、买第二套房用于出租的职场人士。","Wǒmen de zhǔyào yònghù huàxiàng shì sānshíwǔ suì, mǎi dì-èr tào fáng yòngyú chūzū de zhíchǎng rénshì.","Trình bày insight"],["Let's start with desk research, then validate it with a small survey.","Bắt đầu bằng nghiên cứu tại bàn, rồi kiểm chứng bằng một khảo sát nhỏ.","我们先做案头研究，再用小规模调研验证。","Wǒmen xiān zuò àntóu yánjiū, zài yòng xiǎo guīmó diàoyán yànzhèng.","Lên kế hoạch nghiên cứu"],["Compared with the industry benchmark, our cost per lead is 20% lower.","So với chuẩn ngành, chi phí mỗi lead của chúng ta thấp hơn 20%.","与行业基准相比，我们的单个线索成本低百分之二十。","Yǔ hángyè jīzhǔn xiāngbǐ, wǒmen de dān gè xiànsuǒ chéngběn dī bǎi fēn zhī èrshí.","Báo cáo lãnh đạo"],["The dashboard should answer one question: where should next month's budget go?","Bảng số liệu nên trả lời một câu hỏi: ngân sách tháng sau nên đổ vào đâu?","数据看板应该回答一个问题：下个月的预算该投向哪里？","Shùjù kànbǎn yīnggāi huídá yí gè wèntí: xià gè yuè de yùsuàn gāi tóuxiàng nǎlǐ?","Thiết kế báo cáo"]]},{"id":"fi3","tier":3,"dom":"fi","title":"Deal analysis","vi":"Phân tích thương vụ","words":[["net present value","n","giá trị hiện tại ròng (NPV)","净现值","jìng xiànzhí","a positive net present value · calculate net present value","A positive net present value justifies the investment.","NPV dương là cơ sở để đầu tư."],["internal rate of return","n","tỷ suất hoàn vốn nội bộ (IRR)","内部收益率","nèibù shōuyì lǜ","a target internal rate of return · an IRR of 15%","The fund targets an internal rate of return of fifteen percent.","Quỹ đặt mục tiêu IRR mười lăm phần trăm."],["discount rate","n","tỷ lệ chiết khấu","折现率","zhéxiàn lǜ","apply a discount rate · a higher discount rate","A higher discount rate lowers the valuation.","Tỷ lệ chiết khấu cao hơn làm giảm định giá."],["cap rate","n","tỷ suất vốn hóa","资本化率","zīběnhuà lǜ","cap rate compression · a cap rate of 6%","Office cap rates have widened over the past year.","Tỷ suất vốn hóa văn phòng đã nới rộng trong năm qua."],["debt-to-equity ratio","n","tỷ lệ nợ trên vốn chủ sở hữu","负债权益比","fùzhài quányì bǐ","a high debt-to-equity ratio · reduce the debt-to-equity ratio","Lenders are wary of its debt-to-equity ratio.","Bên cho vay dè dặt trước tỷ lệ nợ trên vốn của công ty."],["hedge","v","phòng ngừa rủi ro","对冲","duìchōng","hedge against inflation · hedge currency risk","Many buyers see property as a hedge against inflation.","Nhiều người mua coi bất động sản là kênh phòng ngừa lạm phát."],["default risk","n","rủi ro vỡ nợ","违约风险","wéiyuē fēngxiǎn","assess default risk · lower default risk","Higher rates increase default risk among developers.","Lãi suất cao làm tăng rủi ro vỡ nợ của các chủ đầu tư."],["amortization","n","khấu hao / trả dần nợ gốc","摊销","tānxiāo","an amortization schedule · loan amortization","The amortization schedule runs over twenty years.","Lịch trả nợ gốc kéo dài hai mươi năm."],["sensitivity analysis","n","phân tích độ nhạy","敏感性分析","mǐngǎn xìng fēnxī","run a sensitivity analysis · sensitivit
