<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E6B5C">
<title>Business English · B2+ · Bất động sản, Marketing, Tài chính, Kinh tế</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F0E8;--card:#fff;--ink:#161A27;--muted:#575D6E;--line:#DCD6C8;--soft:#EAE6DC;--primary:#0E6B5C;--primary-2:#D9F0EA;--accent:#F4622A;
--good:#1E8443;--bad:#D12B30;--re:#B4530A;--mk:#B02A6B;--fi:#1565BF;--ec:#5B3FC4;--zh:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#14151B;--card:#1D1F28;--ink:#EEF0F6;--muted:#9AA0AE;--line:#2C2F3B;--soft:#252834;--primary:#4CC9B0;--primary-2:#17352F;--good:#4CC97A;--bad:#FF6B6E;--re:#F0A35A;--mk:#F07AB0;--fi:#6FB1FF;--ec:#A592FF}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5}
a{color:var(--primary)}button{font:inherit;cursor:pointer}
#app{max-width:860px;margin:0 auto;padding:14px 14px 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:13px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px}
.brand b{display:block;font-size:17px}.brand small{color:var(--muted);font-size:12.5px}
.lsw{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card);font-size:13px;font-weight:700}
.lsw{flex:none}.lsw a,.lsw span{white-space:nowrap;padding:6px 12px;text-decoration:none;color:var(--muted)}.lsw span{background:var(--primary);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
h1{font-size:23px;margin:0 0 4px}h2{font-size:17px;margin:20px 4px 8px}.sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.btn{display:inline-block;border:0;border-radius:14px;background:var(--primary);color:#fff;font-weight:700;padding:11px 16px;text-decoration:none;text-align:center}
.btn.ghost{background:var(--primary-2);color:var(--primary)}.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}.btn.block{display:block;width:100%}
.btn:disabled{opacity:.45}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}.seg button{border:0;background:transparent;border-radius:9px;padding:7px 12px;font-weight:600;color:var(--muted)}.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.back{display:inline-block;margin-bottom:8px;text-decoration:none;font-weight:600}
.chip{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:2px 9px;background:color-mix(in srgb,var(--c,var(--primary)) 18%,transparent);color:var(--c,var(--primary))}
.today{border-left:5px solid var(--primary)}.trow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.trow span{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--soft)}.trow b{color:var(--primary)}
.grid{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.unit{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:16px;padding:13px 14px}
.unit b{display:block;font-size:15.5px}.unit small{color:var(--muted);font-size:13px;display:block}.unit .pg{height:6px;border-radius:3px;background:var(--line);margin-top:9px;overflow:hidden}.unit .pg i{display:block;height:100%;background:var(--c)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px}.tile .ic{font-size:22px}.tile b{display:block;margin-top:4px}.tile small{color:var(--muted);font-size:12.5px}
.w{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}.w:last-child{border:0}.w .m{flex:1;min-width:0}
.w b{font-size:16.5px}.w .pos{font-size:12px;color:var(--muted);font-style:italic;margin-left:4px}.w .vi{display:block;font-size:14.5px}.zhl{font-family:var(--zh);font-size:15px;color:var(--ec)}.py{font-size:12.5px;color:var(--muted)}
.w .co{font-size:13px;color:var(--muted);margin-top:3px}.w .ex{font-size:14px;margin-top:4px}.w .ex i{color:var(--muted);display:block;font-size:13px}
.sp{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--primary);display:grid;place-items:center;font-size:15px}
.st{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none;margin-top:8px}.st.l{background:#8E81EC}.st.k{background:var(--good)}
.sent{padding:12px 0;border-bottom:1px solid var(--line)}.sent:last-child{border:0}.sent .en{font-size:16.5px;font-weight:600}.sent .vi{font-size:14.5px;color:var(--muted)}.sent .row{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.flash{min-height:300px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;cursor:pointer}.flash .big{font-size:32px;font-weight:800;line-height:1.2}.flash .hint{color:var(--muted);font-size:13px;margin-top:10px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:sticky;bottom:10px}.grades button{border:0;border-radius:14px;color:#fff;font-weight:800;padding:10px 4px}.grades small{display:block;font-weight:500;font-size:11.5px;opacity:.9}
.g0{background:#D12B30}.g1{background:#DE7A00}.g2{background:#1E8443}.g3{background:#1565BF}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden;flex:1}.prog i{display:block;height:100%;background:var(--primary)}
.sh{display:flex;gap:10px;align-items:center;margin-bottom:10px}.sh .x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;text-decoration:none;color:var(--ink);font-weight:700;flex:none}
.para{font-size:17px;line-height:1.75;margin:0 0 14px}.para .tr{display:block;font-size:14.5px;line-height:1.55;color:var(--muted);margin-top:6px;border-left:3px solid var(--line);padding-left:10px}
.tw{cursor:pointer;border-radius:4px}.tw:hover{background:var(--primary-2)}.tw.sv{background:#FFE9A8;color:#5A3A00}.tw.gl{border-bottom:1.5px dotted var(--primary)}
@media (prefers-color-scheme:dark){.tw.sv{background:#5A4410;color:#FFE2A8}}
.q{padding:12px 0;border-bottom:1px solid var(--line)}.q:last-child{border:0}.q p{margin:0 0 8px;font-weight:600}.q .opts{display:flex;flex-wrap:wrap;gap:8px}
.q .o{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:7px 12px;color:var(--ink);text-align:left}.q .o.on{border-color:var(--primary);background:var(--primary-2)}.q .o.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--card))}.q .o.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
.q input,.inp{font:inherit;padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}.q input{max-width:240px}.q input.ok{border-color:var(--good)}.q input.no{border-color:var(--bad)}
.why{font-size:13.5px;color:var(--muted);margin-top:6px}
textarea.inp{min-height:96px;resize:vertical}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px;box-shadow:0 -10px 30px rgba(0,0,0,.18);z-index:50;max-width:860px;margin:0 auto}
.sheet h3{margin:0 0 4px;font-size:22px}.sheet .rw{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.dtext{font-size:19px;line-height:1.9;margin:10px 0}.dw{display:inline-block;margin:0 2px;border-bottom:2px solid var(--line);min-width:1.2em;text-align:center}.dw.ok{color:var(--good);border-color:transparent}.dw.miss{color:var(--bad)}.dw.hid{color:var(--muted);letter-spacing:1px}
.cz{display:inline-block;width:auto;min-width:60px;font:inherit;font-size:17px;padding:2px 6px;margin:2px;border:0;border-bottom:2.5px solid var(--primary);background:var(--primary-2);border-radius:6px 6px 0 0;color:var(--ink);text-align:center}.cz.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--card))}.cz.no{border-color:var(--bad)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.ctl .sp{width:44px;height:44px;font-size:18px}
.yt{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;background:#000;margin-bottom:10px}.yt>div,.yt iframe{position:absolute;inset:0;width:100%;height:100%}
.res{font-weight:800;margin:8px 0}.res.ok{color:var(--good)}.res.no{color:var(--bad)}
.nbrow{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.nbrow:last-child{border:0}.nbrow b{min-width:110px}.nbrow input{flex:1;min-width:0}.nbrow button{border:0;background:transparent;color:var(--muted);font-size:16px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:10px;border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 80%,#fff),var(--primary))}
.mcard{min-height:100px;border-radius:14px;border:0;border-bottom:4px solid rgba(0,0,0,.22);padding:8px 6px;font-weight:700;font-size:15px;background:#fff;color:#161A27;transition:transform .12s,opacity .3s}
.mcard.v{background:#FFF3D6;color:#6B3A00;border-bottom-color:#DE7A00}.mcard.sel{transform:translateY(-3px) scale(1.03);box-shadow:0 0 0 3.5px #FFD23F}.mcard.ok{background:#CFF5DC;transform:scale(1.05)}.mcard.no{background:#FFD9DA;animation:shake .4s}.mcard.gone{opacity:0;pointer-events:none}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media(min-width:900px){.mcard{min-height:140px;font-size:18px}}
.done{text-align:center}.done .em{font-size:44px;font-weight:900;color:var(--primary)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40}
nav.bottom a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600}nav.bottom a.on{color:var(--primary)}nav.bottom span{display:block;font-size:19px}
.note{font-size:13.5px;color:var(--muted)}code{background:var(--soft);padding:1px 6px;border-radius:6px;font-size:13px}
pre{background:var(--soft);padding:10px;border-radius:12px;font-size:12px;overflow:auto}
</style>
</head>

 xiān kàn yàngbǎn fáng, háishi zhíjiē qù kàn shíjì de fángzi?","Đón khách"],["The down payment is 20%, and the rest is paid in instalments until handover.","Thanh toán đợt đầu 20%, phần còn lại trả góp đến khi bàn giao.","首付是百分之二十，其余分期支付，直到交房。","Shǒufù shì bǎi fēn zhī èrshí, qíyú fēnqī zhīfù, zhídào jiāofáng.","Báo chính sách"],["The maintenance fee covers security, cleaning and the shared amenities.","Phí quản lý bao gồm an ninh, vệ sinh và các tiện ích chung.","物业费包括安保、保洁和公共配套设施。","Wùyè fèi bāokuò ānbǎo, bǎojié hé gōnggòng pèitào shèshī.","Giải thích chi phí"],["May I ask what your budget range is?","Cho tôi hỏi tầm ngân sách của anh chị là bao nhiêu?","请问您的预算范围是多少？","Qǐngwèn nín de yùsuàn fànwéi shì duōshao?","Khai thác nhu cầu"]]},{"id":"re2","tier":2,"dom":"re","title":"Negotiation & investment talk","vi":"Đàm phán và tư vấn đầu tư","words":[["payment schedule","n","tiến độ thanh toán","付款计划","fùkuǎn jìhuà","a flexible payment schedule · follow the payment schedule","We can tailor the payment schedule to your cash flow.","Chúng tôi có thể điều chỉnh tiến độ thanh toán theo dòng tiền của anh chị."],["rental yield","n","tỷ suất cho thuê","租金回报率","zūjīn huíbào lǜ","gross rental yield · a rental yield of 5%","Rental yields in this area average five percent.","Tỷ suất cho thuê khu này trung bình năm phần trăm."],["capital appreciation","n","tăng giá trị tài sản","资本增值","zīběn zēngzhí","long-term capital appreciation · potential for capital appreciation","Investors here are betting on capital appreciation.","Nhà đầu tư ở đây đặt cược vào khả năng tăng giá."],["occupancy rate","n","tỷ lệ lấp đầy","入住率","rùzhù lǜ","a high occupancy rate · occupancy rate of 90%","The tower has kept its occupancy rate above ninety percent.","Tòa nhà giữ tỷ lệ lấp đầy trên chín mươi phần trăm."],["developer","n","chủ đầu tư","开发商","kāifā shāng","a reputable developer · the developer's track record","The developer has delivered every project on time.","Chủ đầu tư đã bàn giao đúng hạn mọi dự án."],["grace period","n","thời gian ân hạn","宽限期","kuānxiàn qī","a 24-month grace period · principal grace period","The bank offers a two-year grace period on the principal.","Ngân hàng ân hạn nợ gốc hai năm."],["off-plan","adj","(nhà) hình thành trong tương lai","期房","qīfáng","buy off-plan · off-plan property","Buying off-plan usually means a lower entry price.","Mua nhà hình thành trong tương lai thường có giá vào thấp hơn."],["resale market","n","thị trường thứ cấp","二手房市场","èrshǒu fáng shìchǎng","an active resale market · resale market prices","Prices on the resale market are already ten percent higher.","Giá trên thị trường thứ cấp đã cao hơn mười phần trăm."]],"sents":[["If you settle 95% upfront, the developer offers an 8% discount.","Nếu anh chị thanh toán trước 95%, chủ đầu tư chiết khấu 8%.","如果您一次性付清百分之九十五，开发商可以给百分之八的折扣。","Rúguǒ nín yícìxìng fùqīng bǎi fēn zhī jiǔshíwǔ, kāifā shāng kěyǐ gěi bǎi fēn zhī bā de zhékòu.","Chốt chính sách"],["Units in this tower are currently renting at around 1,200 dollars a month.","Căn hộ ở tòa này hiện cho thuê khoảng 1.200 đô một tháng.","这栋楼的房子目前月租大约一千二百美元。","Zhè dòng lóu de fángzi mùqián yuèzū dàyuē yìqiān èrbǎi měiyuán.","Dòng tiền cho thuê"],["I understand your concern; let me walk you through the numbers.","Tôi hiểu băn khoăn của anh chị; để tôi tính chi tiết từng con số.","我理解您的顾虑，我来给您详细算一下。","Wǒ lǐjiě nín de gùlǜ, wǒ lái gěi nín xiángxì suàn yíxià.","Xử lý từ chối"],["This is the last unit with a river view at this price.","Đây là căn view sông cuối cùng ở mức giá này.","这是这个价位最后一套河景房了。","Zhè shì zhège jiàwèi zuìhòu yí tào héjǐng fáng le.","Tạo khan hiếm"]]},{"id":"re3","tier":3,"dom":"re","title":"Legal, due diligence & market analysis","vi":"Pháp lý, thẩm định và phân tích thị trường","words":[["due diligence","n","thẩm định pháp lý và tài chính","尽职调查","jìnzhí diàochá","conduct due diligence · legal due diligence","We conducted due diligence before acquiring the site.","Chúng tôi đã thẩm định trước khi mua khu đất."],["freehold","n","sở hữu lâu dài","永久产权","yǒngjiǔ chǎnquán","freehold ownership · a freehold title","Local buyers enjoy freehold ownership.","Người mua trong nước được sở hữu lâu dài."],["leasehold","n","sở hữu có thời hạn","租赁产权","zūlìn chǎnquán","a 50-year leasehold · leasehold term","Foreigners may purchase on a leasehold basis.","Người nước ngoài được mua theo hình thức sở hữu có thời hạn."],["absorption rate","n","tỷ lệ hấp thụ","去化率","qùhuà lǜ","a strong absorption rate · quarterly absorption rate","The absorption rate reached seventy percent at launch.","Tỷ lệ hấp thụ đạt bảy mươi phần trăm ngay khi mở bán."],["land-use rights","n","quyền sử dụng đất","土地使用权","tǔdì shǐyòng quán","transfer land-use rights · a land-use rights certificate","The company secured land-use rights for fifty years.","Công ty được cấp quyền sử dụng đất năm mươi năm."],["escrow account","n","tài khoản ký quỹ / phong tỏa","托管账户","tuōguǎn zhànghù","held in an escrow account · release funds from escrow","Buyers' funds are held in an escrow account.","Tiền của người mua được giữ trong tài khoản phong tỏa."],["zoning","n","quy hoạch phân khu","区域规划","qūyù guīhuà","zoning regulations · a zoning change","The zoning allows mixed-use development.","Quy hoạch cho phép phát triển phức hợp."],["branded residence","n","căn hộ hàng hiệu","品牌住宅","pǐnpái zhùzhái","a branded residence project · branded residence premium","Branded residences sell at a premium over comparable units.","Căn hộ hàng hiệu bán với giá cao hơn sản phẩm tương đương."]],"sents":[["Foreign buyers are entitled to a 50-year leasehold, which can be renewed subject to current regulations.","Người mua nước ngoài được sở hữu 50 năm và có thể gia hạn theo quy định hiện hành.","外国买家可以获得五十年的产权，按现行规定可以续期。","Wàiguó mǎijiā kěyǐ huòdé wǔshí nián de chǎnquán, àn xiànxíng guīdìng kěyǐ xùqī.","Pháp lý cho khách nước ngoài"],["Our legal team has completed due diligence on the land title.","Đội pháp lý của chúng tôi đã hoàn tất thẩm định quyền sở hữu đất.","我们的法务团队已经完成了对土地产权的尽职调查。","Wǒmen de fǎwù tuánduì yǐjīng wánchéng le duì tǔdì chǎnquán de jìnzhí diàochá.","Làm việc với đối tác"],["The absorption rate in this district has outpaced new supply for three consecutive quarters.","Tỷ lệ hấp thụ của quận này đã vượt nguồn cung mới ba quý liên tiếp.","这个区的去化率已经连续三个季度超过新增供应。","Zhège qū de qùhuà lǜ yǐjīng liánxù sān gè jìdù chāoguò xīnzēng gōngyìng.","Phân tích thị trường"],["Payments are held in an escrow account until the handover conditions are met.","Các khoản thanh toán được giữ trong tài khoản phong tỏa đến khi đủ điều kiện bàn giao.","款项存放在托管账户中，直到满足交房条件。","Kuǎnxiàng cúnfàng zài tuōguǎn zhànghù zhōng, zhídào mǎnzú jiāofáng tiáojiàn.","Bảo vệ người mua"]]},{"id":"mk1","tier":1,"dom":"mk","title":"Campaign basics","vi":"Chiến dịch cơ bản","words":[["target audience","n","đối tượng mục tiêu","目标受众","mùbiāo shòuzhòng","reach the target audience · define a target audience","Our target audience is investors aged thirty to forty-five.","Đối tượng mục tiêu là nhà đầu tư từ ba mươi đến bốn mươi lăm tuổi."],["lead","n","khách hàng tiềm năng","潜在客户","qiánzài kèhù","generate leads · a qualified lead","Sales follows up on every lead within an hour.","Sale gọi lại mỗi khách tiềm năng trong vòng một giờ."],["campaign","n","chiến dịch","营销活动","yíngxiāo huódòng","launch a campaign · an ad campaign","The campaign goes live next Monday.","Chiến dịch chạy từ thứ Hai tuần sau."],["budget","n","ngân sách","预算","yùsuàn","allocate a budget · stay within budget","We need to stay within the monthly budget.","Chúng ta phải giữ trong ngân sách tháng."],["brand awareness","n","độ nhận biết thương hiệu","品牌知名度","pǐnpái zhīmíngdù","build brand awareness · raise brand awareness","Video ads helped build brand awareness.","Quảng cáo video giúp tăng độ nhận biết thương hiệu."],["landing page","n","trang đích","落地页","luòdì yè","optimise the landing page · a landing page form","The landing page loads too slowly on mobile.","Trang đích tải quá chậm trên điện thoại."],["call to action","n","lời kêu gọi hành động","行动号召","xíngdòng hàozhào","a clear call to action · a call-to-action button","Every post should end with a call to action.","Mỗi bài đăng nên kết bằng lời kêu gọi hành động."],["engagement","n","mức độ tương tác","互动","hùdòng","drive engagement · engagement rate","Short videos drive the most engagement.","Video ngắn tạo nhiều tương tác nhất."]],"sents":[["Who exactly is our target audience for this launch?","Chính xác thì đối tượng mục tiêu của đợt mở bán này là ai?","这次发布的目标受众到底是谁？","Zhè cì fābù de mùbiāo shòuzhòng dàodǐ shì shéi?","Họp lên kế hoạch"],["We generated 300 leads last week, mostly from Facebook.","Tuần trước chúng ta có 300 khách tiềm năng, phần lớn từ Facebook.","上周我们获得了三百个潜在客户，大部分来自Facebook。","Shàng zhōu wǒmen huòdé le sānbǎi gè qiánzài kèhù, dà bùfen láizì Facebook.","Báo cáo tuần"],["Could you send me the campaign report by Friday?","Bạn gửi tôi báo cáo chiến dịch trước thứ Sáu được không?","你能在周五之前把活动报告发给我吗？","Nǐ néng zài zhōuwǔ zhīqián bǎ huódòng bàogào fā gěi wǒ ma?","Giao việc"],["The call to action needs to be clearer.","Lời kêu gọi hành động cần rõ ràng hơn.","行动号召需要更明确一些。","Xíngdòng hàozhào xūyào gèng míngquè yìxiē.","Góp ý nội dung"]]},{"id":"mk2","tier":2,"dom":"mk","title":"Performance & optimisation","vi":"Hiệu quả và tối ưu","words":[["conversion rate","n","tỷ lệ chuyển đổi","转化率","zhuǎnhuà lǜ","improve the conversion rate · a conversion rate of 3%","The new form doubled our conversion rate.","Form mới giúp tỷ lệ chuyển đổi tăng gấp đôi."],["cost per lead","n","chi phí mỗi khách tiềm năng","单个线索成本","dān gè xiànsuǒ chéngběn","lower the cost per lead · cost per lead target","Our cost per lead is well below the industry average.","Chi phí mỗi lead của chúng ta thấp hơn nhiều so với trung bình ngành."],["funnel","n","phễu marketing","营销漏斗","yíngxiāo lòudǒu","top of the funnel · move down the funnel","We lose most prospects in the middle of the funnel.","Chúng ta mất phần lớn khách ở giữa phễu."],["retargeting","n","tiếp thị lại","再营销","zài yíngxiāo","a retargeting campaign · retargeting ads","Retargeting brings back visitors who did not sign up.","Tiếp thị lại kéo về những người đã xem nhưng chưa đăng ký."],["A/B testing","n","thử nghiệm A/B","A/B测试","A/B cèshì","run A/B testing · A/B test a headline","A/B testing showed the shorter headline works better.","Thử nghiệm A/B cho thấy tiêu đề ngắn hiệu quả hơn."],["reach","n","số người tiếp cận","触达人数","chùdá rénshù","organic reach · expand reach","Organic reach has fallen sharply this year.","Lượng tiếp cận tự nhiên giảm mạnh trong năm nay."],["return on ad spend","n","lợi nhuận trên chi tiêu quảng cáo (ROAS)","广告支出回报率","guǎnggào zhīchū huíbào lǜ","measure return on ad spend · a ROAS of 4","Search ads deliver our highest return on ad spend.","Quảng cáo tìm kiếm mang lại ROAS cao nhất."],["creative","n","mẫu quảng cáo (hình, video)","广告素材","guǎnggào sùcái","refresh the creatives · ad creative","We rotate the creatives every two weeks.","Chúng tôi đổi mẫu quảng cáo hai tuần một lần."]],"sents":[["Our cost per lead dropped by 18% after we refreshed the creatives.","Chi phí mỗi lead giảm 18% sau khi chúng ta làm mới mẫu quảng cáo.","更新广告素材后，我们的单个线索成本下降了百分之十八。","Gēngxīn guǎnggào sùcái hòu, wǒmen de dān gè xiànsuǒ chéngběn xiàjiàng le bǎi fēn zhī shíbā.","Báo cáo hiệu quả"],["Most prospects drop off at the middle of the funnel.","Phần lớn khách tiềm năng rơi rụng ở giữa phễu.","大部分潜在客户在漏斗中段流失。","Dà bùfen qiánzài kèhù zài lòudǒu zhōngduàn liúshī.","Phân tích phễu"],["Let's run an A/B test before scaling the budget.","Hãy chạy thử A/B trước khi tăng ngân sách.","在扩大预算之前，我们先做一次A/B测试吧。","Zài kuòdà yùsuàn zhīqián, wǒmen xiān zuò yí cì A/B cèshì ba.","Đề xuất"],["The numbers look promising, but the sample is still too small.","Số liệu có vẻ khả quan, nhưng mẫu vẫn còn quá nhỏ.","数据看起来不错，但样本还是太小。","Shùjù kàn qǐlái búcuò, dàn yàngběn háishi tài xiǎo.","Thận trọng với dữ liệu"]]},{"id":"mk3","tier":3,"dom":"mk","title":"Strategy & positioning","vi":"Chiến lược và định vị","words":[["positioning","n","định vị","品牌定位","pǐnpái dìngwèi","brand positioning · a premium positioning","The project needs a sharper positioning.","Dự án cần định vị sắc nét hơn."],["value proposition","n","tuyên bố giá trị","价值主张","jiàzhí zhǔzhāng","a compelling value proposition · communicate the value proposition","Our value proposition is hassle-free ownership.","Giá trị chúng tôi đưa ra là sở hữu không phải lo vận hành."],["attribution","n","phân bổ nguồn chuyển đổi","归因","guīyīn","attribution model · last-click attribution","Attribution is tricky when buyers take months to decide.","Phân bổ rất khó khi người mua mất nhiều tháng để quyết định."],["customer lifetime value","n","giá trị vòng đời khách hàng","客户终身价值","kèhù zhōngshēn jiàzhí","increase customer lifetime value · lifetime value per client","Referrals raise customer lifetime value considerably.","Khách giới thiệu làm tăng đáng kể giá trị vòng đời khách hàng."],["market segmentation","n","phân khúc thị trường","市场细分","shìchǎng xìfēn","market segmentation strategy · segmentation by income","Market segmentation revealed an underserved expat niche.","Phân khúc thị trường cho thấy nhóm chuyên gia nước ngoài chưa được phục vụ tốt."],["brand equity","n","tài sản thương hiệu","品牌资产","pǐnpái zīchǎn","build brand equity · erode brand equity","Deep discounting can erode brand equity.","Giảm giá sâu có thể làm hao mòn tài sản thương hiệu."],["go-to-market strategy","n","chiến lược đưa sản phẩm ra thị trường","市场进入策略","shìchǎng jìnrù cèlüè","a go-to-market strategy · refine the go-to-market strategy","The go-to-market strategy starts with existing clients.","Chiến lược ra thị trường bắt đầu từ khách hàng hiện hữu."],["churn","n","tỷ lệ khách rời bỏ","客户流失","kèhù liúshī","reduce churn · churn rate","Better onboarding reduced churn among tenants.","Đón tiếp tốt hơn giúp giảm tỷ lệ khách thuê rời đi."]],"sents":[["Our positioning should speak to investors rather than end users.","Định vị của chúng ta nên hướng tới nhà đầu tư hơn là người mua ở thực.","我们的定位应该面向投资者，而不是自住买家。","Wǒmen de dìngwèi yīnggāi miànxiàng tóuzī zhě, ér bú shì zìzhù mǎijiā.","Họp chiến lược"],["Last-click attribution undervalues our awareness campaigns.","Phân bổ theo lần nhấp cuối đánh giá thấp các chiến dịch nhận biết.","末次点击归因低估了我们品牌宣传活动的价值。","Mòcì diǎnjī guīyīn dīgū le wǒmen pǐnpái xuānchuán huódòng de jiàzhí.","Tranh luận số liệu"],["What sets us apart is after-sales operation, not price.","Điểm khác biệt của chúng ta là vận hành sau bán hàng, không phải giá.","我们的差异化在于售后运营，而不是价格。","Wǒmen de chāyìhuà zàiyú shòuhòu yùnyíng, ér bú shì jiàgé.","Trình bày với đối tác"],["I'd push back on that assumption; the data tells a different story.","Tôi không đồng tình với giả định đó; dữ liệu cho thấy điều khác.","我不太认同这个假设，数据显示的情况并不一样。","Wǒ bú tài rèntóng zhège jiǎshè, shùjù xiǎnshì de qíngkuàng bìng bù yíyàng.","Phản biện lịch sự"]]},{"id":"fi1","tier":1,"dom":"fi","title":"Money basics at work","vi":"Tài chính cơ bản trong công việc","words":[["interest rate","n","lãi suất","利率","lìlǜ","a fixed interest rate · raise interest rates","The interest rate is fixed for the first year.","Lãi suất cố định trong năm đầu."],["loan","n","khoản vay","贷款","dàikuǎn","apply for a loan · repay a loan","She applied for a loan to expand the business.","Cô ấy xin vay để mở rộng kinh doanh."],["cash flow","n","dòng tiền","现金流","xiànjīn liú","positive cash flow · manage cash flow","Rental income gives the owner a steady cash flow.","Thu nhập cho thuê mang lại dòng tiền đều cho chủ nhà."],["revenue","n","doanh thu","收入","shōurù","annual revenue · generate revenue","Revenue rose twelve percent year on year.","Doanh thu tăng mười hai phần trăm so với cùng kỳ."],["profit margin","n","biên lợi nhuận","利润率","lìrùn lǜ","a thin profit margin · improve profit margins","Rising costs are squeezing our profit margin.","Chi phí tăng đang bóp nghẹt biên lợi nhuận."], er confidence is slowly recovering.","Niềm tin người tiêu dùng đang dần hồi phục."],["economic growth","n","tăng trưởng kinh tế","经济增长","jīngjì zēngzhǎng","sustain economic growth · slow economic growth","Exports are driving economic growth.","Xuất khẩu đang thúc đẩy tăng trưởng kinh tế."]],"sents":[["When supply is limited and demand keeps rising, prices go up.","Khi nguồn cung hạn chế mà nhu cầu cứ tăng, giá sẽ lên.","供给有限而需求不断上升时，价格就会上涨。","Gōngjǐ yǒuxiàn ér xūqiú búduàn shàngshēng shí, jiàgé jiù huì shàngzhǎng.","Giải thích cho khách"],["Inflation eats into people's savings.","Lạm phát ăn mòn tiền tiết kiệm của người dân.","通货膨胀会侵蚀人们的储蓄。","Tōnghuò péngzhàng huì qīnshí rénmen de chǔxù.","Lý do nên đầu tư"],["The exchange rate has been fairly stable this year.","Tỷ giá năm nay khá ổn định.","今年汇率比较稳定。","Jīnnián huìlǜ bǐjiào wěndìng.","Trò chuyện với khách nước ngoài"],["The economy grew faster than expected.","Kinh tế tăng trưởng nhanh hơn dự kiến.","经济增长速度超出预期。","Jīngjì zēngzhǎng sùdù chāochū yùqī.","Bình luận tin tức"]]},{"id":"ec2","tier":2,"dom":"ec","title":"Policy & cycles","vi":"Chính sách và chu kỳ","words":[["monetary policy","n","chính sách tiền tệ","货币政策","huòbì zhèngcè","tighten monetary policy · loose monetary policy","Monetary policy remains accommodative.","Chính sách tiền tệ vẫn đang nới lỏng."],["fiscal policy","n","chính sách tài khóa","财政政策","cáizhèng zhèngcè","expansionary fiscal policy · fiscal policy measures","Fiscal policy focuses on public investment.","Chính sách tài khóa tập trung vào đầu tư công."],["recession","n","suy thoái kinh tế","经济衰退","jīngjì shuāituì","enter a recession · a mild recession","Economists expect a mild recession.","Các nhà kinh tế dự báo một đợt suy thoái nhẹ."],["purchasing power","n","sức mua","购买力","gòumǎi lì","erode purchasing power · purchasing power parity","Rising prices erode purchasing power.","Giá tăng làm xói mòn sức mua."],["elasticity","n","độ co giãn","弹性","tánxìng","price elasticity · elasticity of demand","Luxury housing has low price elasticity.","Nhà ở cao cấp có độ co giãn theo giá thấp."],["opportunity cost","n","chi phí cơ hội","机会成本","jīhuì chéngběn","the opportunity cost of capital · weigh the opportunity cost","Consider the opportunity cost of leaving money in the bank.","Hãy tính chi phí cơ hội của việc để tiền trong ngân hàng."],["foreign direct investment","n","đầu tư trực tiếp nước ngoài (FDI)","外商直接投资","wàishāng zhíjiē tóuzī","attract foreign direct investment · FDI inflows","Foreign direct investment supports demand for industrial land.","FDI hỗ trợ nhu cầu đất công nghiệp."],["central bank","n","ngân hàng trung ương","中央银行","zhōngyāng yínháng","the central bank's decision · central bank independence","The central bank kept rates unchanged.","Ngân hàng trung ương giữ nguyên lãi suất."]],"sents":[["The central bank cut rates to stimulate borrowing.","Ngân hàng trung ương hạ lãi suất để kích thích vay vốn.","央行降息以刺激贷款。","Yāngháng jiàngxī yǐ cìjī dàikuǎn.","Bình luận chính sách"],["Looser monetary policy usually lifts property demand with a lag.","Chính sách tiền tệ nới lỏng thường kéo nhu cầu bất động sản lên, nhưng có độ trễ.","宽松的货币政策通常会滞后地提振房地产需求。","Kuānsōng de huòbì zhèngcè tōngcháng huì zhìhòu de tízhèn fángdìchǎn xūqiú.","Nhận định thị trường"],["The opportunity cost of holding cash is rising.","Chi phí cơ hội của việc giữ tiền mặt đang tăng.","持有现金的机会成本正在上升。","Chíyǒu xiànjīn de jīhuì chéngběn zhèngzài shàngshēng.","Tư vấn nhà đầu tư"],["Foreign direct investment keeps flowing into manufacturing.","Vốn FDI tiếp tục chảy vào ngành sản xuất.","外商直接投资持续流入制造业。","Wàishāng zhíjiē tóuzī chíxù liúrù zhìzào yè.","Bối cảnh vĩ mô"]]},{"id":"ec3","tier":3,"dom":"ec","title":"Advanced macro & micro","vi":"Vĩ mô và vi mô nâng cao","words":[["quantitative easing","n","nới lỏng định lượng","量化宽松","liànghuà kuānsōng","a round of quantitative easing · unwind quantitative easing","Quantitative easing pushed asset prices higher.","Nới lỏng định lượng đẩy giá tài sản lên cao."],["yield curve","n","đường cong lợi suất","收益率曲线","shōuyì lǜ qūxiàn","an inverted yield curve · a steep yield curve","Investors watch the yield curve for warning signs.","Nhà đầu tư theo dõi đường cong lợi suất để tìm tín hiệu cảnh báo."],["stagflation","n","đình lạm (lạm phát đi kèm trì trệ)","滞胀","zhìzhàng","the risk of stagflation · a period of stagflation","Stagflation leaves policymakers with few good options.","Đình lạm khiến nhà hoạch định chính sách có rất ít lựa chọn tốt."],["moral hazard","n","rủi ro đạo đức","道德风险","dàodé fēngxiǎn","create moral hazard · a moral hazard problem","Guarantees can create moral hazard among lenders.","Bảo lãnh có thể tạo rủi ro đạo đức ở bên cho vay."],["externality","n","ngoại ứng","外部性","wàibù xìng","a negative externality · internalise an externality","Traffic congestion is a negative externality of new development.","Tắc đường là ngoại ứng tiêu cực của dự án mới."],["price ceiling","n","giá trần","价格上限","jiàgé shàngxiàn","impose a price ceiling · a binding price ceiling","A price ceiling on rents can reduce supply.","Áp giá trần tiền thuê có thể làm giảm nguồn cung."],["marginal cost","n","chi phí biên","边际成本","biānjì chéngběn","marginal cost of production · equal to marginal cost","The marginal cost of adding one more floor is low.","Chi phí biên để xây thêm một tầng là thấp."],["soft landing","n","hạ cánh mềm","软着陆","ruǎn zhuólù","achieve a soft landing · hopes of a soft landing","Markets are pricing in a soft landing.","Thị trường đang phản ánh kỳ vọng hạ cánh mềm."]],"sents":[["An inverted yield curve has often preceded a recession.","Đường cong lợi suất đảo ngược thường xuất hiện trước suy thoái.","收益率曲线倒挂往往出现在经济衰退之前。","Shōuyì lǜ qūxiàn dàoguà wǎngwǎng chūxiàn zài jīngjì shuāituì zhīqián.","Phân tích chuyên sâu"],["Policymakers are trying to engineer a soft landing.","Các nhà hoạch định chính sách đang cố tạo một cú hạ cánh mềm.","决策者正努力实现经济软着陆。","Juécè zhě zhèng nǔlì shíxiàn jīngjì ruǎn zhuólù.","Bình luận vĩ mô"],["Pollution is a classic negative externality that the market fails to price.","Ô nhiễm là ngoại ứng tiêu cực điển hình mà thị trường không định giá được.","污染是典型的负外部性，市场无法为其定价。","Wūrǎn shì diǎnxíng de fù wàibù xìng, shìchǎng wúfǎ wèi qí dìngjià.","Thảo luận tác động môi trường"],["Bailouts can create moral hazard by rewarding excessive risk-taking.","Giải cứu có thể tạo rủi ro đạo đức vì thưởng cho hành vi mạo hiểm quá mức.","救助可能奖励过度冒险的行为，从而产生道德风险。","Jiùzhù kěnéng jiǎnglì guòdù màoxiǎn de xíngwéi, cóng'ér chǎnshēng dàodé fēngxiǎn.","Tranh luận chính sách"]]}],"reads":[{"id":"r-rates","tier":2,"dom":"ec","title":"Why interest rates move the housing market","vi":"Vì sao lãi suất làm thị trường nhà ở chuyển động","source":"Bài viết gốc của app, tổng hợp kiến thức kinh tế phổ thông","paras":[{"en":"Few numbers matter more to a housing market than the interest rate. Most buyers do not pay in cash; they borrow, and the cost of borrowing decides how much home they can afford. When a central bank raises its policy rate, commercial banks pass the increase on to borrowers. A family that could comfortably service a loan at six percent may struggle at ten, even though the price of the apartment has not changed at all.","vi":"Ít có con số nào quan trọng với thị trường nhà ở hơn lãi suất. Phần lớn người mua không trả bằng tiền mặt; họ đi vay, và chi phí vay quyết định họ mua nổi căn nhà cỡ nào. Khi ngân hàng trung ương tăng lãi suất điều hành, các ngân hàng thương mại chuyển mức tăng đó sang người vay. Một gia đình trả nợ thoải mái ở mức sáu phần trăm có thể chật vật ở mức mười, dù giá căn hộ không hề đổi."},{"en":"The effect, however, is rarely immediate. Buyers who have already signed contracts carry on, and developers keep building what they have started. It typically takes several quarters before higher rates show up as fewer transactions. Prices tend to react last of all, because owners are reluctant to sell for less than they paid. The first sign of a cooling market is therefore usually falling volume, not falling prices.","vi":"Tuy vậy, tác động hiếm khi đến ngay. Người đã ký hợp đồng vẫn tiếp tục, còn chủ đầu tư vẫn xây tiếp phần đã khởi công. Thường phải vài quý sau, lãi suất cao mới thể hiện thành số giao dịch giảm. Giá thường phản ứng sau cùng, vì chủ nhà không muốn bán thấp hơn giá mua. Vì thế dấu hiệu đầu tiên của thị trường hạ nhiệt thường là thanh khoản giảm, chứ không phải giá giảm."},{"en":"Rates also shape supply. Developers rely heavily on debt, so expensive credit squeezes their margins and delays new launches. Paradoxically, this can support prices later: when demand eventually recovers, there are fewer new homes to meet it. Investors who understand this lag often buy while sentiment is weak, accepting short-term uncertainty in exchange for a better entry price.","vi":"Lãi suất cũng định hình nguồn cung. Chủ đầu tư phụ thuộc nhiều vào vốn vay, nên tín dụng đắt đỏ bóp biên lợi nhuận và làm chậm các đợt mở bán mới. Nghịch lý là điều này có thể đỡ giá về sau: khi nhu cầu hồi phục thì lại có ít nhà mới để đáp ứng. Nhà đầu tư hiểu độ trễ này thường mua khi tâm lý còn yếu, chấp nhận bất định ngắn hạn để đổi lấy giá vào tốt hơn."}],"gloss":{"afford":"đủ khả năng chi trả","service":"trả (nợ) đều đặn","struggle":"chật vật","immediate":"ngay lập tức","transactions":"giao dịch","reluctant":"miễn cưỡng, không muốn","cooling":"hạ nhiệt","volume":"khối lượng giao dịch","squeezes":"bóp, siết","margins":"biên lợi nhuận","launches":"đợt mở bán","paradoxically":"nghịch lý thay","sentiment":"tâm lý thị trường","lag":"độ trễ","uncertainty":"sự bất định","borrow":"vay","borrowers":"người vay","credit":"tín dụng","recovers":"hồi phục","debt":"nợ"},"q":[{"t":"tfng","q":"Most home buyers pay the full price in cash.","a":"F","why":"Đoạn 1: \"Most buyers do not pay in cash; they borrow\"."},{"t":"tfng","q":"A rate rise can make a loan unaffordable even if the apartment price stays the same.","a":"T","why":"Đoạn 1: gia đình trả được ở 6% có thể chật vật ở 10% dù giá không đổi."},{"t":"tfng","q":"Prices are usually the first indicator to fall when the market cools.","a":"F","why":"Đoạn 2: giá phản ứng sau cùng; dấu hiệu đầu tiên là thanh khoản giảm."},{"t":"tfng","q":"Developers in Vietnam borrow more than developers in other countries.","a":"NG","why":"Bài không so sánh giữa các nước."},{"t":"mcq","q":"Why do prices tend to react last?","opts":["Banks delay passing on rate increases","Owners are unwilling to sell below what they paid","Developers stop building immediately","Buyers cancel signed contracts"],"a":1,"why":"Đoạn 2: \"owners are reluctant to sell for less than they paid\"."},{"t":"mcq","q":"According to the last paragraph, expensive credit can support prices later because","opts":["it reduces the number of new homes coming to market","it encourages banks to lend more","it attracts foreign investors","it lowers construction costs"],"a":0,"why":"Đoạn 3: tín dụng đắt làm chậm mở bán, nên khi cầu hồi phục thì ít nhà mới."},{"t":"gap","q":"The earliest sign of a cooling market is usually falling ___ rather than falling prices.","a":"volume","why":"Đoạn 2, câu cuối."},{"t":"gap","q":"Because developers depend on debt, costly credit squeezes their ___.","a":"margins","why":"Đoạn 3, câu 2."},{"t":"gap","q":"Investors who understand the ___ often buy while sentiment is weak.","a":"lag","why":"Đoạn 3, câu cuối."}]},{"id":"r-branded","tier":3,"dom":"re","title":"What makes a branded residence worth the premium?","vi":"Điều gì khiến căn hộ hàng hiệu đáng giá cao hơn?","source":"Bài viết gốc của app, tổng hợp kiến thức ngành","paras":[{"en":"A branded residence is a home sold under the name of a hotel group, a fashion house or another well-known brand. Buyers typically pay a noticeable premium over comparable unbranded units in the same location. Sceptics dismiss this as paying for a logo, yet the premium has proved remarkably persistent across very different markets, which suggests that buyers are purchasing something more tangible than a name.","vi":"Căn hộ hàng hiệu là nhà ở được bán dưới tên một tập đoàn khách sạn, nhà mốt hoặc thương hiệu nổi tiếng khác. Người mua thường trả cao hơn rõ rệt so với căn không gắn thương hiệu tương đương cùng vị trí. Người hoài nghi cho rằng đó là trả tiền cho cái logo, nhưng mức chênh này lại bền bỉ đáng kể ở những thị trường rất khác nhau, cho thấy người mua đang mua thứ gì đó hữu hình hơn một cái tên."},{"en":"The first thing they buy is certainty. A global operator imposes design and construction standards that a local developer must meet before the brand will lend its name. For an overseas investor who cannot inspect the site in person, that oversight works as a form of quality assurance. The second is service: housekeeping, maintenance and concierge teams trained by the operator keep the building in good condition long after handover, which in turn protects resale value.","vi":"Thứ đầu tiên họ mua là sự chắc chắn. Nhà vận hành toàn cầu đặt ra tiêu chuẩn thiết kế và xây dựng mà chủ đầu tư địa phương phải đạt thì thương hiệu mới cho gắn tên. Với nhà đầu tư nước ngoài không thể tự đến xem công trình, sự giám sát đó là một dạng bảo chứng chất lượng. Thứ hai là dịch vụ: đội buồng phòng, bảo trì và lễ tân do nhà vận hành đào tạo giữ tòa nhà trong tình trạng tốt rất lâu sau bàn giao, nhờ đó bảo vệ giá bán lại."},{"en":"There are costs, of course. Service charges are higher, and the management agreement may expire, leaving owners with an ordinary building and an expensive mortgage. Prudent buyers therefore read the agreement as carefully as the sales contract, checking how long the brand is committed and what happens if the operator withdraws. A brand can raise the ceiling on price, but only sound operation keeps it there.","vi":"Tất nhiên là có chi phí. Phí dịch vụ cao hơn, và hợp đồng quản lý có thể hết hạn, để lại cho chủ nhà một tòa nhà bình thường cùng khoản vay đắt đỏ. Vì vậy người mua thận trọng đọc hợp đồng quản lý kỹ như hợp đồng mua bán, kiểm tra thương hiệu cam kết bao lâu và điều gì xảy ra nếu nhà vận hành rút lui. Thương hiệu có thể nâng trần giá, nhưng chỉ vận hành tốt mới giữ được giá ở đó."}],"gloss":{"premium":"mức giá chênh cao hơn","comparable":"tương đương","sceptics":"người hoài nghi","dismiss":"gạt bỏ, coi nhẹ","persistent":"bền bỉ, kéo dài","tangible":"hữu hình, cụ thể","certainty":"sự chắc chắn","operator":"nhà vận hành","imposes":"áp đặt","oversight":"sự giám sát","assurance":"sự bảo đảm","concierge":"lễ tân, dịch vụ hỗ trợ cư dân","resale":"bán lại","expire":"hết hạn","prudent":"thận trọng","withdraws":"rút lui","ceiling":"mức trần","sound":"vững, tốt","inspect":"kiểm tra tận nơi","housekeeping":"dịch vụ buồng phòng"},"q":[{"t":"tfng","q":"The price premium for branded residences appears only in a few luxury markets.","a":"F","why":"Đoạn 1: mức chênh bền bỉ \"across very different markets\"."},{"t":"tfng","q":"The brand's standards must be met before its name can be used.","a":"T","why":"Đoạn 2: chủ đầu tư phải đạt chuẩn \"before the brand will lend its name\"."},{"t":"tfng","q":"Branded residences always sell faster than unbranded ones.","a":"NG","why":"Bài không nói về tốc độ bán."},{"t":"tfng","q":"Service charges in branded residences are lower because of the operator's scale.","a":"F","why":"Đoạn 3: \"Service charges are higher\"."},{"t":"mcq","q":"Why is the operator's oversight especially useful to overseas investors?","opts":["They receive a discount","They cannot visit the site themselves","They pay lower service charges","They can cancel the contract at any time"],"a":1,"why":"Đoạn 2: \"cannot inspect the site in person\"."},{"t":"mcq","q":"What does the writer advise careful buyers to do?","opts":["Avoid branded residences altogether","Negotiate lower service charges","Study the management agreement closely","Buy only after handover"],"a":2,"why":"Đoạn 3: đọc hợp đồng quản lý kỹ như hợp đồng mua bán."},{"t":"gap","q":"For buyers abroad, the operator's standards act as a form of quality ___.","a":"assurance","why":"Đoạn 2."},{"t":"gap","q":"Well-trained service teams help protect the ___ value of the property.","a":"resale","why":"Đoạn 2, câu cuối."},{"t":"gap","q":"If the management agreement were to ___, owners could be left with an ordinary building.","a":"expire","why":"Đoạn 3."}]}]}</script>
<script>
'use strict';
const DATA = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s), esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const H = 3600e3, D = 24 * H;
const TIER = {1: ['Cơ bản', 'B2 · công việc hằng ngày'], 2: ['Trôi chảy', 'C1 · đàm phán, báo cáo'], 3: ['Giao tiếp chuyên sâu', 'C1–C2 · thuật ngữ ngành']};
const DOM = {re: ['Bất động sản', 'var(--re)'], mk: ['Marketing', 'var(--mk)'], fi: ['Tài chính', 'var(--fi)'], ec: ['Kinh tế vi mô, vĩ mô', 'var(--ec)']};
const UNITS = DATA.units, UBY = Object.fromEntries(UNITS.map(u => [u.id, u]));
/* từ: [en,pos,vi,zh,py,colloc,ex,exvi] */
const WORDS = UNITS.flatMap(u => u.words.map(w => ({id: u.id + ':' + w[0], u: u.id, en: w[0], pos: w[1], vi: w[2], zh: w[3], py: w[4], co: w[5], ex: w[6], exvi: w[7]})));
const WBY = Object.fromEntries(WORDS.map(w => [w.id, w]));

/* ---------- state ---------- */
const KEY = 'en-v1';
let S = {cards: {}, weak: {}, nb: {}, packs: [], done: {}, tier: 1, days: {}, zh: 1, rate: 1, best: 0};
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function today(t = Date.now()){ const d = new Date(t); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function bump(n = 1){ S.days[today()] = (S.days[today()] || 0) + n; }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function reads(){ return [...DATA.reads, ...S.packs.filter(p => p.type === 'reading')]; }
function listens(){ return S.packs.filter(p => p.type === 'listening'); }

/* ---------- thẻ: cả từ giáo trình lẫn từ trong sổ ---------- */
function nbWord(k){ const n = S.nb[k]; return n && {id: 'nb:' + k, en: k, vi: n.m || '', nb: 1, ex: n.ctx || ''}; }
function getW(id){ return id.startsWith('nb:') ? nbWord(id.slice(3)) : WBY[id]; }
/* S.cards[id] = [khoảng cách (giờ), đến hạn, số lần quên] */
function nextIv(c, g){ const iv = c ? c[0] : 0; return g === 0 ? 0 : g === 1 ? Math.max(6, Math.round(iv * 1.2)) : g === 2 ? (iv ? Math.round(iv * 2.5) : 12) : (iv ? Math.round(iv * 3.5) : 48); }
function fmtIv(h){ if (!h) return '1 phút'; if (h < 24) return h + ' giờ'; const d = Math.round(h / 24); return d < 31 ? d + ' ngày' : Math.round(d / 30) + ' tháng'; }
function grade(id, g){
  const c = S.cards[id], iv = nextIv(c, g), now = Date.now();
  S.cards[id] = [iv, now + (iv ? iv * H : 60e3), (c ? c[2] : 0) + (g === 0 ? 1 : 0)];
  if (g === 0) S.weak[id] = [(S.weak[id] ? S.weak[id][0] : 0) + 1, 0];
  else if (g >= 2 && S.weak[id]){ if (++S.weak[id][1] >= 2) delete S.weak[id]; }
  bump(); save();
}
function dueIds(){ const now = Date.now(); return Object.keys(S.cards).filter(id => S.cards[id][1] <= now + H && getW(id)); }
function weakIds(){ return Object.keys(S.weak).filter(getW); }
function stOf(id){ const c = S.cards[id]; return !c ? '' : c[0] >= 24 * 7 ? 'k' : 'l'; }

/* ---------- giọng đọc ---------- */
let voices = [];
function loadVoices(){ try { voices = speechSynthesis.getVoices(); } catch (e) {} }
if ('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(lang){ const v = voices.filter(x => x.lang && x.lang.replace('_', '-').toLowerCase().startsWith(lang));
  const good = /Samantha|Daniel|Karen|Google US|Google UK|Natural|Aria|Jenny|Ting-?Ting|Lili|Xiaoxiao|Google 普通话/i; return v.find(x => good.test(x.name)) || v[0]; }
function speak(text, lang = 'en', rate, onend){
  if (!('speechSynthesis' in window)){ onend && onend(); return; }
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); const v = pickVoice(lang === 'zh' ? 'zh' : 'en');
  if (v){ u.voice = v; u.lang = v.lang; } else u.lang = lang === 'zh' ? 'zh-CN' : 'en-US';
  u.rate = rate || (lang === 'zh' ? 0.85 : S.rate || 1); if (onend) u.onend = onend; speechSynthesis.speak(u);
}

/* ---------- chữ chạm được + sổ từ ---------- */
function norm(w){ return w.toLowerCase().replace(/[’']/g, "'").replace(/^[^a-z0-9]+|[^a-z0-9]+$/g, ''); }

  for (const t of tries){ if (gl[t]) return gl[t]; const w = WORDS.find(x => x.en === t); if (w) return w.vi; } return ''; }

    return `<span class="tw ${S.nb[k] ? 'sv' : ''} ${gl && glossOf(k, gl) ? 'gl' : ''}" data-tw="${esc(k)}" data-ctx="${esc(ctxId || '')}">${m}</span>`; });
}

let F = null;

    ${w.co ? `<div class="note">${esc(w.co)}</div>` : ''}${w.ex ? `<div style="margin-top:6px">${esc(w.ex)}${w.exvi ? `<div class="note">${esc(w.exvi)}</div>` : ''}</div>` : ''}

}

/* ---------- nghe chép chính tả ---------- */
let Dc = null, ytP = null, ytTimer = null, ytReady = null;
function splitSents(t){ return t.replace(/\s+/g, ' ').match(/[^.!?]+[.!?]+["”’)]*|[^.!?]+$/g).map(s => s.trim()).filter(s => s.split(' ').length >= 3); }
function dictSrc(k){
  if (k.startsWith('u-')){ const u = UBY[k.slice(2)]; return u && {title: u.title, back: '#u-' + u.id, items: u.sents.map(s => ({en: s[0], vi: s[1]}))}; }
  if (k.startsWith('r-')){ const r = reads().find(x => x.id === k.slice(2)); return r && {title: r.title, back: '#doc-' + r.id, gl: r.gloss, items: r.paras.flatMap(p => splitSents(p.en).map(en => ({en})))}; }
  if (k.startsWith('l-')){ const l = listens().find(x => x.id === k.slice(2)); return l && {title: l.title, back: '#nghe', yt: l.yt, items: l.lines}; }
}
function startDict(k){ const s = dictSrc(k); Dc = s ? Object.assign(s, {k, i: 0, mode: Dc ? Dc.mode : 'full', st: {}}) : null; }
function toks(s){ return s.split(/\s+/).filter(Boolean); }
function dState(){ const z = Dc; return z.st[z.i] || (z.st[z.i] = {typed: '', hint: 0, done: false, ok: null, gaps: null, gv: {}}); }

  while (pick.length < n && pool.length){ seed = (seed * 9301 + 49297) % 233280; pick.push(pool.splice(seed % pool.length, 1)[0]); } return pick.sort((a, b) => a - b); }
function lcsMark(target, typed){ const a = target.map(norm), b = typed.map(norm), n = a.length, m = b.length, dp = [...Array(n + 1)].map(() => Array(m + 1).fill(0));
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) dp[i][j] = a[i - 1] && a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
  const mk = Array(n).fill(false); let i = n, j = m; while (i > 0 && j > 0){ if (a[i - 1] && a[i - 1] === b[j - 1] && dp[i][j] === dp[i - 1][j - 1] + 1){ mk[i - 1] = true; i--; j--; } else if (dp[i - 1][j] >= dp[i][j - 1]) i--; else j--; }
  a.forEach((x, k) => { if (!x) mk[k] = true; }); return mk; }
function playLine(slow){
  const z = Dc, it = z.items[z.i]; if (!it) return;
  if (z.yt && ytP && ytP.seekTo){ clearInterval(ytTimer); try { ytP.setPlaybackRate(slow ? 0.75 : 1); } catch (e) {} ytP.seekTo(it.s, true); ytP.playVideo();
    const end = it.e != null ? it.e : it.s + 6; ytTimer = setInterval(() => { try { if (ytP.getCurrentTime() >= end){ ytP.pauseVideo(); clearInterval(ytTimer); } } catch (e) { clearInterval(ytTimer); } }, 120); }
  else if (!z.yt) speak(it.en, 'en', slow ? 0.7 : S.rate || 1);
}
function ensureYT(id){
  if (!ytReady) ytReady = new Promise(res => { if (window.YT && YT.Player) return res(); window.onYouTubeIframeAPIReady = res; const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.onerror = () => { const e = $('#ytmsg'); if (e) e.textContent = 'Không tải được YouTube. Kiểm tra mạng rồi mở lại.'; }; document.head.appendChild(s); });
  ytReady.then(() => { if (!$('#ytp') || !Dc || Dc.yt !== id) return; ytP = new YT.Player('ytp', {videoId: id, playerVars: {playsinline: 1, rel: 0, modestbranding: 1, start: Math.floor((Dc.items[Dc.i] || {s: 0}).s)}, events: {}}); });
}
function viewDict(){
  const z = Dc; if (!z || !z.items.length) return `<div class="card done"><h2>Không có nội dung để nghe</h2><a class="btn" href="#nghe">Quay lại</a></div>`;
  const it = z.items[z.i], st = dState(), t = toks(it.en); sheetGl = z.gl || {};

    if (d.dnext !== undefined || d.dskip !== undefined){ if (Dc.i + 1 < Dc.items.length){ Dc.i++; return viewKeepYT(true); } location.hash = Dc.back; return; }

  }

  if (d.impread !== undefined){ const txt = ($('#itxt').value || '').trim(); if (txt.length < 40){ impMsg = 'Nội dung quá ngắn.'; return render(); }

  if (d.impyt !== undefined){ const id = ytId($('#yurl').value || ''), lines = parseTranscript($('#ysub').value || ''); if (!id){ impMsg = 'Link YouTube không hợp lệ.'; return render(); } if (lines.length < 2){ impMsg = 'Không đọc được phụ đề. Phụ đề cần có mốc thời gian (0:06 hoặc định dạng .srt).'; return render(); }
    const pid = 'y' + id; addPack({type: 'listening', id: pid, title: ($('#ytit').value || '').trim() || 'Video ' + id, yt: id, lines}); location.hash = 'dict-l-' + pid; return; }
  if (d.delpack){ S.packs = S.packs.filter(p => p.id !== d.delpack); save(); return render(); }
});
