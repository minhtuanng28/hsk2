<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<title>Học viện của Tuấn</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: playful toy-island campus, calm and focused as a study + work tool
   IDEA: a symmetrical voxel campus where every building is a room you walk into
   PICTURE: full-screen isometric 3D world lit by the real clock
   COLOUR and TYPE: grass green world, ninja-red accent, ink-blue support; Be Vietnam Pro
   LAYOUT: world fills the screen; slim HUD in corners; room drawer right, bottom sheet on phones */
:root{color-scheme:light dark;--panel:light-dark(rgba(255,252,246,.95),rgba(22,26,36,.95));--solid:light-dark(#fffcf6,#161a24);--ink:light-dark(#1d1b18,#f2efe8);--mute:light-dark(#6b665d,#a8a397);--line:light-dark(#e8e0d2,#2d3344);--chip:light-dark(#f3ece0,#232a39);--acc:#e8553a;--acc2:#2f5fd0;--ok:#1f9e6a;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#0b1633;color:var(--ink);font:15px/1.5 'Be Vietnam Pro',system-ui,sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
#sky{position:fixed;inset:0}
#stars{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.5s}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:4px 9px 5px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.16);pointer-events:auto;cursor:pointer;will-change:transform}
.tag small{display:block;font-weight:500;color:var(--mute);font-size:10.5px;line-height:1.3}
.tag .bar{height:3px;border-radius:3px;background:var(--line);margin-top:3px;overflow:hidden}.tag .bar i{display:block;height:100%;background:var(--c)}
.tag.me{background:var(--acc);color:#fff;border:0;padding:2px 7px;font-size:10.5px;cursor:default}
.tag.arch{background:#1d2a4d;color:#fff;border:0;cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(10,20,40,.2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#hud-tl{position:fixed;left:calc(12px + var(--sl));top:calc(12px + var(--st));padding:9px 12px;width:min(272px,calc(100vw - 88px))}
.brand{display:flex;align-items:center;gap:9px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--acc);position:relative;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.logo:before{content:"";position:absolute;left:5px;right:5px;top:8px;height:10px;border-radius:4px;background:#f7d3bd}
.logo:after{content:"";position:absolute;left:10px;top:11px;width:2px;height:4px;background:#222;box-shadow:6px 0 #222}
.brand h1{font-size:14px;line-height:1.15;margin:0;font-weight:800}
.brand .clk{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.brand .clk b{color:var(--ink);font-weight:800;font-size:13px}
#nowchip{display:block;width:100%;text-align:left;margin-top:8px;background:var(--chip);border:0;border-radius:10px;padding:6px 9px;cursor:pointer;font-size:12.5px;line-height:1.3}
#nowchip em{font-style:normal;font-size:10.5px;font-weight:700;color:var(--acc);display:block}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:7px}
.stats div{background:var(--chip);border-radius:9px;padding:4px 6px}
.stats span{display:block;font-size:9.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats b{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
#hud-tr{position:fixed;right:calc(12px + var(--sr));top:calc(12px + var(--st));display:flex;flex-direction:column;gap:7px;align-items:flex-end;transition:right .3s}
body.popen #hud-tr{right:min(450px,calc(100vw - 60px))}
.ib{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(10,20,40,.18);font-weight:800;font-size:12.5px;padding:0}
.ib[hidden]{display:none}
.ib svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:focus-visible,.btn:focus-visible,button:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
#savebadge{font-size:10.5px;color:#fff;background:rgba(0,0,0,.35);padding:2px 8px;border-radius:20px;white-space:nowrap}
#lightpop{position:fixed;right:calc(66px + var(--sr));top:calc(60px + var(--st));padding:14px;width:240px;display:none}
#lightpop.on{display:block}
#lightpop label{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600}
#lightpop input[type=range]{width:100%;margin-top:10px;accent-color:var(--acc)}
#lightpop p{margin:6px 0 0;font-size:12px;color:var(--mute)}
#pomo{position:fixed;left:calc(12px + var(--sl));bottom:calc(12px + var(--sb));padding:8px 10px;display:flex;gap:10px;align-items:center;width:min(310px,calc(100vw - 24px))}
.ring{position:relative;width:54px;height:54px;flex:none}
.ring svg{width:54px;height:54px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .trk{stroke:var(--line)}.ring .prg{stroke:var(--acc);stroke-linecap:round;stroke-dasharray:175.9;transition:stroke-dashoffset .3s}
#pomo.brk .ring .prg{stroke:var(--ok)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}
.pc{flex:1}
.pm{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
.pm b{color:var(--ink);white-space:nowrap}
.pm select{border:1px solid var(--line);background:var(--solid);border-radius:8px;padding:2px 4px;font-size:12.5px;flex:1}
.pbtns{display:flex;gap:6px;margin-top:5px}
.btn{min-height:36px;padding:0 13px;border-radius:11px;border:1px solid var(--line);background:var(--solid);cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:inherit}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{min-height:32px;padding:0 10px;font-size:12.5px;border-radius:9px}
#dock{position:fixed;right:calc(12px + var(--sr));bottom:calc(12px + var(--sb));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:min(560px,calc(100vw - 350px))}
#dock button{border:1px solid var(--line);background:var(--panel);border-radius:11px;min-height:36px;padding:0 11px;font-weight:700;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 6px 16px rgba(10,20,40,.15);white-space:nowrap;flex:none}
#dock i{width:9px;height:9px;border-radius:3px;background:var(--c)}
#prompt{position:fixed;left:50%;bottom:calc(84px + var(--sb));transform:translateX(-50%);padding:8px 8px 8px 14px;display:none;align-items:center;gap:10px;max-width:calc(100vw - 24px)}
#prompt.on{display:flex}
#prompt span{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
kbd{font:700 11px 'Be Vietnam Pro';border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:1px 6px;color:var(--mute)}
#help{position:fixed;left:50%;top:calc(16px + var(--st));transform:translateX(-50%);font-size:12px;color:#fff;background:rgba(0,0,0,.35);padding:5px 12px;border-radius:20px;white-space:nowrap;pointer-events:none;max-width:calc(100vw - 700px);overflow:hidden;text-overflow:ellipsis;transition:opacity 1s}
#help.off{opacity:0}
#joy{position:fixed;left:calc(18px + var(--sl));bottom:calc(150px + var(--sb));width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.45);display:none;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 4px 12px rgba(0,0,0,.2)}
body.touch #joy{display:block}
body.popen #joy{display:none}
#panel{position:fixed;right:calc(12px + var(--sr));top:calc(12px + var(--st));bottom:calc(12px + var(--sb));width:min(430px,calc(100vw - 24px));overflow-y:auto;transform:translateX(calc(100% + 40px));transition:transform .35s cubic-bezier(.2,.8,.2,1);padding:0 0 18px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#panel.open{transform:none}
.ph{position:sticky;top:0;z-index:2;background:var(--solid);display:flex;gap:12px;align-items:center;padding:14px 14px 11px;border-bottom:1px solid var(--line);border-radius:16px 16px 0 0}
.pk{width:42px;height:42px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15)}
.ph h2{margin:0;font-size:17px;line-height:1.2}
.ph p{margin:2px 0 0;font-size:12px;color:var(--mute)}
.ph .x{margin-left:auto;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:transparent;font-size:22px;cursor:pointer;flex:none}
.grab{display:none}
.st{font-weight:700;padding:1px 7px;border-radius:20px;font-size:11px;background:var(--chip);white-space:nowrap}
.st-now{background:#e8553a22;color:var(--acc)}.st-done{background:#1f9e6a22;color:var(--ok)}.st-past{background:#e3a21a26;color:#b07a0a}
.pb{padding:12px 14px 0}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.stats3 div{background:var(--chip);border-radius:11px;padding:7px 9px}
.stats3 span{display:block;font-size:11px;color:var(--mute)}
.stats3 b{font-size:17px;font-variant-numeric:tabular-nums}
.pbar{height:7px;border-radius:5px;background:var(--line);margin:9px 0 2px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--c);border-radius:5px}
.tabs{display:flex;gap:4px;margin:12px 0 10px;background:var(--chip);padding:4px;border-radius:12px;overflow-x:auto}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;min-height:36px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;padding:0 8px;color:var(--mute)}
.tabs button.on{background:var(--solid);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.list li{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:var(--solid)}
.list li.done .lt{text-decoration:line-through;color:var(--mute)}
.list input[type=checkbox]{width:20px;height:20px;margin:1px 0 0;accent-color:var(--c,var(--acc));flex:none}
.lt{flex:1;font-size:14px;line-height:1.4}
.lt a{color:var(--acc2);font-weight:600;text-decoration:none}
.lt a:hover{text-decoration:underline}
.lt small{display:block;color:var(--mute);font-size:12px}
.del{border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:18px;line-height:1;width:30px;height:30px;border-radius:8px;flex:none}
.del:hover{background:var(--chip);color:var(--acc)}
.add{display:grid;gap:6px;margin-top:10px;padding:10px;border:1px dashed var(--line);border-radius:12px}
.add input,.add select,textarea,.inp{width:100%;border:1px solid var(--line);background:var(--solid);border-radius:10px;padding:8px 10px;font-size:16px}
.add .row{display:flex;gap:6px}
textarea{min-height:170px;resize:vertical;line-height:1.5;font-size:15px}
.sec{margin-top:14px}
.sec h3{font-size:13px;margin:0 0 8px;color:var(--mute);font-weight:700;display:flex;justify-content:space-between;gap:8px}
.box{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--solid);font-size:13.5px}
.box p{margin:2px 0}
.gate{display:flex;gap:10px;align-items:flex-start}
.gate input{width:22px;height:22px;accent-color:var(--ok);flex:none}
.logrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px}
.logrow span{font-size:12.5px;color:var(--mute);margin-right:2px}
.empty{color:var(--mute);font-size:13px;padding:10px;border:1px dashed var(--line);border-radius:12px}
.note{font-size:11.5px;color:var(--mute);margin-top:10px}
.week{display:grid;gap:6px}
.wd{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;align-items:start;padding:8px 10px;border-radius:12px;background:var(--solid);border:1px solid var(--line)}
.wd.today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.wd>b{font-size:13px}
.blk{display:flex;gap:7px;font-size:13px;padding:2px 0;align-items:baseline;flex-wrap:wrap}
.blk time{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;min-width:88px}
.blk i{width:8px;height:8px;border-radius:2px;background:var(--c);flex:none;align-self:center}
.blk.cur{color:var(--acc);font-weight:700}
.blk span{flex:1}
.blk a{font-size:11.5px;color:var(--acc2);font-weight:700;text-decoration:none;white-space:nowrap}
.rm{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--solid)}
.rm .pk{width:34px;height:34px;font-size:13px;border-radius:10px}
.rm>div{flex:1}
.rm .pbar{margin:5px 0 0;height:6px}
.bars{display:grid;gap:7px}
.bars div{display:grid;grid-template-columns:96px minmax(0,1fr) 64px;gap:8px;align-items:center;font-size:12.5px}
.bars s{display:block;height:10px;border-radius:5px;background:var(--c);text-decoration:none;min-width:2px}
.bars em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.big{font-size:42px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid3 label{font-size:12px;color:var(--mute);display:grid;gap:4px}
.col{margin-top:12px}
.col h4{margin:0 0 6px;font-size:12.5px;display:flex;gap:6px;align-items:center}
.col h4 i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.col h4 em{font-style:normal;color:var(--mute);font-weight:600}
.col ul{min-height:44px;border-radius:12px;padding:4px;background:var(--chip)}
.col ul.over{outline:2px dashed var(--acc2)}
.list li.kc{display:block;padding:8px 10px;border-radius:10px;background:var(--solid);border:1px solid var(--line);margin:4px 0;cursor:grab;font-size:13.5px}
.kc .km{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;align-items:center}
.chipx{font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;background:var(--chip);white-space:nowrap}
.chipx.late{background:#e8553a22;color:var(--acc)}
.kc .mv{margin-left:auto;display:flex;gap:2px}
.kc .mv button{border:1px solid var(--line);background:transparent;border-radius:7px;width:28px;height:26px;cursor:pointer;font-weight:800;color:var(--mute)}
.post{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--solid);margin:5px 0}
.post select{border:1px solid var(--line);border-radius:8px;background:var(--solid);font-size:12.5px;padding:3px 4px}
.dh{font-size:12px;font-weight:800;color:var(--mute);margin:12px 0 2px}
.dh.today{color:var(--acc)}
.tpl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tpl button{min-height:46px;text-align:left;padding:6px 10px;border-radius:11px;border:1px solid var(--line);background:var(--solid);cursor:pointer;font-weight:700;font-size:12.5px;line-height:1.3}
.tpl button small{display:block;font-weight:500;color:var(--mute);font-size:11px}
.res{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--solid);border-radius:11px;padding:8px 10px;margin:5px 0;cursor:pointer;font-size:13.5px}
.res small{display:block;color:var(--mute);font-size:11.5px}
.res mark{background:#ffd84a88;color:inherit;border-radius:3px}
#toast{position:fixed;left:50%;top:calc(14px + var(--st));transform:translate(-50%,-160%);background:#1d2a4d;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;transition:transform .35s;z-index:40;max-width:calc(100vw - 28px);text-align:center}
#toast.on{transform:translate(-50%,0)}
#fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font-weight:700;background:#0b1633;transition:opacity .6s;z-index:50}
#loading.off{opacity:0;pointer-events:none}
#gate{position:fixed;inset:0;z-index:45;display:none;place-items:center;background:linear-gradient(#7db4e4,#bfe3a1);padding:20px}
#gate.on{display:grid}
#gate .card{max-width:380px;width:100%;padding:26px 22px;text-align:center}
#gate .logo{width:64px;height:64px;border-radius:18px;margin:0 auto 12px}
#gate .logo:before{left:11px;right:11px;top:19px;height:22px;border-radius:8px}
#gate .logo:after{left:23px;top:26px;width:4px;height:8px;box-shadow:14px 0 #222}
#gate h2{margin:0 0 6px;font-size:22px}
#gate p{margin:0 0 16px;color:var(--mute);font-size:14px}
#gate .btn{width:100%;min-height:46px;font-size:15px}
#gate small{display:block;margin-top:12px;color:var(--mute);font-size:12px}
@media (max-width:1100px){#help{display:none}}
@media (max-width:900px){#dock{max-width:none;left:calc(12px + var(--sl));right:calc(12px + var(--sr));bottom:calc(84px + var(--sb));justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}#dock::-webkit-scrollbar{display:none}#prompt{bottom:calc(132px + var(--sb))}#joy{bottom:calc(184px + var(--sb))}}
@media (max-width:700px){
 #hud-tl{padding:8px 10px;width:calc(100vw - 80px)}
 .stats{display:none}
 #pomo{width:calc(100vw - 24px)}
 .ib{width:40px;height:40px}
 #panel{top:auto;left:0;right:0;bottom:0;width:100%;height:86vh;height:86dvh;border-radius:20px 20px 0 0;transform:translateY(105%);padding-bottom:calc(18px + var(--sb))}
 #panel.open{transform:none}
 .grab{display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto -6px;position:relative;top:6px}
 body.popen #hud-tr{right:calc(12px + var(--sr))}
 body.popen #pomo,body.popen #dock,body.popen #prompt{display:none}
 #lightpop{right:calc(62px + var(--sr));top:calc(12px + var(--st))}
 .bars div{grid-template-columns:78px minmax(0,1fr) 54px}
 .tag{font-size:11px;padding:3px 7px 4px}.tag small{font-size:9.5px}
}
@media (min-width:701px){body.popen #dock,body.popen #help{display:none}}
@media (prefers-reduced-motion:reduce){#panel,#toast,#hud-tr{transition:none}}
</style>

<body>
<div id="sky"></div><div id="stars"></div>
<canvas id="c" tabindex="0" aria-label="Bản đồ học viện 3D"></canvas>
<div id="labels"></div>
<div id="fade"></div>

<section id="hud-tl" class="card">

 return{learned:ids.length,known:ids.filter(i=>(HSK.cards[i][2]||0)>=168).length,due:ids.filter(i=>(HSK.cards[i][3]||0)<=now+3*36e5).length,xp:HSK.xp||0,streak:st,today:days[hDay()]||0,books};

{const j=$('#joy'),kn=j.querySelector('i');let jid=null;

/* loop */
const tgt=new THREE.Vector3(P.x,0,P.z);let last=performance.now(),walkT=0,tick=0;
const UP=new THREE.Vector3(-CAM_OFF.x,0,-CAM_OFF.z).normalize(),RT=new THREE.Vector3(-UP.z,0,UP.x);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 let mx=0,mz=0;
 if(keys.has('w')||keys.has('arrowup')){mx+=UP.x;mz+=UP.z}
 if(keys.has('s')||keys.has('arrowdown')){mx-=UP.x;mz-=UP.z}
 if(keys.has('d')||keys.has('arrowright')){mx+=RT.x;mz+=RT.z}
 if(keys.has('a')||keys.has('arrowleft')){mx-=RT.x;mz-=RT.z}
 if(joyV.x||joyV.y){mx+=RT.x*joyV.x-UP.x*joyV.y;mz+=RT.z*joyV.x-UP.z*joyV.y}
 if(!mx&&!mz&&walk){const dx=walk.x-P.x,dz=walk.z-P.z,d=Math.hypot(dx,dz);
  if(d<.18){const id=walk.room;walk=null;if(id)openRoom(id)}else{mx=dx/d;mz=dz/d}}
 const ml=Math.hypot(mx,mz);let moving=false;
 if(ml>.05){const sc=Math.min(1,ml);mx/=ml;mz/=ml;const sp=4.4*dt*sc,ox=P.x,oz=P.z;
  if(walkable(P.x+mx*sp,P.z))P.x+=mx*sp;if(walkable(P.x,P.z+mz*sp))P.z+=mz*sp;
  const moved=Math.hypot(P.x-ox,P.z-oz);moving=moved>.001;
  P.rot=Math.atan2(mx,mz);
  if(walk){if(moved<sp*.25){walk.stuck+=dt;if(walk.stuck>.45){const id=walk.room;walk=null;if(id)goRoom(id)}}else walk.stuck=0}}
 player.position.set(P.x,0,P.z);
 let dr=P.rot-player.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));player.rotation.y+=dr*Math.min(1,dt*14);
 if(moving){walkT+=dt*11;legs[0].rotation.x=Math.sin(walkT)*.7;legs[1].rotation.x=-Math.sin(walkT)*.7;body.position.y=.72+(reduce?0:Math.abs(Math.sin(walkT))*.05)}
 else{legs[0].rotation.x*=.8;legs[1].rotation.x*=.8;body.position.y=.72+(reduce?0:Math.sin(now/600)*.012)}
 const off=(panelState&&innerWidth>700)?(cam.right-cam.left)/innerWidth*215:0,offY=(panelState&&innerWidth<=700)?(cam.top-cam.bottom)/innerHeight*innerHeight*.28:0;
 tgt.lerp(v3.set(P.x+RT.x*off-UP.x*offY,0,P.z+RT.z*off-UP.z*offY),Math.min(1,dt*5));cam.position.copy(tgt).add(CAM_OFF);cam.lookAt(tgt);
 meTag.pos.set(P.x,1.55,P.z);
 if(ring.material.opacity>0)ring.material.opacity=Math.max(0,ring.material.opacity-dt*.6);
 if(!reduce&&tick%2===0){const p=riverGeo.attributes.position,a=p.array;for(let i=0;i<a.length;i+=3)a[i+2]=Math.sin(rBase[i]*.9+now/700)*.04+Math.cos(rBase[i+1]*2+now/900)*.02;p.needsUpdate=true}
 let nb=null,nd=1.7;for(const r of ROOMS){const d=Math.hypot(P.x-r.door[0],P.z-r.door[1]);if(d<nd){nd=d;nb=r}}
 if(nb!==near){near=nb;const pr=$('#prompt');if(near&&!panelState){$('#ptxt').textContent=tr(near.title);pr.classList.add('on')}else pr.classList.remove('on')}
 if(window.__pend)window.__pend.rotation.z=reduce?0:Math.sin(now/1000*Math.PI)*.2;
 if(window.__fire&&tick%2===0){const f=window.__fire,b=f.light.userData.base||5;f.light.intensity=b*(.86+Math.sin(now/83)*.08+Math.sin(now/31)*.06);f.g.scale.y=1+Math.sin(now/110)*.14}
 if(window.__cat)window.__cat.scale.y=1+Math.sin(now/700)*.04;
 if(window.__globe)window.__globe.rotation.y+=dt*.15;
 if(window.__dust&&!reduce){window.__dust.position.y=Math.sin(now/2600)*.15;window.__dust.rotation.y=Math.sin(now/5000)*.01}
 if(window.__boat){window.__boat.position.y=-1.05+Math.sin(now/900)*.06;window.__boat.rotation.z=Math.sin(now/1300)*.05}
 if(window.__foam&&tick%3===0)window.__foam.material.opacity=.45+Math.sin(now/700)*.15;
 if(++tick%30===0)applyLight(hourNow());
 placeTags();
 renderer.render(scene,cam);
 requestAnimationFrame(frame);
}

let swReg=null;
if(ON_PAGES&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').then(r=>swReg=r).catch(()=>{});
let actx=null;
function ensureAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function chime(){if(!actx)return;try{const t0=actx.currentTime;[[660,0],[880,.2],[1320,.4]].forEach(([f,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t0+d);g.gain.linearRampToValueAtTime(.2,t0+d+.02);g.gain.exponentialRampToValueAtTime(.001,t0+d+.6);o.connect(g).connect(actx.destination);o.start(t0+d);o.stop(t0+d+.65)})}catch(e){}}
function notify(title,body){
 toast(body);chime();if(!S.settings.notify)return;
 try{if(window.Notification&&Notification.permission==='granted'){if(swReg&&swReg.showNotification)swReg.showNotification(title,{body,icon:'icon-192.png',badge:'icon-192.png',tag:title+body});else new Notification(title,{body,icon:'icon-192.png'})}}catch(e){}
}
async function askNotify(){ensureAudio();try{if(!window.Notification){toast(t('notifyNo'));return}const p=await Notification.requestPermission();toast(p==='granted'?t('notifyOk'):t('notifyNo'));if(p==='granted'){S.settings.notify=true;save()}renderPanel()}catch(e){toast(t('notifyNo'))}}

 h+=`<div class="pb">${all.length?`<ul class="list">${all.map(([id,c])=>`<li style="--c:${RM[id].hex}"><div class="lt">${linkOrText(c.t,safeUrl(c.url))}<small>${esc(tr(RM[id].title))}${c.date?' · '+esc(c.date):''}</small></div><button class="del" data-act="delCA" data-room="${id}" data-id="${c.id}" aria-label="${t('del')}">×</button></li>`).join('')}</ul>`:`<div class="empty">${t('noCerts')}</div>`}
 <div class="add"><select name="r" aria-label="${t('room')}">${['me1','me2','me3','me4','zh'].map(id=>`<option value="${id}">${esc(tr(RM[id].title))}</option>`).join('')}</select><input name="t" placeholder="${t('cname')}"><input name="u" placeholder="${t('link')}" inputmode="url"><div class="row"><input name="d" type="date" aria-label="${t('cdate')}"><button class="btn sm pri" data-act="addCA">${t('add')}</button></div></div></div>`;
 return h;
}
function settingsPanel(){
 const perm=window.Notification?Notification.permission:'unsupported';
 let h=head('#1d2a4d','≡',t('settings'),ON_PAGES&&fb&&fb.user?esc(fb.user.email||''):'');
 h+=`<div class="pb"><div class="sec" style="margin-top:0"><h3>${t('theme')}</h3><div class="tpl">${['campus','beach','library'].map(v=>`<button data-act="theme" data-v="${v}" style="${THEME0===v?'border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset':''}">${t('th_'+v)}<small>${THEME0===v?'✓':''}</small></button>`).join('')}</div></div>
 <div class="sec"><h3>${t('install')}</h3><div class="box"><p>${t('installWhy')}</p><p style="margin-top:8px"><button class="btn sm pri" data-act="install">${t('install')}</button></p><p class="note">${t('installHow')}</p></div></div>
 <div class="sec"><h3>${t('notify')}</h3><div class="box"><label class="gate"><input type="checkbox" data-act="setn" ${S.settings.notify?'checked':''}><span>${t('notifyOn')}</span></label>
 <div class="logrow"><label style="font-size:12.5px;color:var(--mute);display:flex;gap:6px;align-items:center">${t('notifyBefore')}<input class="inp" style="width:72px" type="number" min="0" max="60" data-act="setb" value="${S.settings.before}"></label><button class="btn sm ${perm==='granted'?'':'pri'}" data-act="askN">${perm==='granted'?t('notifyOk'):t('notifyAsk')}</button></div>
 <p class="note">${t('notifyIOS')}</p></div></div>
 <div class="sec"><h3>${t('pomoLen')}</h3><div class="grid3">${['focus','brk','lbrk'].map(k=>`<label>${t(k)}<input class="inp" type="number" min="1" max="180" data-act="plen" data-k="${k}" value="${S.settings[k]}"></label>`).join('')}</div></div>
 <div class="sec"><h3>${t('appLink')}</h3><input class="inp" data-act="zhurl" value="${esc(S.settings.zhUrl)}" inputmode="url"></div>
 <div class="sec"><h3>${t('export')}</h3><p class="note" style="margin:0 0 6px">${t('exportHint')}</p><textarea id="exp" style="min-height:110px;font-size:12px;font-family:ui-monospace,monospace">${esc(JSON.stringify(S))}</textarea><div class="logrow"><button class="btn sm" data-act="copy">${t('copy')}</button><button class="btn sm" data-act="import">${t('import')}</button><button class="btn sm" data-act="resetAll" style="margin-left:auto;color:var(--acc)">${t('resetAll')}</button></div></div></div>`;
 return h;
}
function acctPanel(){
 let h=head('#2f5fd0','G',t('acct'),ON_PAGES?(fb&&fb.user?esc(fb.user.email||''):t('saveLocal')):t('saveCloud'));
 h+=`<div class="pb">`;
 if(ON_PAGES){
  if(fb&&fb.user)h+=`<div class="box"><p>${t('signedAs')} <b>${esc(fb.user.email||fb.user.displayName||'')}</b></p><p style="margin-top:8px;color:var(--mute)">${t('acctWhy')}</p></div><div class="logrow"><button class="btn sm" data-act="hskRefresh">${t('refresh')}</button><button class="btn sm" data-act="signOut">${t('signOut')}</button></div>`;
  else h+=`<div class="box"><p>${t('acctWhy')}</p><p style="margin-top:10px"><button class="btn pri" data-act="signIn">${t('signIn')}</button></p></div>`;
 }else h+=`<div class="box"><p>${t('acctArtifact')}</p><p style="margin-top:10px"><a class="btn pri" href="${PAGES_URL}" target="_blank" rel="noopener">${t('openPages')} ↗</a></p></div>`;
 if(ON_PAGES&&fb&&fb.user)h+=`<p class="note">${t('syncNote')}</p>`;
 if(ON_PAGES&&cloudErr)h+=`<p class="note" style="color:var(--acc)">${esc(cloudErr)}</p>`;
 if(acctMsg)h+=`<p class="note" style="color:var(--acc)">${esc(acctMsg)}</p>`;
 return h+`</div>`;
}
function findPanel(){
 return head('#1d2a4d','⌕',t('find'),'')+`<div class="pb"><input class="inp" id="fq" data-act="fq" value="${esc(panelState.q||'')}" placeholder="${t('findPh')}" autocomplete="off" enterkeyhint="search"><div id="fres">${findResults()}</div></div>`;
}
function findResults(){
 const q=(panelState.q||'').trim().toLowerCase();let h='';
 if(q){
  const res=[],hl=s=>{const x=esc(s),i=x.toLowerCase().indexOf(esc(q));return i<0?x:x.slice(0,i)+'<mark>'+x.slice(i,i+esc(q).length)+'</mark>'+x.slice(i+esc(q).length)};
  const hitT=s=>String(s||'').toLowerCase().includes(q);
  for(const id of ['me1','me2','me3','me4','zh']){const c=S.classes[id],rt=tr(RM[id].title);
   c.lessons.forEach(l=>{if(hitT(tr(l.t)))res.push({go:{kind:RM[id].kind,id,tab:'syllabus'},t:tr(l.t),s:t('lesson_s')+' · '+rt})});
   c.docs.forEach(d=>{if(hitT(tr(d.t))||hitT(d.note))res.push({go:{kind:RM[id].kind,id,tab:'docs'},t:tr(d.t),s:t('doc_s')+' · '+rt})});
   if(hitT(c.notes))res.push({go:{kind:RM[id].kind,id,tab:'notes'},t:rt,s:t('note_s')})}
  S.work.tasks.forEach(k=>{if(hitT(tr(k.t)))res.push({go:{kind:'work',id:'work'},t:tr(k.t),s:t('task_s')})});
  S.plan.cards.forEach(c=>{if(hitT(c.t)||hitT(c.p))res.push({go:{kind:'plan',tab:'board'},t:c.t,s:t('card_s')+' · '+t('c_'+c.col)+(c.p?' · '+c.p:'')})});
  S.plan.posts.forEach(p=>{if(hitT(p.t)||hitT(p.p))res.push({go:{kind:'plan',tab:'content'},t:p.t,s:t('post_s')+' · '+p.d+' · '+p.c})});
  S.plan.pages.forEach(p=>{if(hitT(p.t)||hitT(p.b))res.push({go:{kind:'plan',tab:'pages',page:p.id},t:p.t,s:t('page_s')})});
  panelState.res=res.slice(0,40);
  h+=`<div class="logrow"><button class="btn sm pri" data-act="qCard">${t('addAsCard')}</button><button class="btn sm" data-act="qPage">${t('addAsPage')}</button></div>`;
  h+=res.length?res.slice(0,40).map((r,i)=>`<button class="res" data-act="fgo" data-i="${i}">${hl(r.t)}<small>${esc(r.s)}</small></button>`).join(''):`<div class="empty" style="margin-top:10px">${t('noRes')}</div>`;
 }
 return h;
}
function renderPanel(){
 if(!panelState)return;const k=panelState.kind;const y=panel.scrollTop;
 panel.innerHTML=k==='class'||k==='zh'?classPanel():k==='work'?workPanel():k==='plan'?planPanel():k==='crm'?crmPanel():k==='board'?boardPanel():k==='pomo'?pomoPanel():k==='certs'?certsPanel():k==='acct'?acctPanel():k==='find'?findPanel():settingsPanel();
 panel.scrollTop=y;
}
const fval=(b,n)=>{const f=b.closest('.add');const el=f&&f.querySelector(`[name=${n}]`);return el?el.value.trim():''};
function newPage(k,title){const tp=TEMPLATES.find(x=>x.k===k);const pg={id:uid(),t:title||(tp?tr(tp.t):t('newPage')),b:tp?tr(tp.b):'',at:Date.now()};S.plan.pages.push(pg);save();return pg}
panel.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT'||b.tagName==='TEXTAREA'||b.tagName==='SELECT')return;
 const a=b.dataset.act,st=panelState,c=st&&st.id&&S.classes[st.id],id=b.dataset.id;
 const done=()=>{save();renderPanel();updateTags()};
 switch(a){
  case 'close':closePanel();break;
  case 'tab':st.tab=b.dataset.tab;st.page=null;panel.scrollTop=0;renderPanel();break;
  case 'addL':{const ti=fval(b,'t');if(!ti)return;c.lessons.push({id:uid(),t:ti,url:safeUrl(fval(b,'u')),done:false});done();break}
  case 'delL':c.lessons=c.lessons.filter(x=>x.id!==id);done();break;
  case 'addD':{const ti=fval(b,'t'),u=safeUrl(fval(b,'u'));if(!ti&&!u)return;c.docs.push({id:uid(),t:ti||u,url:u,note:fval(b,'n')});done();break}
  case 'delD':c.docs=c.docs.filter(x=>x.id!==id);done();break;
  case 'addC':{const ti=fval(b,'t');if(!ti)return;c.certs.push({id:uid(),t:ti,url:safeUrl(fval(b,'u')),date:fval(b,'d')});done();break}
  case 'delC':c.certs=c.certs.filter(x=>x.id!==id);done();break;
  case 'addCA':{const ti=fval(b,'t'),rid=fval(b,'r');if(!ti||!S.classes[rid])return;S.classes[rid].certs.push({id:uid(),t:ti,url:safeUrl(fval(b,'u')),date:fval(b,'d')});done();break}
  case 'delCA':{const cc=S.classes[b.dataset.room];if(cc){cc.certs=cc.certs.filter(x=>x.id!==id);done()}break}
  case 'log':{const m=+b.dataset.m;logMin(st.id,m,'manual');toast(t('logged',{m,c:tr(RM[st.id].title)}));renderPanel();break}
  case 'pomoHere':{PM.cls=id||st.id;if(!PM.running){PM.mode='focus';PM.remain=null}savePM();renderPomoSelect();renderPomo();toast(tr(RM[PM.cls].title)+' · Pomodoro');break}
  case 'goto':closePanel();goRoom(id);break;
  case 'addT':{const ti=fval(b,'t');if(!ti)return;S.work.tasks.push({id:uid(),t:ti,done:false});done();break}
  case 'delT':S.work.tasks=S.work.tasks.filter(x=>x.id!==id);done();break;
  case 'addK':{const ti=fval(b,'t'),u=safeUrl(fval(b,'u'));if(!u)return;S.work.links.push({id:uid(),t:ti||u,url:u});done();break}
  case 'delK':S.work.links=S.work.links.filter(x=>x.id!==id);done();break;
  case 'addCard':{const ti=fval(b,'t');if(!ti)return;S.plan.cards.push({id:uid(),t:ti,p:fval(b,'p'),g:fval(b,'g'),due:fval(b,'d'),col:'todo'});done();break}
  case 'mv':{const cd=S.plan.cards.find(x=>x.id===id);if(cd){const i=COLS.findIndex(x=>x[0]===cd.col);cd.col=COLS[clamp(i+ +b.dataset.dir,0,COLS.length-1)][0];done()}break}
  case 'delCard':S.plan.cards=S.plan.cards.filter(x=>x.id!==id);done();break;
  case 'addPost':{const ti=fval(b,'t'),d=fval(b,'d');if(!ti||!d)return;S.plan.posts.push({id:uid(),t:ti,d,c:fval(b,'c'),p:fval(b,'p'),s:'idea'});done();break}
  case 'delPost':S.plan.posts=S.plan.posts.filter(x=>x.id!==id);done();break;
  case 'newPage':{const pg=newPage(b.dataset.k);st.page=pg.id;panel.scrollTop=0;renderPanel();break}
  case 'openPage':st.page=id;panel.scrollTop=0;renderPanel();break;
  case 'pageBack':st.page=null;renderPanel();break;
  case 'delPage':S.plan.pages=S.plan.pages.filter(x=>x.id!==id);st.page=null;done();break;
  case 'fgo':{const r=(st.res||[])[+b.dataset.i];if(r)openPanel(Object.assign({},r.go));break}
  case 'qCard':{const ti=(st.q||'').trim();if(!ti)return;S.plan.cards.push({id:uid(),t:ti,p:'',g:TAGS[0],due:'',col:'todo'});save();updateTags();openPanel({kind:'plan',tab:'board'});break}
  case 'qPage':{const ti=(st.q||'').trim();if(!ti)return;const pg=newPage('',ti);openPanel({kind:'plan',tab:'pages',page:pg.id});break}
  case 'addCrm':{const u=safeUrl(fval(b,'u'));if(!u)return;S.crm.links.push({id:uid(),t:fval(b,'t')||u,url:u});done();break}
  case 'delCrm':S.crm.links=S.crm.links.filter(x=>x.id!==id);done();break;
  case 'theme':S.settings.theme=b.dataset.v;save();try{localStorage.setItem(LS,JSON.stringify(S))}catch(x){}setTimeout(()=>location.reload(),350);break;
  case 'install':doInstall();break;
  case 'signIn':fbSignIn();break;
  case 'signOut':fbSignOut();break;
  case 'hskRefresh':fbPull(false);break;
  case 'askN':askNotify();break;
  case 'copy':{const tx=$('#exp');const ok=()=>toast(t('copied'));try{navigator.clipboard.writeText(tx.value).then(ok,()=>{tx.select()})}catch(err){tx.select()}break}
  case 'import':{try{const j=JSON.parse($('#exp').value);if(!j||j.v!==1)throw 0;S=merge(j);L=S.lang==='en'?'en':'vi';save();refreshAll();toast(t('imported'))}catch(err){toast(t('importBad'))}break}
  case 'resetAll':if(b.dataset.armed){S=defaults();L='vi';save();refreshAll();}else{b.dataset.armed=1;b.textContent=t('confirmAgain')}break;
 }
});
panel.addEventListener('change',e=>{
 const el=e.target,a=el.dataset.act,st=panelState,c=st&&st.id&&S.classes[st.id],id=el.dataset.id;if(!a)return;
 if(a==='tl'){const l=c.lessons.find(x=>x.id===id);if(l)l.done=el.checked}
 else if(a==='gate')c.gate=el.checked;
 else if(a==='wc'){const k=dkey(new Date());S.work.checks[k]=S.work.checks[k]||{};S.work.checks[k][id]=el.checked;const ks=Object.keys(S.work.checks).sort();while(ks.length>60)delete S.work.checks[ks.shift()]}
 else if(a==='td'){const x=S.work.tasks.find(k=>k.id===id);if(x)x.done=el.checked}
 else if(a==='plen'){S.settings[el.dataset.k]=clamp(Math.round(+el.value||1),1,180);if(!PM.running)PM.remain=null}
 else if(a==='zhurl')S.settings.zhUrl=el.value.trim();
 else if(a==='pst'){const p=S.plan.posts.find(x=>x.id===id);if(p)p.s=el.value}
 else if(a==='setn')S.settings.notify=el.checked;
 else if(a==='crmv'){const k=dkey(new Date());S.crm.log[k]=S.crm.log[k]||{};S.crm.log[k][el.dataset.k]=el.value===''?undefined:Math.max(0,+el.value);const ks=Object.keys(S.crm.log).sort();while(ks.length>120)delete S.crm.log[ks.shift()]}
 else if(a==='setb')S.settings.before=clamp(Math.round(+el.value||0),0,60);
 else return;
 save();renderPanel();updateTags();renderPomo();
});
let fqT=null;
panel.addEventListener('input',e=>{const el=e.target,a=el.dataset.act;
 if(a==='notes'){S.classes[panelState.id].notes=el.value;save()}
 else if(a==='wnotes'){S.work.notes=el.value;save()}
 else if(a==='crmnotes'){S.crm.notes=el.value;save()}
 else if(a==='pgt'||a==='pgb'){const pg=S.plan.pages.find(x=>x.id===panelState.page);if(pg){pg[a==='pgt'?'t':'b']=el.value;pg.at=Date.now();save()}}
 else if(a==='fq'){panelState.q=el.value;clearTimeout(fqT);fqT=setTimeout(()=>{const r=$('#fres');if(r)r.innerHTML=findResults()},150)}});
panel.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.closest('.add')){const b=e.target.closest('.add').querySelector('button[data-act]');if(b){e.preventDefault();b.click()}}});
// kanban drag & drop (desktop)
panel.addEventListener('dragstart',e=>{const li=e.target.closest('[data-card]');if(li){e.dataTransfer.setData('text/plain',li.dataset.card);e.dataTransfer.effectAllowed='move'}});
panel.addEventListener('dragover',e=>{const ul=e.target.closest('[data-col]');if(ul){e.preventDefault();ul.classList.add('over')}});
panel.addEventListener('dragleave',e=>{const ul=e.target.closest('[data-col]');if(ul)ul.classList.remove('over')});
panel.addEventListener('drop',e=>{const ul=e.target.closest('[data-col]');if(!ul)return;e.preventDefault();const cd=S.plan.cards.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(cd){cd.col=ul.dataset.col;save();renderPanel();updateTags()}});

/* misc */
let toastT;function toast(s){const el=$('#toast');el.textContent=s;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2800)}
function refreshAll(){
 document.documentElement.lang=L;
 document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));
 document.querySelectorAll('[data-t]').forEach(el=>el.title=t(el.dataset.t));
 $('#b-lang').textContent=L==='vi'?'EN':'VI';$('#pgo').textContent=t('enter');$('#help').textContent=t('help');
 renderDock();renderPomoSelect();renderPomo();updateTags();updateStats();syncLight();nowB=null;updateClock();drawBoard();drawClock();applyLight(hourNow());renderPanel();gateUI();
 badge($('#savebadge').dataset.k||'local');
}
refreshAll();
setInterval(()=>{updateClock();pomoTick();if(panelState&&panelState.kind==='pomo'){const el=panel.querySelector('.big');if(el){const r=premain();el.textContent=pad(Math.floor(r/60))+':'+pad(Math.floor(r%60))}}},1000);
setInterval(remindTick,20000);
setInterval(()=>{drawClock();updateStats()},15000);
setInterval(drawBoard,60000);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{drawBoard()});
requestAnimationFrame(frame);
setTimeout(()=>$('#loading').classList.add('off'),300);
setTimeout(()=>$('#help').classList.add('off'),14000);
}
</script>
