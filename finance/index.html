<html lang="vi">
<head>

<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b10;--card:#10161e;--card2:#18212b;--ink:#eef2f6;--mute:#8d9aa8;--line:rgba(255,255,255,.08);--grid:rgba(255,255,255,.06);
 --brand:#f2c14e;--brand-ink:#1d1503;
 --g-thu:#338ced;--g-tichluy:#00a888;--g-codinh:#9887ef;--g-linhhoat:#e76624;--g-du:#5b6673;
 --s1:#1b64be;--s2:#338ced;--s3:#6aabf1;--s4:#9dc8f7;--s5:#cce3fd;
 --good:#3ddc84;--bad:#ff6b6b;--warn:#ffcc4d;
 --safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom);color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f3f4f7;--card:#fff;--card2:#f3f5f8;--ink:#141a21;--mute:#667381;--line:rgba(0,0,0,.08);--grid:rgba(0,0,0,.07);
 --brand:#c98f08;--brand-ink:#fff;--g-thu:#257de0;--g-tichluy:#00a383;--g-codinh:#6a4ce2;--g-linhhoat:#f47230;--g-du:#a3acb6;
 --s1:#1757ac;--s2:#257de0;--s3:#519ced;--s4:#84b9f3;--s5:#b6d5f8;--good:#108a3e;--bad:#d93636;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Be Vietnam Pro',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
#app{max-width:760px;margin:0 auto;min-height:100vh;padding:calc(var(--safe-t) + 10px) 14px calc(var(--safe-b) + 96px)}
header{display:flex;align-items:center;gap:10px;margin:4px 2px 14px}
header .logo{width:40px;height:40px;border-radius:12px;flex:none}
header .t{flex:1;min-width:0}header h1{margin:0;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em;line-height:1.2}header small{color:var(--mute);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;position:relative;flex:none}
.ib svg{width:20px;height:20px}.ib.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--card)}
.upd{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 12px;height:40px;font-weight:700;font-size:13.5px;position:relative}
.upd svg{width:18px;height:18px}@media (max-width:440px){.upd span{display:none}.upd{padding:0 11px}}.upd.spin svg{animation:sp 1s linear infinite}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.card h3{margin:0 0 12px;font-size:12.5px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 span{text-transform:none;letter-spacing:0;font-weight:600}
.sub{font-size:12.5px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:700px){.wide2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide2>.card{margin-bottom:0}.wide2{margin-bottom:12px}}
.kpi{background:var(--card2);border-radius:16px;padding:12px 13px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.kpi small{display:block;color:var(--mute);font-size:12px;font-weight:600}.kpi b{display:block;font-size:22px;letter-spacing:-.02em;margin:2px 0 1px}.kpi i{font-style:normal;font-size:11.5px;color:var(--mute)}
.mon{display:flex;align-items:center;gap:6px}.mon button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:16px;line-height:1}
.mon b{font-size:15px;min-width:92px;text-align:center;text-transform:none;letter-spacing:0;color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--mute);text-transform:none;letter-spacing:0}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.seg{display:inline-flex;background:var(--card2);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}.seg button{border:0;background:none;padding:5px 11px;border-radius:8px;font-size:12.5px;color:var(--mute);font-weight:600}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute);margin:8px 0 2px}.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block}.legend i.ln{height:3px;border-radius:2px;width:14px}
.chart{position:relative}.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--mute);font-size:10.5px;font-family:inherit}
#tip{position:fixed;z-index:40;pointer-events:none;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 11px;font-size:12.5px;box-shadow:0 8px 28px rgba(0,0,0,.35);opacity:0;transition:opacity .12s;max-width:240px}
#tip.on{opacity:1}#tip b{display:block;margin-bottom:3px}#tip .r{display:flex;justify-content:space-between;gap:14px}#tip .r i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--c)}
.alloc{display:flex;height:22px;border-radius:8px;overflow:hidden;gap:2px;margin:6px 0 10px;background:var(--card2)}
.alloc u{display:block;height:100%;background:var(--c);min-width:3px}
.alloc u.du{background:repeating-linear-gradient(135deg,var(--g-du) 0 4px,transparent 4px 8px)}
.alist{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.alist div{font-size:12px;color:var(--mute)}.alist b{display:block;color:var(--ink);font-size:14px}
.alist div::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:5px}
@media (max-width:420px){.alist{grid-template-columns:1fr 1fr}}
.hb{display:grid;grid-template-columns:minmax(90px,34%) 1fr auto;gap:10px;align-items:center;margin:9px 0;font-size:13.5px}
.hb .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hb .tr{height:10px;border-radius:6px;background:var(--card2);position:relative}
.hb .tr u{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--c)}.hb .tr s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;border-radius:1px}
.hb b{font-size:13.5px;text-align:right}.hb small{display:block;color:var(--mute);font-size:11px;font-weight:500}
.cat{display:flex;gap:12px;align-items:flex-start}
.cat svg.meo{width:84px;height:84px;flex:none}
.bub{flex:1;background:var(--card2);border-radius:18px 18px 18px 6px;padding:12px 14px;position:relative;min-height:70px}
.bub p{margin:0;font-size:14.5px;line-height:1.55}.bub .who{font-size:11.5px;font-weight:700;color:var(--brand);margin-bottom:3px;display:flex;justify-content:space-between}
.bub .who button{border:0;background:none;color:var(--mute);font-size:12px;font-weight:600;padding:0}
.meo .eye{animation:bl 5s infinite;transform-origin:center;transform-box:fill-box}@keyframes bl{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.meo .tail{animation:tl 3s ease-in-out infinite;transform-origin:20% 90%;transform-box:fill-box}@keyframes tl{50%{transform:rotate(9deg)}}
table.tb{width:100%;border-collapse:collapse;font-size:12.5px}table.tb th,table.tb td{padding:7px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
table.tb th:first-child,table.tb td:first-child{text-align:left}table.tb th{color:var(--mute);font-weight:600;border-top:0}
.tbw{overflow-x:auto;margin:0 -4px}
.lnk{border:0;background:none;color:var(--brand);font-weight:700;font-size:12.5px;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-of-type{border-top:0}.row .nm{flex:1;min-width:0}.row .nm b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .nm small{color:var(--mute);font-size:11.5px}
.row .v{text-align:right;font-size:14px;font-weight:700}.row .v small{display:block;font-size:11px;color:var(--mute);font-weight:500}
.row svg.sp{width:70px;height:26px;flex:none}
.gdot{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.goal{background:var(--card2);border-radius:16px;padding:14px;margin-bottom:10px}
.goal .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.goal b{font-size:15px}.goal .top small{display:block;color:var(--mute);font-size:12px}
.prog{height:10px;border-radius:6px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden;margin:10px 0 8px}.prog u{display:block;height:100%;border-radius:6px;background:var(--g-tichluy)}
.goal .meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute)}.goal .meta b{font-size:12px;color:var(--ink)}
.st{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}.st.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}.st.slow{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}.st.done{background:color-mix(in srgb,var(--brand) 20%,transparent);color:var(--brand)}
.chips{display:flex;gap:7px;flex-wrap:wrap}.chips button{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;background:var(--card2)}.btn.pri{background:var(--brand);color:var(--brand-ink)}.btn.full{width:100%}.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn.del{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.day{font-size:12px;font-weight:700;color:var(--mute);margin:14px 2px 2px;display:flex;justify-content:space-between}
.tx{display:flex;gap:12px;align-items:center;padding:10px 2px;border-top:1px solid var(--line)}.tx:first-child{border-top:0}
.tx .tm{font-size:12px;color:var(--mute);width:40px;flex:none}.tx .nm{flex:1;min-width:0}.tx .nm b{display:block;font-size:14px;font-weight:600}.tx .nm small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .v{font-weight:700;font-size:14px}.tx .v.in{color:var(--g-thu)}.tx button{border:0;background:none;color:var(--mute);font-size:12px;padding:4px}
.note{font-size:12.5px;color:var(--mute);line-height:1.55}
.nlist div{padding:8px 0;border-top:1px solid var(--line);font-size:13px}.nlist div:first-child{border-top:0}.nlist b{font-weight:600}.nlist span{color:var(--mute)}
nav#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:6px 10px calc(var(--safe-b) + 6px);background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);z-index:6}
nav#tabs>div{display:flex;max-width:760px;width:100%;justify-content:space-around;align-items:center}
nav#tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mute);padding:4px 6px;border-radius:12px;font-weight:600;min-width:56px}
nav#tabs button svg{width:23px;height:23px}nav#tabs button.on{color:var(--ink)}nav#tabs button.on svg{color:var(--brand)}
nav#tabs button.add{width:52px;height:52px;border-radius:18px;background:var(--brand);color:var(--brand-ink);min-width:0;margin-top:-18px;box-shadow:0 8px 22px rgba(0,0,0,.35);justify-content:center}
nav#tabs button.add svg{width:26px;height:26px;color:var(--brand-ink)!important}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}#sheet.on{display:flex}
#sheet>div{background:var(--card);width:100%;max-width:620px;border-radius:24px 24px 0 0;padding:16px 18px calc(var(--safe-b) + 22px);max-height:90vh;overflow-y:auto;animation:up .22s ease}
@media (min-width:700px){#sheet{align-items:center}#sheet>div{border-radius:24px;max-height:86vh}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#sheet h2{margin:0 0 4px;font-size:19px}#sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.f{margin:12px 0}.f label{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:11px 12px;font-size:15px;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--brand)}
.amt{font-size:30px!important;font-weight:800;text-align:right;letter-spacing:-.02em;padding:12px 14px!important}
.amtp{font-size:12.5px;color:var(--mute);text-align:right;margin-top:4px;min-height:18px}
.typ{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card2);padding:4px;border-radius:14px}.typ button{border:0;background:none;padding:9px;border-radius:11px;font-weight:700;color:var(--mute)}
.typ button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 92px);transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:14px;font-size:13.5px;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:90vw}
 #lock{position:fixed;inset:0;z-index:28;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#lockIn{width:100%;max-width:330px;text-align:center}#lockIn img{width:72px;height:72px;border-radius:20px}#lockIn h2{margin:12px 0 4px;font-size:21px}
.lsub{color:var(--mute);font-size:13px;margin:0 0 18px;min-height:18px}.lmsg{color:var(--bad);font-size:13px;min-height:20px;margin:12px 0 6px}
.pdots{display:flex;justify-content:center;gap:14px}.pdots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mute)}.pdots i.on{background:var(--brand);border-color:var(--brand)}
.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}.pad button{height:62px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:24px;font-weight:600}
.pad button:active{background:var(--card2)}.pad button.sm{font-size:14px;color:var(--mute);background:none;border:0}
#gate{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;z-index:30}
#gate img{width:96px;height:96px;border-radius:26px;margin-bottom:16px}#gate h2{margin:0 0 6px}#gate p{color:var(--mute);margin:0 0 20px;max-width:340px}
.empty{text-align:center;padding:26px 10px}.empty p{color:var(--mute);margin:8px 0 16px}
.sankw{overflow-x:auto;margin:0 -16px;padding:0 16px}.sankw .sank{min-width:640px}.sank text{font-size:11.5px;fill:var(--ink)}.sank text.m{fill:var(--mute);font-size:10.5px}.sank path{mix-blend-mode:normal}
.sank path:hover{opacity:.75!important}
.ck{display:flex;flex-wrap:wrap;gap:6px}.ck label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:500;color:var(--ink);margin:0;background:var(--card2)}
.ck input{width:auto;margin:0;accent-color:var(--brand)}
.mapr{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}.mapr span{flex:1}.mapr select{width:auto;padding:6px 8px;font-size:13px;border-radius:9px;border:1px solid var(--line);background:var(--card2)}
code{background:var(--card2);padding:2px 6px;border-radius:6px;font-size:12px;word-break:break-all}
</style>
</head>
<body>
<div id="gate"><img src="icon-192.png" alt=""><h2>Ngân hàng Mintun</h2><p>Tiền vào từ đâu, tiền đi đâu, mục tiêu tới đâu. Bắp đọc sổ thu chi của Tuấn mỗi ngày.</p><button class="btn pri" id="signin">Đăng nhập bằng Google</button><p class="note" id="gateMsg" style="margin-top:14px"></p></div>
<div id="app">
 <header>
  <img class="logo" src="icon-192.png" alt="">

  <button class="ib" id="bLock" aria-label="Khoá"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
  <button class="ib" id="bSet" aria-label="Cài đặt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
 </header>
 <main id="view"></main>
</div>

/* ===== biểu đồ ===== */
const cw=()=>Math.max(330,Math.min(728,(document.getElementById('view').clientWidth||innerWidth)-34));
function capMax(vals){const a=vals.filter(v=>v>0).sort((x,y)=>x-y);if(!a.length)return 1;const mx=a[a.length-1],p=a[Math.floor((a.length-1)*.85)];return niceMax(a.length>=6&&mx>p*1.9?p*1.35:mx)}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function axisY(W,H,pad,max,ticks=4){let s='';for(let k=0;k<=ticks;k++){const v=max*k/ticks,y=pad.t+(H-pad.t-pad.b)*(1-k/ticks);s+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${pad.l-6}" y="${y+3.5}" text-anchor="end">${k?short(v):'0'}</text>`}return s}
/* Thu (đường) + tiền ra xếp chồng: cố định, linh hoạt, tích lũy */
function flowChart(a,b){
 const ms=M.mon.slice(a,b+1),W=cw(),H=W>560?300:250,pad={l:44,r:8,t:18,b:26},n=ms.length;
 const max=capMax(ms.flatMap(m=>[m.inc,m.codinh+m.linhhoat+Math.max(0,m.tichluy)]));
 const bw=(W-pad.l-pad.r)/n,y=v=>pad.t+(H-pad.t-pad.b)*(1-Math.min(v,max)/max),bar=Math.max(3,Math.min(26,bw*.62));
 let s=axisY(W,H,pad,max),pts=[];
 ms.forEach((m,k)=>{const x=pad.l+bw*k+bw/2;let acc=0;const segs=[['codinh',m.codinh],['linhhoat',m.linhhoat],['tichluy',Math.max(0,m.tichluy)]];
  segs.forEach(([g,v],si)=>{if(v<=0)return;const y0=y(acc),y1=y(acc+v);const top=si===segs.length-1||segs.slice(si+1).every(q=>q[1]<=0);const h=Math.max(1,y0-y1-(acc>0?2:0));
   s+=top?`<path d="M${x-bar/2} ${y0-(acc>0?2:0)}V${y1+4}a4 4 0 0 1 4-4h${bar-8}a4 4 0 0 1 4 4V${y0-(acc>0?2:0)}z" fill="${GC[g]}"/>`:`<rect x="${x-bar/2}" y="${y0-h-(acc>0?2:0)}" width="${bar}" height="${h}" fill="${GC[g]}"/>`;acc+=v});
  const tot=m.codinh+m.linhhoat+Math.max(0,m.tichluy);if(Math.max(tot,m.inc)>max)s+=`<text x="${x}" y="${pad.t-5}" text-anchor="middle" style="fill:var(--ink);font-weight:700">↑${short(Math.max(tot,m.inc))}</text>`;
  pts.push([x,y(m.inc)]);
  const lbl=k%Math.ceil(n/Math.floor(W/52))===0;if(lbl)s+=`<text x="${x}" y="${H-8}" text-anchor="middle">${m.label.replace(/\/20(\d\d)/,'/$1')}</text>`;
  const tip=`<b>Tháng ${m.label}${m.partial?' · đang điền':''}</b>${tr(GC.thu,'Thu',short(m.inc))}${tr(GC.codinh,'Cố định',short(m.codinh))}${tr(GC.linhhoat,'Linh hoạt',short(m.linhhoat))}${tr(GC.tichluy,'Tích lũy',short(m.tichluy))}${tr('transparent',m.free>=0?'Còn dư':'Thâm hụt',short(m.free))}`;
  s+=`<rect x="${pad.l+bw*k}" y="${pad.t}" width="${bw}" height="${H-pad.t-pad.b}" fill="transparent" data-tip="${esc(tip)}" data-mi="${a+k}" style="cursor:pointer"/>`;
  if(a+k===sel)s+=`<rect x="${pad.l+bw*k+1}" y="${pad.t}" width="${bw-2}" height="${H-pad.t-pad.b}" fill="var(--ink)" opacity=".06" rx="6" pointer-events="none"/>`});
 s+=`<path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('')}" fill="none" stroke="var(--g-thu)" stroke-width="2.2" stroke-linejoin="round" pointer-events="none"/>`;
 pts.forEach(p=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${n>24?2:3.2}" fill="var(--g-thu)" stroke="var(--card)" stroke-width="2" pointer-events="none"/>`});
 return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Thu nhập và tiền ra theo tháng">${s}</svg></div>
 <div class="legend"><span><i class="ln" style="--c:var(--g-thu)"></i>Thu nhập</span><span><i style="--c:var(--g-codinh)"></i>Chi cố định</span><span><i style="--c:var(--g-linhhoat)"></i>Chi linh hoạt</span><span><i style="--c:var(--g-tichluy)"></i>Tích lũy</span></div>`}
function flowTable(a,b){const ms=M.mon.slice(a,b+1).reverse();return `<div class="tbw"><table class="tb num"><tr><th>Tháng</th><th>Thu</th><th>Cố định</th><th>Linh hoạt</th><th>Tích lũy</th><th>Còn dư</th></tr>${ms.map(m=>`<tr><td>${m.label}</td><td>${short(m.inc)}</td><td>${short(m.codinh)}</td><td>${short(m.linhhoat)}</td><td>${short(m.tichluy)}</td><td>${short(m.free)}</td></tr>`).join('')}</table></div>`}
/* thu nhập theo nguồn (cột xếp chồng, cùng tông xanh) */
function srcChart(a,b,srcs){
 const ms=M.mon.slice(a,b+1),W=cw(),H=200,pad={l:44,r:8,t:16,b:24},n=ms.length,cols=['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)'];
 const max=capMax(ms.map(m=>m.inc)),bw=(W-pad.l-pad.r)/n,y=v=>pad.t+(H-pad.t-pad.b)*(1-Math.min(v,max)/max),bar=Math.max(3,Math.min(26,bw*.62));
 let s=axisY(W,H,pad,max);
 ms.forEach((m,k)=>{const x=pad.l+bw*k+bw/2;let acc=0,tip=`<b>Tháng ${m.label}</b>`;const vs=srcs.map((c,ci)=>[c,ci,Math.max(0,c.vals[a+k]||0)]).filter(q=>q[2]>0);
  vs.forEach(([c,ci,v],j)=>{const y0=y(acc),y1=y(acc+v),g=acc>0?2:0,h=Math.max(1,y0-y1-g),last=j===vs.length-1;
   s+=last?`<path d="M${x-bar/2} ${y0-g}V${Math.min(y0-g,y1+4)}a4 4 0 0 1 4-4h${bar-8}a4 4 0 0 1 4 4V${y0-g}z" fill="${cols[ci%5]}"/>`:`<rect x="${x-bar/2}" y="${y0-h-g}" width="${bar}" height="${h}" fill="${cols[ci%5]}"/>`;acc+=v});
  if(m.inc>max)s+=`<text x="${x}" y="${pad.t-3}" text-anchor="middle" style="fill:var(--ink);font-weight:700">↑${short(m.inc)}</text>`;
  srcs.forEach((c,ci)=>{tip+=tr(cols[ci%5],c.name,short(c.vals[a+k]||0))});
  if(k%Math.ceil(n/Math.floor(W/52))===0)s+=`<text x="${x}" y="${H-7}" text-anchor="middle">${m.label.replace(/\/20(\d\d)/,'/$1')}</text>`;
  s+=`<rect x="${pad.l+bw*k}" y="${pad.t}" width="${bw}" height="${H-pad.t-pad.b}" fill="transparent" data-tip="${esc(tip)}"/>`});
 return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Thu nhập theo nguồn">${s}</svg></div><div class="legend">${srcs.map((c,ci)=>`<span><i style="--c:${cols[ci%5]}"></i>${esc(c.name)}</span>`).join('')}</div>`}
/* Sankey: nguồn thu → nhóm → hạng mục */
function sankey(R){
 const srcs=M.cats.filter(c=>c.group==='thu').map(c=>({n:c.name,v:Math.max(0,R.cat[c.id])})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
 const gs=['codinh','linhhoat','tichluy'].map(g=>({g,n:GROUPS[g].short,v:Math.max(0,R[g])})).filter(x=>x.v>0);
 const du=R.free;if(du>0)gs.push({g:'du',n:'Còn dư',v:du});
 const inTot=srcs.reduce((s,x)=>s+x.v,0),outTot=gs.reduce((s,x)=>s+x.v,0);
 if(du<0)srcs.push({n:'Lấy từ tiền cũ',v:-du,old:true});
 const leafs=[];gs.forEach(g=>{if(g.g==='du'){leafs.push({g:'du',n:'Chưa phân bổ',v:g.v});return}
  const cs=M.cats.filter(c=>c.group===g.g).map(c=>({g:g.g,n:c.name,v:Math.max(0,R.cat[c.id])})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const keep=g.g==='linhhoat'?6:4;const top=cs.slice(0,keep),rest=cs.slice(keep).reduce((s,x)=>s+x.v,0);top.forEach(x=>leafs.push(x));if(rest>0)leafs.push({g:g.g,n:'Khác ('+(cs.length-keep)+')',v:rest})});
 const W=720,gap=6,colW=12,X=[150,355,560],total=Math.max(srcs.reduce((s,x)=>s+x.v,0),outTot);
 const H=Math.max(300,leafs.length*30+20),k=(H-20-gap*Math.max(srcs.length,gs.length,leafs.length))/total;
 const lay=(arr,top=10)=>{let y=top;arr.forEach(a=>{a.h=Math.max(2,a.v*k);a.y=y;y+=a.h+gap});return y};
 const hs=lay(srcs),hg=lay(gs),hl=lay(leafs);
 const off=(arr,hh)=>{const d=(H-hh)/2;arr.forEach(a=>a.y+=d)};off(srcs,hs);off(gs,hg);off(leafs,hl);
 const col=x=>x.old?'var(--bad)':x.g?(x.g==='du'?'var(--g-du)':GC[x.g]):'var(--g-thu)';
 const link=(x0,y0,x1,y1,h,c,tip)=>{const m=(x0+x1)/2;return `<path d="M${x0} ${y0}C${m} ${y0} ${m} ${y1} ${x1} ${y1}L${x1} ${y1+h}C${m} ${y1+h} ${m} ${y0+h} ${x0} ${y0+h}Z" fill="${c}" opacity=".32" data-tip="${esc(tip)}"/>`};
 let s='';
 // nguồn → nhóm: chia theo tỉ lệ
 const sOff=srcs.map(x=>x.y),gIn=gs.map(g=>g.y);
 srcs.forEach((a,ai)=>{gs.forEach((g,gi)=>{const f=g.v/outTot,h=a.h*f;if(h<.3)return;s+=link(X[0]+colW,sOff[ai],X[1],gIn[gi],h,col(a),`<b>${esc(a.n)} → ${esc(g.n)}</b>${short(a.v*f)}`);sOff[ai]+=h;gIn[gi]+=h})});
 const gOut=gs.map(g=>g.y);
 leafs.forEach(l=>{const gi=gs.findIndex(g=>g.g===l.g);if(gi<0)return;const h=l.h;s+=link(X[1]+colW,gOut[gi],X[2],l.y,h,col(l),`<b>${esc(GROUPS[l.g]?GROUPS[l.g].short:'Còn dư')} → ${esc(l.n)}</b>${short(l.v)}`);gOut[gi]+=h});
 const node=(x,a,side)=>`<rect x="${x}" y="${a.y}" width="${colW}" height="${a.h}" rx="3" fill="${col(a)}" data-tip="${esc('<b>'+esc(a.n)+'</b>'+vnd(a.v))}"/>`+
  (side==='l'?`<text x="${x-8}" y="${a.y+a.h/2-1}" text-anchor="end">${esc(a.n)}</text><text class="m" x="${x-8}" y="${a.y+a.h/2+12}" text-anchor="end">${short(a.v)} · ${pct(a.v/Math.max(1,inTot))}</text>`
  :side==='m'?`<text x="${x+colW+6}" y="${a.y-5}" font-weight="700">${esc(a.n)} <tspan class="m" font-weight="500">${short(a.v)}</tspan></text>`
  :`<text x="${x+colW+8}" y="${a.y+a.h/2+4}">${esc(a.n)} <tspan class="m">${short(a.v)}</tspan></text>`);
 srcs.forEach(a=>s+=node(X[0],a,'l'));gs.forEach(a=>s+=node(X[1],a,'m'));leafs.forEach(a=>s+=node(X[2],a,'r'));

function vLog(){
 if(!logYM){const n=new Date();logYM={y:n.getFullYear(),m:n.getMonth()+1}}
 const mo=logYM,si=M.months.findIndex(x=>x.y===mo.y&&x.m===mo.m);const inM=t=>{const d=t.d||new Date(t.ts);return d.getFullYear()===mo.y&&d.getMonth()+1===mo.m};
 const list=ST.pending.map(p=>Object.assign({},p,{pend:1,d:new Date(p.ts)})).concat(M.tx).filter(inM).sort((a,b)=>b.d-a.d);
 const days={};list.forEach(t=>{const k=t.d.toLocaleDateString('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit'});(days[k]=days[k]||[]).push(t)});
 const thu=list.filter(t=>t.loai==='thu').reduce((s,t)=>s+t.so_tien,0),chi=list.filter(t=>t.loai!=='thu').reduce((s,t)=>s+t.so_tien,0);

 ${list.length?Object.entries(days).map(([k,ts])=>`<div class="day"><span>${esc(k)}</span><span class="num">${short(ts.reduce((s,t)=>s+(t.loai==='thu'?t.so_tien:-t.so_tien),0))}</span></div>`+ts.map(txRow).join('')).join(''):`<div class="empty"><p>Tháng này chưa ghi khoản nào từ app.</p><button class="btn pri" data-tab2="add">Ghi khoản đầu tiên</button></div>`}</div>
 <div class="card"><h3>Ghi chú trong sheet · ${mo.m}/${mo.y}</h3><div class="nlist">${si<0?'<p class="note">Sheet chưa có cột tháng này. Ghi khoản đầu tiên từ app là sheet tự tạo cột.</p>':notes.join('')||'<p class="note">Không có ghi chú.</p>'}</div></div>`}

/* ===== ghi thu chi ===== */
function parseAmt(s){s=String(s||'').toLowerCase().replace(/\s/g,'').replace(/đ|vnd|₫/g,'');if(!s)return 0;
 let m=s.match(/^(\d+)(?:tr|m)(\d+)$/);if(m)return (+m[1])*1e6+(+m[2])*Math.pow(10,6-m[2].length);
 m=s.match(/^(\d+(?:[.,]\d+)?)(k|n|tr|m|t|ty|tỷ)$/);if(m){const v=+m[1].replace(',','.'),u=m[2];return Math.round(v*(u==='k'||u==='n'?1e3:u==='ty'||u==='tỷ'?1e9:1e6))}
 const n=+s.replace(/[.,]/g,'');if(!isFinite(n))return 0;return n<1000?n*1000:n}

 $('#aA').oninput=prev;setTimeout(()=>$('#aA').focus(),250);
 $('#aT').onclick=e=>{const b=e.target.closest('button');if(!b)return;loai=b.dataset.t;$$('#aT button').forEach(x=>x.classList.toggle('on',x===b));drawC()};
 $('#aC').onclick=e=>{const b=e.target.closest('button');if(!b)return;hm=b.dataset.c;drawC()};

 $('#aS').onclick=async()=>{const amt=parseAmt($('#aA').value);if(!amt)return toast('Nhập số tiền');const d=new Date($('#aD').value||Date.now());
  const p={id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),ts:d.toISOString(),loai,hang_muc:hm,so_tien:amt,ghi_chu:$('#aN').value.trim()};
  ST.pending.push(p);ST.recent[hm]=Date.now();save(false);closeSheet();

  catch(e){if(/Không thấy dòng|không hợp lệ|chứa chữ|không có cột/.test(e.message))p.err=e.message;saveLocal();toast(p.err?'Sheet từ chối: '+e.message:'Chưa gửi được, app sẽ tự gửi lại khi có mạng');render()}}}

let lockMode=null,pinBuf='',pinFirst='',lockBusy=false,hiddenAt=0,idleT=null;
function lockState(){if(K)return null;if(localBox||cloudBox)return 'unlock';if(!cloudChecked)return 'wait';return 'create'}
function showLock(mode){lockMode=mode||lockState();pinBuf='';drawLock();$('#lock').hidden=false}
function drawLock(msg,bad){
 const T={unlock:['Nhập mật khẩu','Mật khẩu 6 số của Ngân hàng Mintun'],create:['Tạo mật khẩu 6 số','Dùng để mở app và toà Ngân hàng trong Học viện. Dữ liệu được mã hoá bằng mật khẩu này.'],confirm:['Nhập lại mật khẩu','Nhập lại 6 số vừa tạo'],change1:['Mật khẩu mới','Nhập 6 số mới'],change2:['Nhập lại mật khẩu mới',''],wait:['Đang kiểm tra tài khoản…','']}[lockMode]||['',''];
 const w=VA.wait();const wm=w?'Sai nhiều lần, thử lại sau '+Math.ceil(w/1000)+' giây':'';
 $('#lockIn').innerHTML=`<img src="icon-192.png" alt=""><h2>${T[0]}</h2><p class="lsub">${esc(T[1])}</p>
 <div class="pdots${bad?' shake':''}">${[0,1,2,3,4,5].map(i=>`<i class="${i<pinBuf.length?'on':''}"></i>`).join('')}</div>
 <p class="lmsg">${esc(msg||wm||(lockBusy?'Đang mở két…':''))}</p>
 ${lockMode==='wait'?'':`<div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-pin="${n}">${n}</button>`).join('')}<button data-pin="x" class="sm">${lockMode==='unlock'?'Quên?':lockMode==='change1'||lockMode==='change2'?'Huỷ':''}</button><button data-pin="0">0</button><button data-pin="b" class="sm" aria-label="Xoá">⌫</button></div>`}`;
}
async function pinDone(){
 const pin=pinBuf;pinBuf='';
 if(lockMode==='create'||lockMode==='change1'){pinFirst=pin;lockMode=lockMode==='create'?'confirm':'change2';drawLock();return}
 if(lockMode==='confirm'||lockMode==='change2'){if(pin!==pinFirst){lockMode=lockMode==='confirm'?'create':'change1';drawLock('Hai lần nhập không khớp, làm lại nhé',true);return}
  lockBusy=true;drawLock();const chg=lockMode==='change2';K=await VA.make(pin);lockBusy=false;
  if(!chg){Object.assign(ST,blank(),cloudLegacy?{cfg:cloudLegacy.cfg||ST.cfg,goals:cloudLegacy.goals||[],map:cloudLegacy.map||{}}:{},legacy||{});legacy=null;cloudLegacy=null}
  save();$('#lock').hidden=true;lockMode=null;build();render();toast(chg?'Đã đổi mật khẩu':'Đã tạo mật khẩu. Nhớ kỹ 6 số này nha!');armIdle();
  if(!chg&&(DEMO||ST.cfg.url&&ST.cfg.key)&&!ST.doc)refresh(true);return}
 if(lockMode==='unlock'){
  if(VA.wait()){drawLock();return}
  lockBusy=true;drawLock();
  try{await unlockWith(pin);VA.ok();lockBusy=false;$('#lock').hidden=true;lockMode=null;build();render();armIdle();if(wantAdd&&M)setTimeout(()=>openAdd(),300);
   if((DEMO||ST.cfg.url&&ST.cfg.key)&&(!ST.sync||Date.now()-ST.sync>6*36e5))refresh(true);else if(M)pushCloud()}
  catch(e){lockBusy=false;const t=VA.fail();drawLock(t.until>Date.now()?'':'Sai mật khẩu ('+t.n+' lần)',true)}}}
async function unlockWith(pin){
 const useCloud=cloudBox&&(!localBox||cloudBox.salt!==localBox.salt||(cloudBox.upd||0)>=(localBox.upd||0));
 let base=null,data=blank();
 if(useCloud){base=await VA.unlock(pin,cloudBox);const c=base.data;Object.assign(data,{cfg:c.cfg||data.cfg,goals:c.goals||[],map:c.map||{},upd:cloudBox.upd||0});
  if(localBox){try{const l=localBox.salt===cloudBox.salt?{data:await VA.open(base.k,localBox)}:await VA.unlock(pin,localBox);Object.assign(data,{doc:l.data.doc,sync:l.data.sync,pending:l.data.pending||[],recent:l.data.recent||{}})}catch(e){localStorage.removeItem(LSV);localBox=null}}}
 else{base=await VA.unlock(pin,localBox);Object.assign(data,base.data)}
 K=base.k;ST=data;if(useCloud)saveLocal()}
function lockNow(){if(!K&&!$('#lock').hidden)return;K=null;ST=blank();M=null;closeSheet();$('#view').innerHTML='';showLock('unlock')}
function armIdle(){clearTimeout(idleT);if(K)idleT=setTimeout(lockNow,10*60e3)}
['pointerdown','keydown','scroll'].forEach(ev=>document.addEventListener(ev,()=>{if(K)armIdle()},{passive:true,capture:true}));
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else{if(K&&hiddenAt&&Date.now()-hiddenAt>3*60e3)lockNow();$('#dueDot').hidden=!isDue()}});
function pinKey(k){if($('#lock').hidden||lockBusy||lockMode==='wait')return;
 if(k==='b'){pinBuf=pinBuf.slice(0,-1);drawLock();return}
 if(k==='x'){if(lockMode==='change1'||lockMode==='change2'){$('#lock').hidden=true;lockMode=null;return}if(lockMode==='unlock')forgot();return}
 if(lockMode==='unlock'&&VA.wait())return drawLock();
 if(pinBuf.length<6){pinBuf+=k;drawLock();if(pinBuf.length===6)setTimeout(pinDone,120)}}
$('#lock').addEventListener('click',e=>{const b=e.target.closest('[data-pin]');if(b)pinKey(b.dataset.pin)});
document.addEventListener('keydown',e=>{if($('#lock').hidden)return;if(/^\d$/.test(e.key))pinKey(e.key);else if(e.key==='Backspace')pinKey('b')});
async function forgot(){
 if(!confirm('Quên mật khẩu: dữ liệu đã mã hoá (link kết nối, mục tiêu, nhóm hạng mục) sẽ bị xoá để tạo mật khẩu mới. Sổ thu chi trên Google Sheet KHÔNG bị ảnh hưởng. Tiếp tục?'))return;
 if(!DEMO&&!(fb&&ref))return toast('Đăng nhập Google trước rồi mới đặt lại được');
 if(!confirm('Chắc chắn xoá và đặt mật khẩu mới?'))return;
 localStorage.removeItem(LSV);localBox=null;cloudBox=null;cloudLegacy=null;VA.ok();
 if(fb&&ref)try{await fb.fs.setDoc(ref,{money:JSON.stringify({v:0,reset:Date.now()})},{merge:true})}catch(e){}
 showLock('create')}

/* ===== Firebase: cùng tài khoản với Học viện, dữ liệu tài chính lưu dạng mã hoá ===== */
let fb=null,user=null,ref=null;
async function pushCloud(){if(!fb||!ref||DEMO||!K)return;const sum=M?F.summary(M,ST.goals,ST.sync):null;
 try{const box=await VA.seal(K,{cfg:ST.cfg,goals:ST.goals,map:ST.map,sum},{upd:ST.upd,sync:ST.sync||0});await fb.fs.setDoc(ref,{money:JSON.stringify(box)},{merge:true});cloudBox=box}catch(e){console.warn('cloud',e)}}
async function adoptCloud(s){let m=null;try{m=JSON.parse(s||'null')}catch(e){}
 cloudChecked=true;
 if(m&&m.v===2)cloudBox=m;else if(m&&m.v===1)cloudLegacy=m;
 if(K){if(m&&m.v===2&&(m.upd||0)>(ST.upd||0)){try{const c=await VA.open(K,m);ST.cfg=c.cfg||ST.cfg;ST.goals=c.goals||[];ST.map=c.map||{};ST.upd=m.upd;saveLocal();build();render()}catch(e){lockNow()}}else if((ST.upd||0)>((m&&m.upd)||0))pushCloud();return}
 if(!$('#lock').hidden||lockMode)showLock(lockState())}
if(DEMO){$('#gate').hidden=true;showLock()}
else{
 if(localBox)$('#gate').hidden=true;
 showLock();
 (async()=>{try{const b='https://www.gstatic.com/firebasejs/13.3.0/';const [app,auth,fs]=await Promise.all([import(b+'firebase-app.js'),import(b+'firebase-auth.js'),import(b+'firebase-firestore.js')]);
  const a=app.initializeApp(FBCFG);fb={auth,fs,A:auth.getAuth(a),D:fs.getFirestore(a)};
  auth.onAuthStateChanged(fb.A,async u=>{user=u;if(u){ref=fs.doc(fb.D,'users',u.uid);$('#gate').hidden=true;
    try{const sn=await fs.getDoc(ref);await adoptCloud(sn.exists()?sn.data().money:null)}catch(e){cloudChecked=true;if(lockMode)showLock(lockState())}}
   else{ref=null;if(!localBox)$('#gate').hidden=false}});
  $('#signin').onclick=()=>auth.signInWithPopup(fb.A,new auth.GoogleAuthProvider()).catch(e=>{if(/popup/.test(e.code||''))auth.signInWithRedirect(fb.A,new auth.GoogleAuthProvider());else $('#gateMsg').textContent='Đăng nhập lỗi: '+(e.code||e)})}
 catch(e){$('#gateMsg').textContent='Không tải được Firebase, kiểm tra mạng.';cloudChecked=true;if(lockMode)showLock(lockState())}})();
}
const wantAdd=new URLSearchParams(location.search).get('add');
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(M&&!$('#sheet').classList.contains('on'))render()},250)});
window.addEventListener('online',()=>{if(K&&ST.pending.length)refresh(true)});
if('serviceWorker' in navigator&&!DEMO)navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ===== chế độ xem thử (?demo=1): đọc file demo cục bộ, không có trên GitHub ===== */
async function demoApi(action,extra){
 if(action==='doc'){const r=await fetch('demo-data.json',{cache:'no-store'});if(!r.ok)throw new Error('Không có demo-data.json');const j=await r.json();j.gd=(j.gd||[]).concat(ST._demoTx||[]);return j}
 if(action==='them'){ST._demoTx=(ST._demoTx||[]).concat([Object.assign({},extra.gd,{trang_thai:'ok'})]);return {ok:true}}
 if(action==='xoa'){ST._demoTx=(ST._demoTx||[]).filter(x=>x.id!==extra.id);return {ok:true}}}
</script>
