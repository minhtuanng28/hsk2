<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#FFFCF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#100F0F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mintun Bank">
<meta name="robots" content="noindex">
<title>Ngân hàng Mintun · Học viện của Tuấn</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="/hsk2/finance/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Bảng màu nền theo Flexoki (giống Wealthfolio), màu dữ liệu theo bộ đã kiểm tra mù màu */
:root{color-scheme:light;
 --bg:#FFFCF0;--card:#F9F6EA;--card2:#F2F0E5;--ui:#E6E4D9;--ui2:#DAD8CE;--ink:#100F0F;--ink2:#403E3C;--mute:#6F6E69;--grid:rgba(16,15,15,.07);
 --gain:#66800B;--loss:#AF3029;--warn:#AD8301;--brand:#BC8A0B;
 --c1:#257de0;--c2:#f47230;--c3:#00b894;--c4:#f2a600;--c5:#ee7fac;--c6:#008a17;--c7:#6a4ce2;
 --g-thu:var(--c1);--g-linhhoat:var(--c2);--g-tichluy:var(--c3);--g-codinh:var(--c7);
 --shadow:0 1px 2px rgba(16,15,15,.05);--r:18px;
 --safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom)}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
 --bg:#100F0F;--card:#1C1B1A;--card2:#232220;--ui:#282726;--ui2:#343331;--ink:#E6E4D9;--ink2:#CECDC3;--mute:#9F9D96;--grid:rgba(230,228,217,.07);
 --gain:#879A39;--loss:#D14D41;--warn:#D0A215;--brand:#D0A215;
 --c1:#338ced;--c2:#e76624;--c3:#00a888;--c4:#d28e05;--c5:#e24d8b;--c6:#0aac23;--c7:#9887ef;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Be Vietnam Pro',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#app{max-width:1120px;margin:0 auto;min-height:100vh;padding:calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 100px)}
/* header */
header.top{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
header.top .logo{width:38px;height:38px;border-radius:11px;flex:none}
header.top .t{flex:1;min-width:0}header.top h1{margin:0;font-size:19px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:999px;border:1px solid var(--ui);background:var(--card);display:grid;place-items:center;position:relative;flex:none;color:var(--ink2)}
.ib svg{width:19px;height:19px}.ib.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.pbtn{display:inline-flex;align-items:center;gap:7px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);height:40px;padding:0 16px;font-weight:600;font-size:13.5px;position:relative;white-space:nowrap}
.pbtn svg{width:17px;height:17px}.pbtn.spin svg{animation:sp 1s linear infinite}
.dot{position:absolute;top:2px;right:2px;width:10px;height:10px;border-radius:50%;background:var(--loss);box-shadow:0 0 0 2px var(--bg)}
@media (max-width:520px){.pbtn span{display:none}.pbtn{width:38px;height:38px;padding:0;justify-content:center}.ib{width:38px;height:38px}header.top .logo{display:none}header.top h1{font-size:17px}header.top{gap:7px}}
/* nav */
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:6px 10px calc(var(--safe-b) + 6px);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--ui)}
nav#tabs>div{display:flex;max-width:640px;margin:0 auto;justify-content:space-around;align-items:center}
nav#tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mute);padding:4px 6px;border-radius:12px;font-weight:600;min-width:58px}
nav#tabs button svg{width:22px;height:22px}nav#tabs button.on{color:var(--ink)}
nav#tabs button.add{width:52px;height:52px;border-radius:999px;background:var(--ink);color:var(--bg)!important;min-width:0;margin-top:-20px;box-shadow:0 8px 22px rgba(0,0,0,.25);justify-content:center}
nav#tabs button.add svg{width:24px;height:24px}
@media (min-width:900px){nav#tabs{position:sticky;top:0;bottom:auto;border:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:8px 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px}
 nav#tabs>div{max-width:none;justify-content:flex-start;gap:6px;background:var(--card2);border:1px solid var(--ui);border-radius:999px;padding:4px;width:max-content}
 nav#tabs button{flex-direction:row;gap:7px;font-size:13.5px;padding:8px 16px;border-radius:999px;min-width:0}nav#tabs button svg{width:17px;height:17px}
 nav#tabs button.on{background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.12)}nav#tabs button.add{width:auto;height:auto;margin:0 0 0 6px;padding:8px 16px;box-shadow:none}
 #app{padding-bottom:40px}}
/* lưới + thẻ */
.grid{display:grid;gap:14px}@media (min-width:900px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1.25fr 1fr}.span2{grid-column:1/-1}}
.card{background:var(--card);border:1px solid var(--ui);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 14px;font-size:13px;font-weight:600;color:var(--mute);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 b{color:var(--ink);font-weight:700;font-size:15px}
.fade>*{animation:fu .5s cubic-bezier(.2,.8,.2,1) both}.fade>*:nth-child(2){animation-delay:.05s}.fade>*:nth-child(3){animation-delay:.1s}.fade>*:nth-child(4){animation-delay:.15s}.fade>*:nth-child(5){animation-delay:.2s}.fade>*:nth-child(n+6){animation-delay:.25s}
@keyframes fu{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){.fade>*{animation:none}}
.sub{color:var(--mute);font-size:12.5px}
.big{font-size:clamp(34px,7vw,46px);font-weight:700;letter-spacing:-.035em;line-height:1.1;margin:4px 0 8px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--ui);color:var(--ink2);white-space:nowrap}
.chip.up{background:color-mix(in oklab,var(--gain) 16%,transparent);color:var(--gain)}.chip.down{background:color-mix(in oklab,var(--loss) 14%,transparent);color:var(--loss)}
.chip.warn{background:color-mix(in oklab,var(--warn) 16%,transparent);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{border-top:1px solid var(--ui);padding-top:10px}.stat small{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:12px;font-weight:600}
.stat small i{width:8px;height:8px;border-radius:2px;background:var(--c)}.stat b{display:block;font-size:19px;letter-spacing:-.02em;margin-top:2px}.stat>span{font-size:11.5px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
/* chọn kỳ */
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card2);border:1px solid var(--ui);border-radius:999px;padding:3px}
.seg button{position:relative;z-index:1;border:0;background:none;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap;transition:color .2s}
.seg button.on{color:var(--ink)}.seg .th{position:absolute;z-index:0;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));border-radius:999px;background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.14);transform:translateX(calc(100% * var(--i)));transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.seg.sm button{padding:4px 10px;font-size:12px}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px}.step button{width:34px;height:34px;border-radius:999px;border:1px solid var(--ui);background:var(--card);font-size:17px;line-height:1}
.step b{min-width:118px;text-align:center;font-size:15px}.step select{border:1px solid var(--ui);background:var(--card);border-radius:10px;padding:6px 8px;font-size:13px}
.stamp{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute)}.stamp i{width:7px;height:7px;border-radius:50%;background:var(--gain)}
/* donut */
.dwrap{display:grid;grid-template-columns:minmax(150px,210px) 1fr;gap:18px;align-items:center}@media (max-width:520px){.dwrap{grid-template-columns:1fr}.donut{max-width:230px;margin:0 auto}}
.donut{position:relative;aspect-ratio:1}.donut svg{width:100%;height:100%;display:block;overflow:visible}
.dseg{transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1),stroke-width .2s;cursor:pointer}.dseg.on{stroke-width:24}
.dring{transition:stroke-dasharray .3s,stroke-dashoffset .3s}
.dcen{position:absolute;inset:22%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.dcen small{font-size:11.5px;color:var(--mute);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dcen b{font-size:20px;letter-spacing:-.02em}.dcen i{font-style:normal;font-size:12px;color:var(--mute)}
.leg{display:flex;flex-direction:column;gap:2px}
.lrow{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;padding:7px 8px;border-radius:10px;border:0;background:none;text-align:left;width:100%;font-size:13.5px}
.lrow:hover,.lrow.on{background:var(--card2)}.lrow i{width:12px;height:12px;border-radius:4px;background:var(--c)}.lrow i.h{background:repeating-linear-gradient(45deg,var(--ui) 0 3px,var(--mute) 3px 4.5px)}
.lrow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lrow b{font-weight:600}.lrow em{font-style:normal;color:var(--mute);font-size:12px;min-width:42px;text-align:right}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px}.crumb button{border:0;background:var(--ui);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
/* biểu đồ vùng */
.area{width:100%;overflow:hidden}.area svg{display:block}.area text,.cbar text{fill:var(--mute);font-size:10.5px;font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute);margin-top:8px}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:14px;height:3px;border-radius:2px;background:var(--c)}
#tip{position:fixed;z-index:40;pointer-events:none;background:var(--card);border:1px solid var(--ui);border-radius:12px;padding:8px 11px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.18);opacity:0;transition:opacity .12s;min-width:150px}
#tip.on{opacity:1}#tip b{display:block;margin-bottom:3px}#tip .r{display:flex;justify-content:space-between;gap:14px}#tip .r i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--c)}#tip .r b{display:inline;margin:0}
/* vòng điểm */
.ring{position:relative}.ring svg{width:100%;height:100%}.rgo{transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1)}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.rc b{font-size:clamp(28px,4vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1}.rc small{font-size:12px;color:var(--mute);margin-top:4px}
.hhero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}.hhero h2{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
.pill4{display:grid;gap:14px}@media (min-width:700px){.pill4{grid-template-columns:1fr 1fr}}
.ptop{display:flex;align-items:center;gap:12px;margin-bottom:10px}.ptop .ring .rc b{font-size:17px}.ptop h4{margin:0;font-size:15px}.ptop small{color:var(--mute);font-size:12px}
.met{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--ui);font-size:13px}.met span{color:var(--ink2)}.met b{text-align:right}.met small{grid-column:1/-1;color:var(--mute);font-size:11.5px;display:flex;align-items:center;gap:8px}
.mbar{flex:1;height:5px;border-radius:4px;background:var(--ui);overflow:hidden}.mbar u{display:block;height:100%;width:var(--w,0%);background:var(--c);border-radius:4px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
/* cột tăng giảm */
.cbar{display:flex;flex-direction:column;gap:3px}
.crow{display:grid;grid-template-columns:minmax(96px,30%) 1fr 1fr minmax(64px,auto);align-items:center;gap:0;font-size:13px;padding:4px 0}
.crow .n{padding-right:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crow .l,.crow .r{height:16px;position:relative}.crow .l{border-right:1px solid var(--ui2)}
.crow .l u,.crow .r u{position:absolute;top:2px;bottom:2px;width:var(--w,0%);transition:width .8s cubic-bezier(.2,.8,.2,1)}.crow .l u{right:0;background:var(--gain);border-radius:4px 0 0 4px}.crow .r u{left:0;background:var(--loss);border-radius:0 4px 4px 0}
.crow b{text-align:right;font-size:12.5px}.crow b.up{color:var(--loss)}.crow b.down{color:var(--gain)}
/* bar list */
.hb{display:grid;grid-template-columns:minmax(90px,34%) 1fr auto;gap:10px;align-items:center;margin:9px 0;font-size:13.5px}
.hb .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hb .tr{height:8px;border-radius:6px;background:var(--ui);position:relative;overflow:hidden}.hb .tr u{position:absolute;left:0;top:0;bottom:0;width:var(--w,0%);border-radius:6px;background:var(--c);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.hb b{font-size:13.5px;text-align:right}.hb small{display:block;color:var(--mute);font-size:11px;font-weight:500}
/* Bắp */
.bap{display:flex;gap:14px;align-items:flex-start}.bap svg.meo{width:74px;height:74px;flex:none}
.bub{flex:1;background:var(--card2);border:1px solid var(--ui);border-radius:18px 18px 18px 6px;padding:12px 14px}.bub p{margin:0;font-size:14.5px;line-height:1.55}
.bub .who{font-size:11.5px;font-weight:700;color:var(--brand);margin-bottom:3px;display:flex;justify-content:space-between;gap:8px}.bub .who button{border:0;background:none;color:var(--mute);font-size:12px;font-weight:600;padding:0}
.meo .eye{animation:bl 5s infinite;transform-origin:center;transform-box:fill-box}@keyframes bl{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.meo .tail{animation:tl 3s ease-in-out infinite;transform-origin:20% 90%;transform-box:fill-box}@keyframes tl{50%{transform:rotate(9deg)}}
.ai h5{margin:14px 0 6px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}.ai ul{margin:0;padding-left:18px}.ai li{margin:4px 0;font-size:14px}.ai p{margin:0;font-size:14.5px;line-height:1.6}
.todo{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--ui);font-size:14px}.todo b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px}.todo small{display:block;color:var(--mute);font-size:12.5px}
.shimmer{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--ui) 0%,var(--card2) 50%,var(--ui) 100%);background-size:200% 100%;animation:sh2 1.2s infinite;margin:8px 0}@keyframes sh2{to{background-position:-200% 0}}
/* đầu tư */
.hold{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:11px 4px;border-top:1px solid var(--ui);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.hold:first-child{border-top:0}.tk{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:var(--c)}
.hold .nm{min-width:0}.hold .nm b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hold .nm>small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hold .v small{display:block;white-space:nowrap}.hold .v{text-align:right}.hold .v b{display:block;font-size:14px}.hold svg.sp{width:80px;height:30px}
@media (max-width:520px){.hold{grid-template-columns:auto 1fr auto}.hold svg.sp{display:none}}
.up{color:var(--gain)}.down{color:var(--loss)}
/* chung */
.btn{border:1px solid var(--ui);border-radius:999px;padding:10px 16px;font-weight:600;background:var(--card);font-size:14px}.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}.btn.full{width:100%}.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.del{color:var(--loss);border-color:color-mix(in oklab,var(--loss) 40%,transparent)}
.row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--ui);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}.row:first-child{border-top:0}
.row .nm{flex:1;min-width:0}.row .nm b{display:block;font-size:14px;font-weight:600}.row .nm small{color:var(--mute);font-size:12px}.row .v{text-align:right;font-weight:700}.row .v small{display:block;font-weight:500;color:var(--mute);font-size:11.5px}
.goal{border:1px solid var(--ui);background:var(--bg);border-radius:16px;padding:14px;margin-bottom:10px}.goal .top{display:flex;justify-content:space-between;gap:10px}.goal b{font-size:15px}.goal .top small{display:block;color:var(--mute);font-size:12px}
.prog{height:8px;border-radius:6px;background:var(--ui);overflow:hidden;margin:12px 0 8px}.prog u{display:block;height:100%;width:var(--w,0%);border-radius:6px;background:var(--g-tichluy);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute)}.meta b{font-size:12px;color:var(--ink)}
.day{font-size:12px;font-weight:700;color:var(--mute);margin:14px 2px 2px;display:flex;justify-content:space-between}
.tx{display:flex;gap:12px;align-items:center;padding:10px 2px;border-top:1px solid var(--ui)}.tx .tm{font-size:12px;color:var(--mute);width:40px;flex:none}.tx .nm{flex:1;min-width:0}.tx .nm b{display:block;font-size:14px;font-weight:600}.tx .nm small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .v{font-weight:700;font-size:14px}.tx .v.in{color:var(--g-thu)}.tx button{border:0;background:none;color:var(--mute);font-size:12px;padding:4px}
.note{font-size:12.5px;color:var(--mute);line-height:1.55}.nlist div{padding:8px 0;border-top:1px solid var(--ui);font-size:13px}.nlist div:first-child{border-top:0}.nlist span{color:var(--mute)}
.chips{display:flex;gap:7px;flex-wrap:wrap}.chips button{border:1px solid var(--ui);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500}.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{text-align:center;padding:24px 10px}.empty p{color:var(--mute);margin:8px 0 16px}
/* sheet */
#sheet{position:fixed;inset:0;background:rgba(16,15,15,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}#sheet.on{display:flex}
#sheet>div{background:var(--bg);width:100%;max-width:640px;border-radius:24px 24px 0 0;padding:16px 18px calc(var(--safe-b) + 22px);max-height:90vh;overflow-y:auto;animation:up .25s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){#sheet{align-items:center}#sheet>div{border-radius:24px;max-height:86vh}}@keyframes up{from{transform:translateY(40px);opacity:0}}
#sheet h2{margin:0 0 4px;font-size:20px;letter-spacing:-.02em}#sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--ui2);margin:0 auto 12px}
.f{margin:12px 0}.f label{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--ui);background:var(--card);border-radius:12px;padding:11px 12px;font-size:15px;outline:none}.f input:focus,.f select:focus{border-color:var(--ink2)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.amt{font-size:30px!important;font-weight:700;text-align:right;letter-spacing:-.02em}.amtp{font-size:12.5px;color:var(--mute);text-align:right;margin-top:4px;min-height:18px}
.ck{display:flex;flex-wrap:wrap;gap:6px}.ck label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ui);border-radius:999px;padding:6px 11px;font-size:13px;color:var(--ink);margin:0;background:var(--card)}.ck input{width:auto;margin:0}
.mapr{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--ui);font-size:13.5px}.mapr span{flex:1}.mapr select{width:auto;padding:6px 8px;font-size:13px;border-radius:9px;border:1px solid var(--ui);background:var(--card)}
.gdot{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 96px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:90vw;animation:up .25s}
/* khoá + cổng đăng nhập */
#gate,#lock{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
#gate{z-index:30}#lock{z-index:28}#gate img,#lockIn img{width:76px;height:76px;border-radius:22px}#gate h2,#lockIn h2{margin:14px 0 4px;font-size:22px;letter-spacing:-.02em}#gate p{color:var(--mute);margin:0 0 20px;max-width:340px}
#lockIn{width:100%;max-width:320px}.lsub{color:var(--mute);font-size:13px;margin:0 0 20px;min-height:18px}.lmsg{color:var(--loss);font-size:13px;min-height:20px;margin:12px 0 6px}
.pdots{display:flex;justify-content:center;gap:14px}.pdots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--mute);transition:all .15s}.pdots i.on{background:var(--ink);border-color:var(--ink);transform:scale(1.1)}
.shake{animation:shk .35s}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}.pad button{height:60px;border-radius:999px;border:1px solid var(--ui);background:var(--card);font-size:23px;font-weight:600}.pad button:active{background:var(--ui)}.pad button.sm{font-size:13.5px;color:var(--mute);background:none;border:0}
</style>
</head>
<body>
<div id="gate"><img src="icon-192.png" alt=""><h2>Ngân hàng Mintun</h2><p>Tiền vào từ đâu, tiền đi đâu, sức khoẻ tài chính và danh mục đầu tư. Bắp đọc sổ thu chi của Tuấn.</p><button class="btn pri" id="signin">Đăng nhập bằng Google</button><p class="note" id="gateMsg" style="margin-top:14px"></p></div>
<div id="lock" hidden><div id="lockIn"></div></div>
<div id="app">
 <header class="top">
  <img class="logo" src="icon-192.png" alt="">
  <div class="t"><h1>Ngân hàng Mintun</h1><small id="syncTxt">Chưa cập nhật</small></div>
  <button class="ib" id="bHide" aria-label="Ẩn/hiện số tiền" title="Ẩn/hiện số tiền"></button>
  <button class="ib" id="bLock" aria-label="Khoá" title="Khoá"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
  <button class="ib" id="bSet" aria-label="Cài đặt" title="Cài đặt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  <button class="pbtn" id="bUpd" title="Đọc lại sheet, giá và hỏi Bắp AI"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.5-4.5L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.5 4.5L20 16"/><path d="M20 20v-4h-4"/></svg><span>Cập nhật</span><i class="dot" id="dueDot" hidden></i></button>
 </header>
 <nav id="tabs"><div>
  <button data-tab="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Tổng quan</button>
  <button data-tab="health"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>Sức khoẻ</button>
  <button data-tab="add" class="add" aria-label="Ghi thu chi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-tab="inv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>Đầu tư</button>
  <button data-tab="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>Mục tiêu</button>
  <button data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Sổ ghi</button>
 </div></nav>
 <main id="view"></main>
</div>
<div id="sheet"><div id="sheetIn"></div></div>
<div id="tip"></div>
<script src="engine.js"></script>
<script src="charts.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
